const FONT_BODY = '"Saira", system-ui, sans-serif';
const COLORS = {
  ball: '#e4ff3a',
  blue: '#45a8ff',
  red: '#ff5c50',
  ink: '#e8f0f7'
};

// Focos sobre los laterales (6,5 m), generan las 4 sombras típicas de un partido nocturno
const LIGHTS = [
  { x: 210, y: 14, z: 262 }, { x: 710, y: 14, z: 262 },
  { x: 210, y: 506, z: 262 }, { x: 710, y: 506, z: 262 }
];

// ---------- Cámara: inclinada (pitch) y girada en diagonal (yaw) ----------
const cam = { ready: false, team: -1 };

function setupCamera(team) {
  const yaw = (team === 1 ? -1 : 1) * 0.36;   // ~21°: tu equipo queda más cerca de la cámara
  const pitch = 0.83;                          // ~48° de inclinación, al estilo MOBA
  const dist = 1900;
  const target = { x: COURT.netX, y: COURT.midY + 8, z: 24 };
  const hx = Math.sin(yaw), hy = -Math.cos(yaw);
  const f = { x: hx * Math.cos(pitch), y: hy * Math.cos(pitch), z: -Math.sin(pitch) };
  const r = { x: Math.cos(yaw), y: Math.sin(yaw), z: 0 };
  const u = { x: hx * Math.sin(pitch), y: hy * Math.sin(pitch), z: Math.cos(pitch) };
  const C = { x: target.x - f.x * dist, y: target.y - f.y * dist, z: target.z - f.z * dist };
  Object.assign(cam, { team, yaw, pitch, f, r, u, C, F: 1, cx: 0, cy: 0 });

  // Encuadre automático: cancha + paredes completas dentro de la vista
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const corners = [[60, 40], [860, 40], [60, 480], [860, 480]];
  for (const [x, y] of corners) {
    for (const z of [0, WALL_H_TALL]) {
      const rx = x - C.x, ry = y - C.y, rz = z - C.z;
      const d = rx * f.x + ry * f.y + rz * f.z;
      const nx = (rx * r.x + ry * r.y) / d;
      const ny = -(rx * u.x + ry * u.y + rz * u.z) / d;
      minX = Math.min(minX, nx); maxX = Math.max(maxX, nx);
      minY = Math.min(minY, ny); maxY = Math.max(maxY, ny);
    }
  }
  const padL = 30, padR = 30, padT = 34, padB = 20;
  const F = Math.min((VIEW_W - padL - padR) / (maxX - minX), (VIEW_H - padT - padB) / (maxY - minY));
  cam.F = F;
  cam.cx = padL + (VIEW_W - padL - padR) / 2 - F * (minX + maxX) / 2;
  cam.cy = padT + (VIEW_H - padT - padB) / 2 - F * (minY + maxY) / 2;
  cam.ready = true;
}

// Mundo → pantalla. s = píxeles de pantalla por píxel de mundo a esa profundidad
function P(x, y, z) {
  const rx = x - cam.C.x, ry = y - cam.C.y, rz = z - cam.C.z;
  const d = rx * cam.f.x + ry * cam.f.y + rz * cam.f.z;
  const s = cam.F / d;
  return {
    x: cam.cx + (rx * cam.r.x + ry * cam.r.y) * s,
    y: cam.cy - (rx * cam.u.x + ry * cam.u.y + rz * cam.u.z) * s,
    d, s
  };
}

// Pantalla → suelo (z = 0)
function unprojectGround(sx, sy) {
  const a = (sx - cam.cx) / cam.F;
  const b = -(sy - cam.cy) / cam.F;
  const dx = cam.f.x + a * cam.r.x + b * cam.u.x;
  const dy = cam.f.y + a * cam.r.y + b * cam.u.y;
  const dz = cam.f.z + b * cam.u.z;
  if (dz > -1e-4) return null;
  const t = -cam.C.z / dz;
  return { x: cam.C.x + t * dx, y: cam.C.y + t * dy };
}

function pathPts(c, pts, close = true) {
  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
  if (close) c.closePath();
}

function groundCircle(x, y, r, z = 0, n = 30) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    pts.push(P(x + Math.cos(a) * r, y + Math.sin(a) * r, z));
  }
  return pts;
}

// ---------- Ruido procedural para el césped ----------
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let tx = x - xi, ty = y - yi;
  tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
}

function makeGrid(x0, y0, x1, y1, step, fn) {
  const w = Math.ceil((x1 - x0) / step) + 1, h = Math.ceil((y1 - y0) / step) + 1;
  const data = new Float32Array(w * h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) data[j * w + i] = fn(x0 + i * step, y0 + j * step);
  return { x0, y0, step, w, h, data };
}
function sampleGrid(g, x, y) {
  let fx = (x - g.x0) / g.step, fy = (y - g.y0) / g.step;
  if (fx < 0) fx = 0; else if (fx > g.w - 1.001) fx = g.w - 1.001;
  if (fy < 0) fy = 0; else if (fy > g.h - 1.001) fy = g.h - 1.001;
  const ix = fx | 0, iy = fy | 0, tx = fx - ix, ty = fy - iy, i = iy * g.w + ix, d = g.data;
  return (d[i] * (1 - tx) + d[i + 1] * tx) * (1 - ty) + (d[i + g.w] * (1 - tx) + d[i + g.w + 1] * tx) * ty;
}

function lightIrradiance(x, y) {
  let E = 0;
  for (const L of LIGHTS) {
    const dx = x - L.x, dy = y - L.y;
    const d2 = dx * dx + dy * dy + L.z * L.z;
    E += L.z / (d2 * Math.sqrt(d2));
  }
  return E;
}

let LUM_GRID = null, WEAR_GRID = null;
function buildFieldGrids() {
  if (LUM_GRID) return;
  LUM_GRID = makeGrid(-900, -900, 1820, 1400, 10, (x, y) => Math.min(1.3, 0.3 + 0.8 * lightIrradiance(x, y) / 1.6e-5));
  const WEAR = [
    [112, 150, 62, 1], [112, 372, 62, 1], [808, 150, 62, 1], [808, 372, 62, 1],
    [150, 260, 70, 0.55], [770, 260, 70, 0.55],
    [405, 165, 45, 0.6], [405, 355, 45, 0.6], [515, 165, 45, 0.6], [515, 355, 45, 0.6]
  ];
  WEAR_GRID = makeGrid(40, 20, 880, 500, 4, (x, y) => {
    let w = 0;
    for (const [cx, cy, r, k] of WEAR) w += k * Math.exp(-((x - cx) ** 2 + (y - cy) ** 2) / (2 * r * r));
    const n = vnoise(x * 0.05, y * 0.05);
    return Math.min(1, w * (0.55 + 0.9 * n));
  });
}

function lineCov(d, fp, w) {
  const lo = Math.max(d - fp * 0.5, -w * 0.5), hi = Math.min(d + fp * 0.5, w * 0.5);
  return hi > lo ? (hi - lo) / Math.max(fp, 1e-3) : 0;
}

// Suelo renderizado píxel a píxel: rayo desde cada píxel al plano del suelo.
// Textura con corrección de perspectiva, antialias de líneas y luz de focos.
function renderGround(lctx, W, H) {
  buildFieldGrids();
  const S = W / VIEW_W;
  const img = lctx.createImageData(W, H);
  const data = img.data;
  const { f, r, u, C, F, cx, cy } = cam;
  const prevX = new Float32Array(W), prevY = new Float32Array(W);
  let havePrev = false;

  for (let py = 0; py < H; py++) {
    const ly = (py + 0.5) / S;
    const b = -(ly - cy) / F;
    const dz = f.z + b * u.z;
    let o = py * W * 4;
    if (dz > -1e-4) {
      for (let px = 0; px < W; px++, o += 4) { data[o] = 6; data[o + 1] = 12; data[o + 2] = 20; data[o + 3] = 255; }
      havePrev = false;
      continue;
    }
    const t = -C.z / dz;
    const kx = t * r.x / (F * S), ky = t * r.y / (F * S);
    const a0 = (0.5 / S - cx) / F;
    let X = C.x + t * (f.x + a0 * r.x + b * u.x);
    let Y = C.y + t * (f.y + a0 * r.y + b * u.y);

    for (let px = 0; px < W; px++, X += kx, Y += ky, o += 4) {
      let fx = Math.abs(kx), fy = Math.abs(ky);
      if (havePrev) { fx += Math.abs(X - prevX[px]); fy += Math.abs(Y - prevY[px]); }
      else { fx *= 2.2; fy *= 2.2; }
      prevX[px] = X; prevY[px] = Y;
      const fp = fx > fy ? fx : fy;

      let lum = sampleGrid(LUM_GRID, X, Y);
      let R, G, B;

      const inCourt = X >= 60 && X <= 860 && Y >= 40 && Y <= 480;
      if (inCourt) {
        // Césped sintético azul con arena
        R = 31; G = 88; B = 170;
        const n1 = vnoise(X * 0.013, Y * 0.013) - 0.5;
        const n2 = vnoise(X * 0.07 + 31.7, Y * 0.07 + 17.3) - 0.5;
        let k = 1 + n1 * 0.08 + n2 * 0.05;
        // Rollos de césped (franjas sutiles de instalación)
        k *= ((Math.floor((Y - 40) / 110) & 1) ? 1.02 : 0.985);
        const gAmt = clamp(1.25 - fp * 0.9, 0, 1);
        if (gAmt > 0) {
          k *= 1 + (hash2(Math.floor(X * 1.7), Math.floor(Y * 1.7)) - 0.5) * 0.18 * gAmt;
        }
        R *= k; G *= k; B *= k;
        // Zonas gastadas: la arena aflora donde más se pisa
        const w = sampleGrid(WEAR_GRID, X, Y) * 0.26;
        R = R + (150 - R) * w; G = G + (146 - G) * w; B = B + (138 - B) * w;
        if (gAmt > 0 && hash2(Math.floor(X * 2.3) + 7, Math.floor(Y * 2.3) + 3) > 0.982) {
          const sAmt = 0.4 * gAmt;
          R += (196 - R) * sAmt; G += (184 - G) * sAmt; B += (150 - B) * sAmt;
        }
        // Oclusión ambiental junto a las paredes
        const dw = Math.min(X - 60, 860 - X, Y - 40, 480 - Y);
        lum *= 1 - 0.36 * Math.exp(-dw / 6);
        // Líneas reglamentarias (5 cm)
        let cov = Math.max(lineCov(X - COURT.serviceLeft, fx, 2), lineCov(X - COURT.serviceRight, fx, 2));
        if (X >= COURT.serviceLeft - 8 && X <= COURT.serviceRight + 8) cov = Math.max(cov, lineCov(Y - COURT.midY, fy, 2));
        if (cov > 0) {
          const c = cov * 0.94;
          R += (236 - R) * c; G += (240 - G) * c; B += (244 - B) * c;
        }
      } else {
        const dOut = Math.max(60 - X, X - 860, 40 - Y, Y - 480);
        if (dOut < 70) {
          // Pasillo exterior con el mismo césped, más apagado
          R = 24; G = 64; B = 124;
          const n = vnoise(X * 0.02, Y * 0.02) - 0.5;
          const k = 0.9 + n * 0.12;
          R *= k; G *= k; B *= k;
          lum *= 1 - 0.4 * Math.exp(-dOut / 4);
        } else {
          // Piso del club
          const n = vnoise(X * 0.01, Y * 0.01) - 0.5;
          const k = 1 + n * 0.25;
          R = 30 * k; G = 38 * k; B = 50 * k;
          const fade = 0.25 + 0.75 * Math.exp(-(dOut - 70) / 260);
          lum *= fade;
          if (dOut < 74) lum *= 0.75;
        }
      }
      // Luz cálida de focos, sombra fría
      R = R * lum + (lum - 1) * 10;
      G = G * lum + (lum - 1) * 6;
      B = B * lum;
      data[o] = R < 0 ? 0 : (R > 255 ? 255 : R);
      data[o + 1] = G < 0 ? 0 : (G > 255 ? 255 : G);
      data[o + 2] = B < 0 ? 0 : (B > 255 ? 255 : B);
      data[o + 3] = 255;
    }
    havePrev = true;
  }
  lctx.putImageData(img, 0, 0);
}

// ---------- Paredes: cristal templado + malla metálica ----------
const WALLS = {
  F: { kind: 'side', pt: (a, z) => ({ x: a, y: COURT.y, z }) },
  N: { kind: 'side', pt: (a, z) => ({ x: a, y: COURT.y + COURT.h, z }) },
  L: { kind: 'back', pt: (a, z) => ({ x: COURT.x, y: a, z }) },
  R: { kind: 'back', pt: (a, z) => ({ x: COURT.x + COURT.w, y: a, z }) }
};

function wallPanels(kind) {
  if (kind === 'back') {
    const out = [];
    for (let i = 0; i < 5; i++) out.push({ a0: 40 + i * 88, a1: 40 + (i + 1) * 88, glass: GLASS_H, top: WALL_H_TALL });
    return out;
  }
  const g = COURT.glassLength / 2;
  const out = [
    { a0: 60, a1: 60 + g, glass: GLASS_H, top: WALL_H_TALL },
    { a0: 60 + g, a1: 60 + 2 * g, glass: GLASS_STEP_H, top: WALL_H_LOW }
  ];
  const m0 = 60 + 2 * g, m1 = 860 - 2 * g;
  for (let i = 0; i < 6; i++) out.push({ a0: m0 + (m1 - m0) * i / 6, a1: m0 + (m1 - m0) * (i + 1) / 6, glass: 0, top: WALL_H_LOW });
  out.push({ a0: 860 - 2 * g, a1: 860 - g, glass: GLASS_STEP_H, top: WALL_H_LOW });
  out.push({ a0: 860 - g, a1: 860, glass: GLASS_H, top: WALL_H_TALL });
  return out;
}

function drawWall(c, key, alpha) {
  const wall = WALLS[key];
  const panels = wallPanels(wall.kind);
  const pt = (a, z) => { const q = wall.pt(a, z); return P(q.x, q.y, q.z); };

  for (const pn of panels) {
    // Cristal
    if (pn.glass > 0) {
      const q = [pt(pn.a0, 0), pt(pn.a1, 0), pt(pn.a1, pn.glass), pt(pn.a0, pn.glass)];
      pathPts(c, q);
      c.fillStyle = `rgba(150, 205, 255, ${0.07 * alpha})`;
      c.fill();
      const gr = c.createLinearGradient(q[0].x, q[0].y, q[2].x, q[2].y);
      gr.addColorStop(0, 'rgba(255,255,255,0)');
      gr.addColorStop(0.38, 'rgba(255,255,255,0)');
      gr.addColorStop(0.46, `rgba(225,240,255,${0.12 * alpha})`);
      gr.addColorStop(0.52, 'rgba(255,255,255,0)');
      gr.addColorStop(0.63, `rgba(225,240,255,${0.06 * alpha})`);
      gr.addColorStop(0.68, 'rgba(255,255,255,0)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = gr;
      c.fill();
      // Canto superior del vidrio
      c.strokeStyle = `rgba(210, 236, 255, ${0.55 * alpha})`;
      c.lineWidth = Math.max(0.8, 1.2 * q[3].s);
      c.beginPath(); c.moveTo(q[3].x, q[3].y); c.lineTo(q[2].x, q[2].y); c.stroke();
      // Junta inferior con el césped
      c.strokeStyle = `rgba(0, 0, 0, ${0.45 * alpha})`;
      c.lineWidth = Math.max(0.8, 1.5 * q[0].s);
      c.beginPath(); c.moveTo(q[0].x, q[0].y); c.lineTo(q[1].x, q[1].y); c.stroke();
    }
    // Malla
    if (pn.top > pn.glass) {
      const z0 = pn.glass, z1 = pn.top;
      const q = [pt(pn.a0, z0), pt(pn.a1, z0), pt(pn.a1, z1), pt(pn.a0, z1)];
      pathPts(c, q);
      c.fillStyle = `rgba(14, 22, 32, ${0.16 * alpha})`;
      c.fill();
      c.strokeStyle = `rgba(150, 168, 188, ${0.2 * alpha})`;
      c.lineWidth = 0.7;
      c.beginPath();
      const step = 8;
      for (let a = pn.a0 + step; a < pn.a1 - 1; a += step) {
        const p0 = pt(a, z0), p1 = pt(a, z1);
        c.moveTo(p0.x, p0.y); c.lineTo(p1.x, p1.y);
      }
      for (let z = z0 + step; z < z1 - 1; z += step) {
        const p0 = pt(pn.a0, z), p1 = pt(pn.a1, z);
        c.moveTo(p0.x, p0.y); c.lineTo(p1.x, p1.y);
      }
      c.stroke();
      // Marco de la malla
      c.strokeStyle = `rgba(22, 28, 36, ${0.9 * alpha})`;
      c.lineWidth = Math.max(1, 2.2 * q[3].s);
      c.beginPath();
      c.moveTo(q[0].x, q[0].y); c.lineTo(q[1].x, q[1].y);
      c.moveTo(q[3].x, q[3].y); c.lineTo(q[2].x, q[2].y);
      c.stroke();
    }
  }

  // Postes de acero en cada junta
  const posts = new Map();
  for (const pn of panels) {
    posts.set(pn.a0, Math.max(posts.get(pn.a0) || 0, pn.top));
    posts.set(pn.a1, Math.max(posts.get(pn.a1) || 0, pn.top));
  }
  for (const [a, h] of posts) {
    const b0 = pt(a, 0), b1 = pt(a, h);
    const w = Math.max(1.2, 3.2 * (b0.s + b1.s) / 2);
    c.lineCap = 'butt';
    c.strokeStyle = `rgba(20, 26, 34, ${0.95 * alpha})`;
    c.lineWidth = w;
    c.beginPath(); c.moveTo(b0.x, b0.y); c.lineTo(b1.x, b1.y); c.stroke();
    c.strokeStyle = `rgba(190, 210, 230, ${0.18 * alpha})`;
    c.lineWidth = Math.max(0.6, w * 0.3);
    c.beginPath(); c.moveTo(b0.x - w * 0.25, b0.y); c.lineTo(b1.x - w * 0.25, b1.y); c.stroke();
  }
}

function drawNetShadows(c) {
  const hc = NET_H * ZS;
  for (const L of LIGHTS) {
    const k = L.z / (L.z - hc);
    const pts = [];
    for (let y = COURT.y; y <= COURT.y + COURT.h; y += 20) pts.push(P(COURT.netX, y, 0));
    for (let y = COURT.y + COURT.h; y >= COURT.y; y -= 20) {
      const sx = L.x + (COURT.netX - L.x) * k, sy = clamp(L.y + (y - L.y) * k, COURT.y, COURT.y + COURT.h);
      pts.push(P(sx, sy, 0));
    }
    pathPts(c, pts);
    c.fillStyle = 'rgba(2, 10, 26, 0.09)';
    c.fill();
  }
}

function drawFarLights(c) {
  // Postes de iluminación detrás del lateral del fondo
  for (const L of LIGHTS) {
    if (L.y > COURT.midY) continue;
    const base = P(L.x, L.y - 6, 0), top = P(L.x, L.y - 6, L.z + 6);
    c.strokeStyle = '#141b24';
    c.lineWidth = Math.max(1.5, 4 * top.s);
    c.lineCap = 'butt';
    c.beginPath(); c.moveTo(base.x, base.y); c.lineTo(top.x, top.y); c.stroke();
    // Proyector inclinado hacia la cancha
    const q = [P(L.x - 14, L.y + 4, L.z - 6), P(L.x + 14, L.y + 4, L.z - 6), P(L.x + 14, L.y - 3, L.z + 8), P(L.x - 14, L.y - 3, L.z + 8)];
    pathPts(c, q);
    c.fillStyle = '#1b232d';
    c.fill();
    const face = [P(L.x - 12, L.y + 5, L.z - 4), P(L.x + 12, L.y + 5, L.z - 4), P(L.x + 12, L.y + 1, L.z + 4), P(L.x - 12, L.y + 1, L.z + 4)];
    pathPts(c, face);
    c.fillStyle = '#fff8df';
    c.fill();
    const mid = P(L.x, L.y + 4, L.z);
    c.save();
    c.globalCompositeOperation = 'lighter';
    let g = c.createRadialGradient(mid.x, mid.y, 0, mid.x, mid.y, 90);
    g.addColorStop(0, 'rgba(255, 244, 210, 0.55)');
    g.addColorStop(0.25, 'rgba(255, 236, 190, 0.16)');
    g.addColorStop(1, 'rgba(255, 236, 190, 0)');
    c.fillStyle = g;
    c.fillRect(mid.x - 90, mid.y - 90, 180, 180);
    // Haz de luz hacia la cancha
    const g1 = P(L.x - 120, L.y + 300, 0), g2 = P(L.x + 120, L.y + 300, 0);
    const beam = c.createLinearGradient(mid.x, mid.y, (g1.x + g2.x) / 2, (g1.y + g2.y) / 2);
    beam.addColorStop(0, 'rgba(255, 240, 205, 0.07)');
    beam.addColorStop(1, 'rgba(255, 240, 205, 0)');
    c.fillStyle = beam;
    c.beginPath(); c.moveTo(mid.x - 4, mid.y); c.lineTo(g1.x, g1.y); c.lineTo(g2.x, g2.y); c.lineTo(mid.x + 4, mid.y); c.closePath();
    c.fill();
    c.restore();
  }
}

// ---------- Capas estáticas en caché ----------
const staticLayer = document.createElement('canvas');
const fgLayer = document.createElement('canvas');
const groundLayer = document.createElement('canvas');
let renderScale = 1;

function rebuildLayers() {
  if (!cam.ready) return;
  const W = canvas.width, H = canvas.height;
  renderScale = W / VIEW_W;
  for (const l of [staticLayer, fgLayer]) { l.width = W; l.height = H; }

  const s = staticLayer.getContext('2d');
  const gScale = Math.min(renderScale, 1.5);
  groundLayer.width = Math.round(VIEW_W * gScale);
  groundLayer.height = Math.round(VIEW_H * gScale);
  renderGround(groundLayer.getContext('2d'), groundLayer.width, groundLayer.height);
  s.setTransform(1, 0, 0, 1, 0, 0);
  s.imageSmoothingEnabled = true;
  s.imageSmoothingQuality = 'high';
  s.drawImage(groundLayer, 0, 0, W, H);
  s.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  drawNetShadows(s);
  drawFarLights(s);
  drawWall(s, 'F', 1);
  // La pared de fondo más lejana se dibuja primero
  const lFar = P(COURT.x, COURT.midY, 0).d > P(COURT.x + COURT.w, COURT.midY, 0).d;
  drawWall(s, lFar ? 'L' : 'R', 1);
  drawWall(s, lFar ? 'R' : 'L', 1);

  const g = fgLayer.getContext('2d');
  g.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  g.clearRect(0, 0, VIEW_W, VIEW_H);
  drawWall(g, 'N', 0.42);
  const v = g.createRadialGradient(VIEW_W / 2, VIEW_H * 0.52, VIEW_W * 0.32, VIEW_W / 2, VIEW_H * 0.52, VIEW_W * 0.78);
  v.addColorStop(0, 'rgba(3, 8, 16, 0)');
  v.addColorStop(1, 'rgba(3, 8, 16, 0.55)');
  g.fillStyle = v;
  g.fillRect(0, 0, VIEW_W, VIEW_H);
}

function resizeCanvas() {
  const rect = wrapper.getBoundingClientRect();
  if (rect.width < 10) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(rect.width * dpr);
  const h = Math.round(w * VIEW_H / VIEW_W);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    rebuildLayers();
  }
}

let resizeTimer = null;
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resizeCanvas, 120);
}).observe(wrapper);

// ---------- Efectos (solo visuales, viven en cada cliente) ----------
const fx = {
  particles: [],
  rings: [],
  ripples: [],
  impacts: [],
  shake: 0,
  net: { amp: 0, y0: 260, t: 0, dir: 1 },
  ballSpin: 0,
  players: [0, 1, 2, 3].map(() => ({
    phase: 0, facing: null, lastX: null, lastY: null, vx: 0, vy: 0,
    lastCooldown: 0, swingT: -1, swingKind: 'drive', from: null,
    pose: { beta: 0.35, z: 44, reach: 11, tilt: 0.9 }, tips: [], dust: 0
  })),
  servingTeam: -1
};

function spawnSand(x, y, n, power = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (0.4 + Math.random() * 1.2) * power;
    fx.particles.push({
      x, y, z: 1, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: (1.2 + Math.random() * 1.8) * power,
      life: 0, max: 26 + Math.random() * 18, size: 1 + Math.random() * 1.4
    });
  }
}

function onGameEvent(type) {
  const b = state.ball;
  if (type === 'bounce') {
    spawnSand(b.x, b.y, 9);
    fx.rings.push({ x: b.x, y: b.y, t: 0 });
  } else if (type === 'hit' || type === 'lob' || type === 'smash') {
    fx.impacts.push({ x: b.x, y: b.y, z: b.z * ZS + BALL_R, t: 0, big: type === 'smash' });
    if (type === 'smash') fx.shake = 7;
  } else if (type === 'glass') {
    const d = [
      ['L', b.x - COURT.x], ['R', COURT.x + COURT.w - b.x],
      ['F', b.y - COURT.y], ['N', COURT.y + COURT.h - b.y]
    ].sort((p, q) => p[1] - q[1])[0][0];
    const a = (d === 'L' || d === 'R') ? b.y : b.x;
    fx.ripples.push({ wall: d, a, z: b.z * ZS + BALL_R, t: 0 });
  } else if (type === 'fault') {
    if (Math.abs(b.x - COURT.netX) < 30) {
      fx.net = { amp: 7, y0: b.y, t: 0, dir: b.vx >= 0 ? 1 : -1 };
    }
  }
}

function updateFx(dt) {
  for (const p of fx.particles) {
    p.life += dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.vz -= 0.16 * dt;
    if (p.z < 0) { p.z = 0; p.vz *= -0.3; p.vx *= 0.6; p.vy *= 0.6; }
  }
  fx.particles = fx.particles.filter(p => p.life < p.max);
  for (const arr of [fx.rings, fx.ripples, fx.impacts]) for (const e of arr) e.t += dt;
  fx.rings = fx.rings.filter(e => e.t < 26);
  fx.ripples = fx.ripples.filter(e => e.t < 30);
  fx.impacts = fx.impacts.filter(e => e.t < 14);
  fx.shake = Math.max(0, fx.shake - 0.6 * dt);
  if (fx.net.amp > 0) { fx.net.t += dt; fx.net.amp *= Math.pow(0.93, dt); if (fx.net.amp < 0.05) fx.net.amp = 0; }
  const b = state.ball;
  fx.ballSpin += Math.hypot(b.vx, b.vy) * 0.12 * dt;
}

// ---------- Sombras de los 4 focos ----------
function lightWeights(x, y) {
  const ws = [];
  let sum = 0;
  for (const L of LIGHTS) {
    const dx = x - L.x, dy = y - L.y;
    const d2 = dx * dx + dy * dy + L.z * L.z;
    const w = L.z / (d2 * Math.sqrt(d2));
    ws.push(w); sum += w;
  }
  return ws.map(w => w / sum);
}

function drawPlayerShadows(p) {
  const ws = lightWeights(p.x, p.y);
  const H = 74 * PLAYER_SCALE;
  LIGHTS.forEach((L, i) => {
    const k = L.z / (L.z - H);
    const tx = L.x + (p.x - L.x) * k, ty = L.y + (p.y - L.y) * k;
    let dx = tx - p.x, dy = ty - p.y;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const nx = -dy, ny = dx;
    const w0 = 8, w1 = 5.5, wm = 9;
    const mx = p.x + dx * len * 0.45, my = p.y + dy * len * 0.45;
    const poly = [
      P(p.x + nx * w0, p.y + ny * w0, 0), P(mx + nx * wm, my + ny * wm, 0),
      P(tx + nx * w1, ty + ny * w1, 0), P(tx + dx * 4, ty + dy * 4, 0),
      P(tx - nx * w1, ty - ny * w1, 0), P(mx - nx * wm, my - ny * wm, 0),
      P(p.x - nx * w0, p.y - ny * w0, 0)
    ];
    pathPts(ctx, poly);
    const a0 = Math.min(0.26, 0.06 + ws[i] * 0.42);
    const g0 = P(p.x, p.y, 0), g1 = P(tx, ty, 0);
    const gr = ctx.createLinearGradient(g0.x, g0.y, g1.x, g1.y);
    gr.addColorStop(0, `rgba(2, 10, 26, ${a0})`);
    gr.addColorStop(1, `rgba(2, 10, 26, ${a0 * 0.25})`);
    ctx.fillStyle = gr;
    ctx.fill();
  });
  // Sombra de contacto
  pathPts(ctx, groundCircle(p.x, p.y, 12, 0, 22));
  ctx.fillStyle = 'rgba(2, 8, 20, 0.32)';
  ctx.fill();
}

function drawBallShadows(b) {
  const h = b.z * ZS + BALL_R;
  const ws = lightWeights(b.x, b.y);
  LIGHTS.forEach((L, i) => {
    const k = L.z / Math.max(20, L.z - h);
    const sx = L.x + (b.x - L.x) * k, sy = L.y + (b.y - L.y) * k;
    pathPts(ctx, groundCircle(sx, sy, BALL_R * 0.9, 0, 14));
    ctx.fillStyle = `rgba(2, 10, 26, ${0.08 + ws[i] * 0.2})`;
    ctx.fill();
  });
  // Sombra principal bajo la pelota (clave para leer la altura)
  const spread = 1 + h * 0.006;
  pathPts(ctx, groundCircle(b.x, b.y, BALL_R * 1.1 * spread, 0, 18));
  ctx.fillStyle = `rgba(0, 6, 16, ${clamp(0.55 / (1 + h * 0.012), 0.16, 0.55)})`;
  ctx.fill();
}

// ---------- Jugadores con volumen (esqueleto 3D proyectado) ----------
const KITS = [
  { shirt: '#2a8ae6', hi: '#7cc4ff', lo: '#164f8f', shorts: '#13243b', band: '#e4ff3a', rim: '#45a8ff' },
  { shirt: '#e2493e', hi: '#ff9a8c', lo: '#8f241d', shorts: '#2b1517', band: '#ffffff', rim: '#ff5c50' }
];
const SKINS = ['#d6a07a', '#a9714d', '#ecc39f', '#8a5a3c'];
const HAIR = ['#2a1d16', '#140f0c', '#5b3b22', '#1c1512'];
const OUTLINE = 'rgba(4, 10, 20, 0.5)';
const PLAYER_SCALE = 1.14;  // un poco más grandes que la escala real para que se lean bien

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(((n >> 16) & 255) * k, 0, 255) | 0;
  const g = clamp(((n >> 8) & 255) * k, 0, 255) | 0;
  const b = clamp((n & 255) * k, 0, 255) | 0;
  return `rgb(${r},${g},${b})`;
}

function targetPose(p, idx, charging, cr, lob) {
  const b = state.ball;
  const isServer = state.phase === 'SERVE' && state.serverSlot === idx;
  const ballHigh = b.z > SMASH_MIN_Z && Math.abs(p.x - COURT.netX) < 220 &&
    Math.hypot(b.x - p.x, b.y - p.y) < 170 && b.lastHitTeam !== p.team;
  if (charging) {
    if (isServer) return { beta: 0.5 + cr * 1.5, z: 30 - cr * 5, reach: 13, tilt: -0.15, kind: 'serve' };
    if (lob) return { beta: 0.45 + cr * 1.6, z: 36 - cr * 9, reach: 14, tilt: 0.05, kind: 'lob' };
    if (ballHigh) return { beta: 1.5 + cr * 0.55, z: 82 + cr * 5, reach: 5, tilt: 0.85, kind: 'smash' };
    return { beta: 0.45 + cr * 1.95, z: 47 - cr * 3, reach: 14, tilt: 0.45, kind: 'drive' };
  }
  return { beta: 0.32, z: isServer ? 30 : 45, reach: 11, tilt: isServer ? 0.2 : 0.95, kind: 'ready' };
}

const SWING_END = {
  drive: { beta: -1.35, z: 54, reach: 14, tilt: 0.5 },
  lob: { beta: -1.1, z: 76, reach: 13, tilt: 0.85 },
  smash: { beta: -0.55, z: 36, reach: 15, tilt: -0.35 },
  serve: { beta: -0.7, z: 52, reach: 14, tilt: 0.6 }
};
const SWING_FRAMES = 13;

function buildPlayerParts(p, idx, dt, now) {
  const pf = fx.players[idx];
  const kit = KITS[p.team];
  const skin = SKINS[idx % 4];
  const b = state.ball;
  const wf = 0.94 + p.powerStat * 0.3;

  // Velocidad medida desde la posición (sirve igual en host y en clientes)
  if (pf.lastX === null) { pf.lastX = p.x; pf.lastY = p.y; }
  let mvx = (p.x - pf.lastX) / Math.max(dt, 0.25), mvy = (p.y - pf.lastY) / Math.max(dt, 0.25);
  if (Math.hypot(mvx, mvy) > 14) { mvx = 0; mvy = 0; }
  pf.vx = lerp(pf.vx, mvx, clamp(0.35 * dt, 0, 1));
  pf.vy = lerp(pf.vy, mvy, clamp(0.35 * dt, 0, 1));
  pf.lastX = p.x; pf.lastY = p.y;
  const sp = Math.hypot(pf.vx, pf.vy);
  const moving = sp > 0.35;
  const runAmt = clamp(sp / 3, 0, 1);
  pf.phase += sp * 0.09 * dt;
  if (p.sprintActiveTimer > 0 && moving) {
    pf.dust += dt;
    if (pf.dust > 2.5) {
      pf.dust = 0;
      spawnSand(p.x - pf.vx * 2 + (Math.random() - 0.5) * 8, p.y - pf.vy * 2 + (Math.random() - 0.5) * 8, 2, 0.7);
    }
  }

  // Orientación: mira a la red y gira hacia la pelota
  const base = p.team === 0 ? 0 : Math.PI;
  const toBall = Math.atan2(b.y - p.y, b.x - p.x);
  const desired = base + clamp(angleDiff(toBall, base), -1.1, 1.1) * 0.75;
  if (pf.facing === null) pf.facing = desired;
  pf.facing += angleDiff(desired, pf.facing) * clamp(0.16 * dt, 0, 1);
  const th = pf.facing;
  const Fx = Math.cos(th), Fy = Math.sin(th), Rx = -Fy, Ry = Fx;
  const L = (f, s, z) => ({ x: p.x + Fx * f + Rx * s, y: p.y + Fy * f + Ry * s, z });

  // Estado de carga (el jugador local se ve con su carga en tiempo real)
  let charging = p.charging, cr = Math.min(1, p.chargeFrames / MAX_CHARGE_FRAMES), lob = p.lobMode;
  if (!isHost && idx === mySlot) {
    charging = localInput.charging;
    cr = Math.min(1, localChargeFrames / MAX_CHARGE_FRAMES);
    lob = localInput.lobMode;
  }

  // Detección de golpe: el cooldown salta a 28 al soltar
  if (p.cooldown > pf.lastCooldown + 4) {
    const kind = pf.pose.kind || 'drive';
    pf.swingKind = kind === 'ready' ? (p.swingLob ? 'lob' : 'drive') : kind;
    if (p.swingLob) pf.swingKind = 'lob';
    pf.from = { ...pf.pose };
    pf.swingT = 0;
    pf.tips = [];
  }
  pf.lastCooldown = p.cooldown;

  const tgt = targetPose(p, idx, charging, cr, lob);
  let pose;
  if (pf.swingT >= 0) {
    pf.swingT += dt;
    const u = clamp(pf.swingT / SWING_FRAMES, 0, 1);
    const e = easeOut(u);
    const end = SWING_END[pf.swingKind] || SWING_END.drive;
    pose = {
      beta: lerp(pf.from.beta, end.beta, e),
      z: lerp(pf.from.z, end.z, e) + (pf.swingKind === 'smash' ? Math.sin(u * Math.PI) * 8 : 0),
      reach: lerp(pf.from.reach, end.reach, e),
      tilt: lerp(pf.from.tilt, end.tilt, e),
      kind: pf.swingKind
    };
    if (pf.swingT > SWING_FRAMES + 7) pf.swingT = -1;
    pf.pose = pose;
  } else {
    const k = clamp(0.22 * dt, 0, 1);
    pose = {
      beta: lerp(pf.pose.beta, tgt.beta, k),
      z: lerp(pf.pose.z, tgt.z, k),
      reach: lerp(pf.pose.reach, tgt.reach, k),
      tilt: lerp(pf.pose.tilt, tgt.tilt, k),
      kind: tgt.kind
    };
    pf.pose = pose;
  }
  const swinging = pf.swingT >= 0 && pf.swingT <= SWING_FRAMES;

  // ---- Piernas ----
  const crouch = charging ? 3 : (moving ? 0.6 : 1.6);
  const bob = moving ? Math.abs(Math.sin(pf.phase)) * 2.2 * runAmt : Math.sin(now * 0.006 + idx) * 0.5;
  const pelvisZ = 37 - crouch + bob;
  const mvLen = sp || 1;
  const mdx = moving ? pf.vx / mvLen : Fx, mdy = moving ? pf.vy / mvLen : Fy;
  const parts = [];
  const legs = [];
  for (const s of [-1, 1]) {
    const ph = pf.phase + (s > 0 ? 0 : Math.PI);
    const swingL = moving ? Math.sin(ph) * 10 * runAmt : 0;
    const lift = moving ? Math.max(0, Math.cos(ph)) * 6.5 * runAmt : 0;
    const stanceW = moving ? 4.6 : 7.6;
    const hip = L(0, s * 4.4 * wf, pelvisZ);
    const fb = L(moving ? 0 : (s > 0 ? -1.5 : 2.2), s * stanceW, 0);
    const foot = { x: fb.x + mdx * swingL, y: fb.y + mdy * swingL, z: lift };
    const kf = 3.6 + crouch * 0.8 + lift * 0.35;
    const knee = { x: (hip.x + foot.x) / 2 + Fx * kf, y: (hip.y + foot.y) / 2 + Fy * kf, z: (hip.z + foot.z) / 2 + 1.5 };
    const ankle = { x: foot.x, y: foot.y, z: foot.z + 3.2 };
    legs.push({ s, hip, knee, ankle, foot });
  }
  for (const lg of legs) {
    const thighMid = { x: lerp(lg.hip.x, lg.knee.x, 0.55), y: lerp(lg.hip.y, lg.knee.y, 0.55), z: lerp(lg.hip.z, lg.knee.z, 0.55) };
    const sock = { x: lerp(lg.knee.x, lg.ankle.x, 0.72), y: lerp(lg.knee.y, lg.ankle.y, 0.72), z: lerp(lg.knee.z, lg.ankle.z, 0.72) };
    const heel = { x: lg.foot.x - Fx * 2.6, y: lg.foot.y - Fy * 2.6, z: lg.foot.z + 1.7 };
    const toe = { x: lg.foot.x + Fx * 4.6, y: lg.foot.y + Fy * 4.6, z: lg.foot.z + 1.5 };
    parts.push({ k: 'limb', a: lg.knee, b: lg.ankle, w: 4.6, c: skin, hl: true });
    parts.push({ k: 'limb', a: sock, b: lg.ankle, w: 4.9, c: '#eef2f6' });
    parts.push({ k: 'limb', a: heel, b: toe, w: 4.6, c: '#f3f5f8', sole: kit.rim });
    parts.push({ k: 'limb', a: thighMid, b: lg.knee, w: 5.8, c: skin, hl: true });
    parts.push({ k: 'limb', a: lg.hip, b: thighMid, w: 7.4 * wf, c: kit.shorts });
  }

  // ---- Torso (cilindro elíptico visto desde la cámara) ----
  const twist = clamp(-(pose.beta - 0.35) * 0.38, -0.85, 0.7);
  const lean = moving ? 2.6 : (charging ? 1.2 : 2);
  const shZ = pelvisZ + 24;
  const Sc = { x: p.x + Fx * lean, y: p.y + Fy * lean, z: shZ };
  const Pc = { x: p.x + Fx * lean * 0.3, y: p.y + Fy * lean * 0.3, z: pelvisZ + 1 };
  const sth = th + twist;
  const SFx = Math.cos(sth), SFy = Math.sin(sth), SRx = -SFy, SRy = SFx;
  const shR = { x: Sc.x + SRx * 8.2 * wf, y: Sc.y + SRy * 8.2 * wf, z: shZ - 0.5 };
  const shL = { x: Sc.x - SRx * 8.2 * wf, y: Sc.y - SRy * 8.2 * wf, z: shZ - 0.5 };
  const crx = cam.r.x, cry = cam.r.y;
  const halfW = (a, bb, ux, uy, vx, vy) => Math.sqrt((a * (ux * crx + uy * cry)) ** 2 + (bb * (vx * crx + vy * cry)) ** 2);
  const wTop = halfW(8.6 * wf, 5, SRx, SRy, SFx, SFy);
  const wBot = halfW(6.6 * wf, 4.6, Rx, Ry, Fx, Fy);
  parts.push({
    k: 'torso', c: kit,
    pts: [
      { x: Pc.x - crx * wBot, y: Pc.y - cry * wBot, z: Pc.z - 6 },
      { x: Pc.x + crx * wBot, y: Pc.y + cry * wBot, z: Pc.z - 6 },
      { x: Sc.x + crx * wTop, y: Sc.y + cry * wTop, z: shZ - 1 },
      { x: Sc.x - crx * wTop, y: Sc.y - cry * wTop, z: shZ - 1 }
    ],
    shorts: [
      { x: Pc.x - crx * (wBot + 0.6), y: Pc.y - cry * (wBot + 0.6), z: Pc.z - 9 },
      { x: Pc.x + crx * (wBot + 0.6), y: Pc.y + cry * (wBot + 0.6), z: Pc.z - 9 },
      { x: Pc.x + crx * wBot, y: Pc.y + cry * wBot, z: Pc.z + 1 },
      { x: Pc.x - crx * wBot, y: Pc.y - cry * wBot, z: Pc.z + 1 }
    ],
    center: { x: (Sc.x + Pc.x) / 2, y: (Sc.y + Pc.y) / 2, z: (Sc.z + Pc.z) / 2 }
  });

  // ---- Brazo de la pala (derecho) ----
  const hx = Math.cos(pose.beta) * Fx + Math.sin(pose.beta) * Rx;
  const hy = Math.cos(pose.beta) * Fy + Math.sin(pose.beta) * Ry;
  const pivot = { x: Sc.x + Rx * 5, y: Sc.y + Ry * 5 };
  const hand = { x: pivot.x + hx * pose.reach, y: pivot.y + hy * pose.reach, z: pose.z };
  const up = pose.z > shZ + 4;
  const elbow = {
    x: (shR.x + hand.x) / 2 + Rx * (up ? 4 : 2.5) - Fx * (up ? 2 : 0),
    y: (shR.y + hand.y) / 2 + Ry * (up ? 4 : 2.5) - Fy * (up ? 2 : 0),
    z: (shR.z + hand.z) / 2 - (up ? -2 : 4.5)
  };
  const sleeve = { x: lerp(shR.x, elbow.x, 0.45), y: lerp(shR.y, elbow.y, 0.45), z: lerp(shR.z, elbow.z, 0.45) };
  const wrist = { x: lerp(elbow.x, hand.x, 0.8), y: lerp(elbow.y, hand.y, 0.8), z: lerp(elbow.z, hand.z, 0.8) };
  parts.push({ k: 'limb', a: shR, b: sleeve, w: 5.6 * wf, c: kit.shirt });
  parts.push({ k: 'limb', a: sleeve, b: elbow, w: 4.2, c: skin, hl: true });
  parts.push({ k: 'limb', a: elbow, b: hand, w: 3.8, c: skin, hl: true });
  parts.push({ k: 'limb', a: wrist, b: hand, w: 4.2, c: kit.band });

  // ---- Brazo libre (equilibrio / señala la pelota) ----
  const armSwing = moving ? Math.sin(pf.phase) * 6 * runAmt : 0;
  let lh;
  if (charging && pose.kind === 'smash') lh = L(10, -6, 78);
  else if (charging) lh = L(12, -9, 52);
  else lh = L(8 + armSwing, -10.5, 44 + Math.abs(armSwing) * 0.3);
  const lel = { x: (shL.x + lh.x) / 2 - Rx * 2.5, y: (shL.y + lh.y) / 2 - Ry * 2.5, z: (shL.z + lh.z) / 2 - 4 };
  const lsl = { x: lerp(shL.x, lel.x, 0.45), y: lerp(shL.y, lel.y, 0.45), z: lerp(shL.z, lel.z, 0.45) };
  parts.push({ k: 'limb', a: shL, b: lsl, w: 5.6 * wf, c: kit.shirt });
  parts.push({ k: 'limb', a: lsl, b: lel, w: 4.2, c: skin, hl: true });
  parts.push({ k: 'limb', a: lel, b: lh, w: 3.8, c: skin, hl: true });

  // ---- Cabeza ----
  const head = { x: Sc.x + Fx * 0.8, y: Sc.y + Fy * 0.8, z: shZ + 10.5 };
  parts.push({ k: 'limb', a: { x: Sc.x, y: Sc.y, z: shZ - 1 }, b: { x: head.x, y: head.y, z: head.z - 3 }, w: 4.2, c: skin });
  parts.push({ k: 'head', c: head, r: 5.8, skin, hair: HAIR[idx % 4], band: kit.band, fx: Fx, fy: Fy });

  // ---- Pala ----
  let pdx = hand.x - shR.x, pdy = hand.y - shR.y;
  const pl = Math.hypot(pdx, pdy) || 1;
  pdx /= pl; pdy /= pl;
  const ht = clamp(pose.tilt, -1, 1);
  let dX = pdx * (1 - Math.abs(ht) * 0.55), dY = pdy * (1 - Math.abs(ht) * 0.55), dZ = ht;
  const dl = Math.hypot(dX, dY, dZ) || 1;
  dX /= dl; dY /= dl; dZ /= dl;
  let wX = dY, wY = -dX;
  const wl = Math.hypot(wX, wY);
  if (wl < 0.15) { wX = Fx; wY = Fy; } else { wX /= wl; wY /= wl; }
  const pc = { x: hand.x + dX * 14.5, y: hand.y + dY * 14.5, z: hand.z + dZ * 14.5 };
  const face = [];
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const ca = Math.cos(a), sa = Math.sin(a);
    const wd = 7 * (1 + 0.1 * ca);
    face.push({ x: pc.x + dX * 9 * ca + wX * wd * sa, y: pc.y + dY * 9 * ca + wY * wd * sa, z: pc.z + dZ * 9 * ca });
  }
  const tip = { x: pc.x + dX * 9, y: pc.y + dY * 9, z: pc.z + dZ * 9 };
  if (swinging) {
    pf.tips.push({ tip, pc });
    if (pf.tips.length > 7) pf.tips.shift();
  } else if (pf.tips.length) {
    pf.tips.shift();
  }
  parts.push({ k: 'paddle', hand, neck: { x: hand.x + dX * 6, y: hand.y + dY * 6, z: hand.z + dZ * 6 }, face, rim: kit.rim, center: pc });

  return { parts, pf, kit, charging, cr, lob, swinging };
}

function drawLimb(a, b, w, color, hl, sole) {
  const lw = Math.max(1, w * (a.s + b.s) / 2);
  ctx.lineCap = 'round';
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = lw + 1.4;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  if (sole) {
    ctx.strokeStyle = sole;
    ctx.lineWidth = Math.max(0.8, lw * 0.35);
    ctx.beginPath(); ctx.moveTo(a.x, a.y + lw * 0.32); ctx.lineTo(b.x, b.y + lw * 0.32); ctx.stroke();
  }
  if (hl) {
    ctx.strokeStyle = 'rgba(255, 240, 225, 0.28)';
    ctx.lineWidth = Math.max(0.6, lw * 0.32);
    const ox = -lw * 0.18, oy = -lw * 0.2;
    ctx.beginPath(); ctx.moveTo(a.x + ox, a.y + oy); ctx.lineTo(b.x + ox, b.y + oy); ctx.stroke();
  }
}

function drawPlayer(p, idx, built) {
  const { parts, pf } = built;
  const items = [];
  const K = PLAYER_SCALE;
  const T = v => P(p.x + (v.x - p.x) * K, p.y + (v.y - p.y) * K, v.z * K);
  for (const part of parts) {
    if (part.k === 'limb') {
      const a = T(part.a), b = T(part.b);
      items.push({ d: (a.d + b.d) / 2, draw: () => drawLimb(a, b, part.w * K, part.c, part.hl, part.sole) });
    } else if (part.k === 'torso') {
      const q = part.pts.map(T);
      const sh = part.shorts.map(T);
      const cc = T(part.center);
      items.push({
        d: cc.d + 0.5,
        draw: () => {
          // Short
          pathPts(ctx, sh);
          ctx.fillStyle = part.c.shorts;
          ctx.fill();
          ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1; ctx.stroke();
          // Camiseta con sombreado cilíndrico
          pathPts(ctx, q);
          const g = ctx.createLinearGradient(q[3].x, q[3].y, q[2].x, q[2].y);
          g.addColorStop(0, part.c.lo);
          g.addColorStop(0.3, part.c.hi);
          g.addColorStop(0.55, part.c.shirt);
          g.addColorStop(1, part.c.lo);
          ctx.fillStyle = g;
          ctx.fill();
          const g2 = ctx.createLinearGradient(0, q[3].y, 0, q[0].y);
          g2.addColorStop(0, 'rgba(255,255,255,0.08)');
          g2.addColorStop(1, 'rgba(0,0,0,0.28)');
          ctx.fillStyle = g2;
          ctx.fill();
          ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.1; ctx.stroke();
        }
      });
    } else if (part.k === 'head') {
      const c = T(part.c);
      const front = T({ x: part.c.x + part.fx * 6, y: part.c.y + part.fy * 6, z: part.c.z });
      items.push({
        d: c.d,
        draw: () => {
          const r = Math.max(2.5, part.r * K * c.s);
          let fdx = front.x - c.x, fdy = front.y - c.y;
          const fl = Math.hypot(fdx, fdy) || 1;
          fdx /= fl; fdy /= fl;
          const facing = clamp(fl / (6 * K * c.s), 0, 1);
          ctx.beginPath(); ctx.arc(c.x, c.y, r + 0.7, 0, Math.PI * 2);
          ctx.fillStyle = OUTLINE; ctx.fill();
          ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
          ctx.fillStyle = part.hair; ctx.fill();
          // Cara hacia donde mira
          const off = r * 0.34 * facing;
          ctx.save();
          ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2); ctx.clip();
          const g = ctx.createRadialGradient(c.x + fdx * off - r * 0.2, c.y + r * 0.1, r * 0.1, c.x + fdx * off, c.y + r * 0.25, r * 1.05);
          g.addColorStop(0, shade(part.skin, 1.12));
          g.addColorStop(1, shade(part.skin, 0.78));
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(c.x + fdx * off, c.y + r * 0.28, r * 0.9, 0, Math.PI * 2); ctx.fill();
          // Cinta de pelo
          ctx.strokeStyle = part.band;
          ctx.lineWidth = Math.max(0.8, r * 0.26);
          ctx.beginPath(); ctx.ellipse(c.x, c.y - r * 0.2, r * 1.05, r * 0.35, 0, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
          ctx.restore();
        }
      });
    } else if (part.k === 'paddle') {
      const hand = T(part.hand);
      const neck = T(part.neck);
      const face = part.face.map(T);
      const cc = T(part.center);
      const tips = pf.tips.map(t => ({ tip: T(t.tip), pc: T(t.pc) }));
      items.push({
        d: cc.d - 0.5,
        draw: () => {
          // Estela del swing
          if (tips.length > 1) {
            for (let i = 1; i < tips.length; i++) {
              const a = tips[i - 1], b = tips[i];
              ctx.beginPath();
              ctx.moveTo(a.pc.x, a.pc.y); ctx.lineTo(a.tip.x, a.tip.y); ctx.lineTo(b.tip.x, b.tip.y); ctx.lineTo(b.pc.x, b.pc.y);
              ctx.closePath();
              ctx.fillStyle = `rgba(235, 245, 255, ${0.07 + 0.2 * i / tips.length})`;
              ctx.fill();
            }
          }
          ctx.lineCap = 'round';
          ctx.strokeStyle = '#11151b';
          ctx.lineWidth = Math.max(1.2, 2.4 * K * hand.s);
          ctx.beginPath(); ctx.moveTo(hand.x, hand.y); ctx.lineTo(neck.x, neck.y); ctx.stroke();
          pathPts(ctx, face);
          ctx.fillStyle = '#1b2029';
          ctx.fill();
          ctx.strokeStyle = part.rim;
          ctx.lineWidth = Math.max(0.9, 1.3 * K * cc.s);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cc.x, cc.y, Math.max(0.8, 1.6 * cc.s), 0, Math.PI * 2);
          ctx.fillStyle = COLORS.ball;
          ctx.fill();
        }
      });
    }
  }
  return items;
}

// ---------- Pelota ----------
function ballItems() {
  const b = state.ball;
  const z = b.z * ZS + BALL_R;
  const pp = P(b.x, b.y, z);
  const hot = b.shotType === '¡REMATE!';
  return [{
    d: pp.d,
    x: b.x,
    draw: () => {
      // Estela con perspectiva
      const tr = b.trail;
      if (state.phase === 'PLAY' && tr.length > 1) {
        const pts = tr.map(t => P(t.x, t.y, t.z * ZS + BALL_R));
        pts.push(pp);
        ctx.lineCap = 'round';
        for (let i = 1; i < pts.length; i++) {
          const k = i / pts.length;
          ctx.strokeStyle = hot ? `rgba(255, 190, 60, ${k * 0.5})` : `rgba(228, 255, 58, ${k * 0.38})`;
          ctx.lineWidth = Math.max(1, BALL_R * 2 * pts[i].s * k * 0.85);
          ctx.beginPath(); ctx.moveTo(pts[i - 1].x, pts[i - 1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
        }
      }
      const rr = Math.max(2.6, BALL_R * pp.s);
      const g = ctx.createRadialGradient(pp.x - rr * 0.35, pp.y - rr * 0.4, rr * 0.05, pp.x, pp.y, rr * 1.05);
      g.addColorStop(0, '#fbffd6');
      g.addColorStop(0.35, hot ? '#ffe34a' : '#e4ff3a');
      g.addColorStop(1, hot ? '#b07a12' : '#88a01c');
      ctx.beginPath(); ctx.arc(pp.x, pp.y, rr, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = Math.max(0.7, rr * 0.16);
      ctx.beginPath();
      ctx.arc(pp.x, pp.y, rr * 0.62, fx.ballSpin, fx.ballSpin + Math.PI * 0.85);
      ctx.stroke();
    }
  }];
}

// ---------- Red ----------
function drawNet() {
  const x0 = COURT.netX;
  const hc = NET_H * ZS, hp = hc + 2.4;
  const y0 = COURT.y, y1 = COURT.y + COURT.h;
  const half = (y1 - y0) / 2, mid = (y0 + y1) / 2;
  const n = fx.net;
  const topZ = y => hp - (hp - hc) * (1 - ((y - mid) / half) ** 2);
  const bulge = (y, zf) => n.amp ? n.dir * n.amp * Math.exp(-(((y - n.y0) / 55) ** 2)) * Math.sin(zf * Math.PI) * Math.cos(n.t * 0.55) : 0;
  const pt = (y, zf) => P(x0 + bulge(y, zf), y, topZ(y) * zf);

  // Paño
  const outline = [];
  for (let y = y0; y <= y1; y += 20) outline.push(pt(y, 0));
  for (let y = y1; y >= y0; y -= 20) outline.push(pt(y, 1));
  pathPts(ctx, outline);
  ctx.fillStyle = 'rgba(8, 12, 18, 0.42)';
  ctx.fill();

  // Malla romboidal
  ctx.strokeStyle = 'rgba(12, 16, 22, 0.75)';
  ctx.lineWidth = 0.7;
  ctx.beginPath();
  for (let y = y0; y <= y1; y += 6) {
    const a = pt(y, 0), b = pt(y, 0.92);
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  }
  for (let k = 1; k <= 5; k++) {
    const zf = k / 6;
    let first = true;
    for (let y = y0; y <= y1; y += 20) {
      const q = pt(y, zf);
      if (first) { ctx.moveTo(q.x, q.y); first = false; } else ctx.lineTo(q.x, q.y);
    }
  }
  ctx.stroke();

  // Faja blanca superior
  const tape = [];
  for (let y = y0; y <= y1; y += 10) tape.push(pt(y, 1));
  ctx.lineCap = 'butt';
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = Math.max(2, 3.8 * tape[0].s);
  pathPts(ctx, tape, false); ctx.stroke();
  ctx.strokeStyle = '#f2f5f8';
  ctx.lineWidth = Math.max(1.5, 2.8 * tape[0].s);
  pathPts(ctx, tape, false); ctx.stroke();

  // Postes
  for (const y of [y0, y1]) {
    const b = P(x0, y, 0), t = P(x0, y, hp + 3);
    ctx.strokeStyle = '#151b23';
    ctx.lineWidth = Math.max(1.5, 3.4 * b.s);
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(t.x, t.y); ctx.stroke();
  }
}

// ---------- Elementos sobre el suelo ----------
function drawServeBox() {
  const b = state.ball;
  if (!(state.phase === 'SERVE' || (state.phase === 'PLAY' && b.isServeShot && b.bouncesInOpponentSide === 0))) return;
  const box = state.serveTargetBox;
  const q = [P(box.minX, box.minY, 0), P(box.maxX, box.minY, 0), P(box.maxX, box.maxY, 0), P(box.minX, box.maxY, 0)];
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.005);
  pathPts(ctx, q);
  ctx.fillStyle = `rgba(228, 255, 58, ${0.1 + pulse * 0.06})`;
  ctx.fill();
  const qi = [P(box.minX + 3, box.minY + 3, 0), P(box.maxX - 3, box.minY + 3, 0), P(box.maxX - 3, box.maxY - 3, 0), P(box.minX + 3, box.maxY - 3, 0)];
  pathPts(ctx, qi);
  ctx.strokeStyle = `rgba(228, 255, 58, ${0.55 + pulse * 0.3})`;
  ctx.lineWidth = 1.6;
  ctx.stroke();
}

function drawPlayerRing(p, idx) {
  const isMe = idx === mySlot;
  const isServer = state.phase === 'SERVE' && state.serverSlot === idx;
  const col = isMe ? '228, 255, 58' : (p.team === 0 ? '69, 168, 255' : '255, 92, 80');
  const pulse = isServer ? 0.5 + 0.5 * Math.sin(performance.now() * 0.008) : 0;
  const ring = groundCircle(p.x, p.y, 20 + pulse * 3, 0, 36);
  pathPts(ctx, ring);
  ctx.strokeStyle = `rgba(${col}, ${isMe ? 0.9 : 0.5})`;
  ctx.lineWidth = isMe ? 2.2 : 1.5;
  ctx.stroke();
  if (isMe) {
    ctx.fillStyle = `rgba(${col}, 0.07)`;
    ctx.fill();
    // Marcas tipo MOBA
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4;
      const p0 = P(p.x + Math.cos(a) * 22, p.y + Math.sin(a) * 22, 0);
      const p1 = P(p.x + Math.cos(a) * 28, p.y + Math.sin(a) * 28, 0);
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    }
  }
}

function drawReach(p, idx, charging) {
  const b = state.ball;
  const dir = p.team === 0 ? 1 : -1;
  const px = p.x + dir * 17, py = p.y + 6;
  const swingFlash = p.swingTimer > 0;
  if (!charging && !swingFlash) return;
  const inRange = state.phase === 'PLAY' && b.lastHitTeam !== p.team &&
    Math.hypot(b.x - px, b.y - py) <= 35 && b.z <= 80;
  const isMe = idx === mySlot;
  pathPts(ctx, groundCircle(px, py, 35, 0, 36));
  if (inRange && isMe) {
    ctx.fillStyle = 'rgba(228, 255, 58, 0.12)';
    ctx.fill();
  }
  ctx.strokeStyle = swingFlash ? 'rgba(250, 204, 21, 0.7)' : (inRange ? 'rgba(228, 255, 58, 0.8)' : `rgba(255, 255, 255, ${isMe ? 0.32 : 0.14})`);
  ctx.lineWidth = swingFlash ? 2.2 : 1.2;
  ctx.setLineDash(swingFlash ? [] : [5, 5]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function predictLanding() {
  const b = state.ball;
  if (state.phase !== 'PLAY') return null;
  let x = b.x, y = b.y, z = b.z, vx = b.vx, vy = b.vy, vz = b.vz;
  for (let i = 0; i < 400; i++) {
    x += vx; y += vy; z += vz; vz -= GRAVITY;
    if (x < COURT.x + 10 || x > COURT.x + COURT.w - 10 || y < COURT.y + 10 || y > COURT.y + COURT.h - 10) return null;
    if (z <= 0) return i < 2 ? null : { x, y };
  }
  return null;
}

function drawLandingMarker() {
  const land = predictLanding();
  if (!land) return;
  const me = state.players[mySlot];
  const mine = me && ((land.x < COURT.netX) === (me.team === 0));
  const col = mine ? '228, 255, 58' : '255, 255, 255';
  pathPts(ctx, groundCircle(land.x, land.y, 7, 0, 20));
  ctx.strokeStyle = `rgba(${col}, ${mine ? 0.55 : 0.22})`;
  ctx.lineWidth = 1.3;
  ctx.stroke();
  pathPts(ctx, groundCircle(land.x, land.y, 2, 0, 10));
  ctx.fillStyle = `rgba(${col}, ${mine ? 0.6 : 0.25})`;
  ctx.fill();
}

function drawGroundFx() {
  for (const r of fx.rings) {
    const k = r.t / 26;
    pathPts(ctx, groundCircle(r.x, r.y, 4 + k * 18, 0, 22));
    ctx.strokeStyle = `rgba(230, 236, 210, ${0.45 * (1 - k)})`;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }
}

function drawRipples(walls) {
  for (const rp of fx.ripples) {
    if (!walls.includes(rp.wall)) continue;
    const wall = WALLS[rp.wall];
    const k = rp.t / 30;
    for (const m of [1, 0.6]) {
      const rad = (5 + k * 30) * m;
      const pts = [];
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2;
        const q = wall.pt(rp.a + Math.cos(a) * rad, Math.max(0, rp.z + Math.sin(a) * rad));
        pts.push(P(q.x, q.y, q.z));
      }
      pathPts(ctx, pts);
      ctx.strokeStyle = `rgba(200, 240, 255, ${0.55 * (1 - k) * m})`;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
  }
}

function particleItems() {
  return fx.particles.map(pt => {
    const pp = P(pt.x, pt.y, pt.z);
    return {
      d: pp.d, x: pt.x,
      draw: () => {
        const a = (1 - pt.life / pt.max) * 0.75;
        ctx.fillStyle = `rgba(214, 200, 160, ${a})`;
        const r = Math.max(0.6, pt.size * pp.s);
        ctx.fillRect(pp.x - r / 2, pp.y - r / 2, r, r);
      }
    };
  });
}

function impactItems() {
  return fx.impacts.map(im => {
    const pp = P(im.x, im.y, im.z);
    return {
      d: pp.d - 1, x: im.x,
      draw: () => {
        const k = im.t / 14;
        const r = (im.big ? 26 : 14) * pp.s * (0.4 + k);
        ctx.strokeStyle = im.big ? `rgba(255, 200, 80, ${0.9 * (1 - k)})` : `rgba(255, 255, 255, ${0.8 * (1 - k)})`;
        ctx.lineWidth = im.big ? 3 : 2;
        ctx.beginPath(); ctx.arc(pp.x, pp.y, r, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4 + 0.3;
          ctx.moveTo(pp.x + Math.cos(a) * r * 0.7, pp.y + Math.sin(a) * r * 0.7);
          ctx.lineTo(pp.x + Math.cos(a) * r * 1.25, pp.y + Math.sin(a) * r * 1.25);
        }
        ctx.stroke();
      }
    };
  });
}

// ---------- Guía de tiro del jugador local ----------
function shotPreviewParams(me, ratio, isLob, isMyServe) {
  const b = state.ball;
  const dir = me.team === 0 ? 1 : -1;
  const padX = me.x + dir * 17, padY = me.y + 6;
  let from;
  if (isMyServe) from = { x: b.x, y: b.y, z: b.z };
  else {
    const near = state.phase === 'PLAY' && b.lastHitTeam !== me.team && Math.hypot(b.x - padX, b.y - padY) < 70;
    from = near ? { x: b.x, y: b.y, z: b.z } : { x: padX, y: padY, z: 30 };
  }
  const charge = Math.max(0.15, ratio);
  let label, speed;
  if (isMyServe) { label = 'SAQUE'; speed = 5.4 + charge * 2.2 + me.powerStat * 1.4; }
  else if (isLob) { label = 'GLOBO'; speed = 3.9 + charge * 1.3; }
  else {
    const pm = 0.78 + me.powerStat * 0.52;
    if (from.z > SMASH_MIN_Z && charge >= 0.5 && Math.abs(me.x - COURT.netX) < 220) { label = '¡REMATE!'; speed = (7.8 + charge * 3.8) * pm; }
    else { label = 'DRIVE'; speed = (5.2 + charge * 4.0) * pm; }
  }
  return { from, label, speed };
}

function drawAimGuide(me, layer) {
  const ratio = isHost ? (me.chargeFrames / MAX_CHARGE_FRAMES) : (localChargeFrames / MAX_CHARGE_FRAMES);
  const isCharging = isHost ? me.charging : localInput.charging;
  const isLob = isHost ? me.lobMode : localInput.lobMode;
  const isMyServe = (state.phase === 'SERVE' && state.serverSlot === mySlot);

  const { tx, ty } = getClampedTarget(me.team, localInput.aimX, localInput.aimY, ratio, me.powerStat, isLob, isMyServe);

  let aimValid = true;
  if (isMyServe) {
    const box = state.serveTargetBox;
    aimValid = (tx >= box.minX && tx <= box.maxX && ty >= box.minY && ty <= box.maxY);
  }
  const col = !aimValid ? '239, 68, 68' : (isLob ? '96, 190, 255' : '228, 255, 58');

  if (layer === 'ground') {
    const rad = isCharging ? 10 + ratio * 6 : 8;
    pathPts(ctx, groundCircle(tx, ty, rad, 0, 30));
    ctx.fillStyle = `rgba(${col}, ${isCharging ? 0.14 : 0.06})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(${col}, ${isCharging ? 0.95 : 0.6})`;
    ctx.lineWidth = isCharging ? 2.2 : 1.4;
    ctx.stroke();
    const a = P(tx - 14, ty, 0), b2 = P(tx + 14, ty, 0), c = P(tx, ty - 14, 0), d = P(tx, ty + 14, 0);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y);
    ctx.lineWidth = 1.2; ctx.stroke();
    return;
  }

  if (!isCharging || state.phase === 'POINT_PAUSE') return;
  // Arco 3D previsto del golpe (misma balística que la física)
  const { from, label, speed } = shotPreviewParams(me, ratio, isLob, isMyServe);
  const v = computeLaunch(from.x, from.y, from.z, tx, ty, speed, label, me.team);
  let x = from.x, y = from.y, z = from.z, vx = v.vx, vy = v.vy, vz = v.vz;
  const pts = [P(x, y, z * ZS + BALL_R)];
  const shadow = [P(x, y, 0)];
  let netFail = false;
  for (let i = 0; i < 300; i++) {
    const px = x;
    x += vx; y += vy; z += vz; vz -= GRAVITY;
    if ((px - COURT.netX) * (x - COURT.netX) < 0 && z < NET_H) netFail = true;
    if (z <= 0) { pts.push(P(x, y, BALL_R)); shadow.push(P(x, y, 0)); break; }
    if (i % 2 === 0) { pts.push(P(x, y, z * ZS + BALL_R)); shadow.push(P(x, y, 0)); }
    if (x < COURT.x || x > COURT.x + COURT.w) break;
  }
  const arcCol = netFail ? '239, 68, 68' : col;
  ctx.setLineDash([2, 6]);
  ctx.lineCap = 'round';
  ctx.strokeStyle = `rgba(${arcCol}, 0.22)`;
  ctx.lineWidth = 1.5;
  pathPts(ctx, shadow, false); ctx.stroke();
  ctx.setLineDash([7, 6]);
  ctx.strokeStyle = `rgba(${arcCol}, 0.9)`;
  ctx.lineWidth = 2.2;
  pathPts(ctx, pts, false); ctx.stroke();
  ctx.setLineDash([]);
  const last = pts[pts.length - 1];
  ctx.beginPath(); ctx.arc(last.x, last.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(${arcCol}, 0.95)`; ctx.fill();
}

// ---------- Interfaz en pantalla ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawNameplate(p, idx, built) {
  const anchorZ = Math.max(98, built.pf.pose.z + 58);   // sube si la pala está en alto (remate)
  const top = P(p.x, p.y, anchorZ * PLAYER_SCALE);
  const k = clamp(top.s / 1.0, 0.85, 1.12);
  const isMe = idx === mySlot;
  const x = top.x, y = top.y;
  const bw = 50 * k;

  ctx.font = `600 ${Math.round(13 * k)}px ${FONT_COND}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(4, 10, 20, 0.85)';
  ctx.lineWidth = 3;
  ctx.strokeText(p.name, x, y - 9 * k);
  ctx.fillStyle = isMe ? COLORS.ball : '#f2f6fa';
  ctx.fillText(p.name, x, y - 9 * k);

  // Barra de sprint (siempre visible, como la vida en un MOBA)
  const sprintRatio = p.sprintActiveTimer > 0 ? (p.sprintActiveTimer / SPRINT_DURATION) : (1 - p.sprintCooldown / SPRINT_COOLDOWN);
  roundRect(x - bw / 2, y - 4 * k, bw, 5 * k, 2);
  ctx.fillStyle = 'rgba(4, 10, 20, 0.8)'; ctx.fill();
  const fillCol = p.sprintActiveTimer > 0 ? COLORS.ball : (p.sprintCooldown === 0 ? (p.team === 0 ? COLORS.blue : COLORS.red) : '#5d6f82');
  if (sprintRatio > 0.01) {
    roundRect(x - bw / 2 + 1, y - 3 * k, (bw - 2) * clamp(sprintRatio, 0, 1), 3 * k, 1.5);
    ctx.fillStyle = fillCol; ctx.fill();
  }

  // Barra de carga del golpe
  if (built.charging) {
    const r = built.cr;
    const cy = y - 27 * k;
    roundRect(x - bw / 2, cy, bw, 7 * k, 3);
    ctx.fillStyle = 'rgba(4, 10, 20, 0.85)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.stroke();
    const c = built.lob ? '#60beff' : (r > 0.85 ? '#ff8a2a' : (r > 0.45 ? '#ffd23a' : COLORS.ball));
    if (r > 0.01) {
      roundRect(x - bw / 2 + 1.5, cy + 1.5, (bw - 3) * r, 7 * k - 3, 2);
      ctx.fillStyle = c; ctx.fill();
    }
  }
}

function drawBanner() {
  if (state.bannerTimer <= 0 || !state.bannerText) return;
  const alpha = clamp(state.bannerTimer / 14, 0, 1);
  const lines = String(state.bannerText).split('\n');
  const title = lines[0], sub = lines[1] || '';
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `600 24px ${FONT_COND}`;
  const tw = ctx.measureText(title).width;
  ctx.font = `500 15px ${FONT_BODY}`;
  const sw = sub ? ctx.measureText(sub).width : 0;
  const w = Math.max(tw, sw) + 52;
  const h = sub ? 64 : 42;
  const x = VIEW_W / 2 - w / 2, y = VIEW_H - h - 22;
  roundRect(x, y, w, h, 6);
  ctx.fillStyle = 'rgba(8, 19, 31, 0.88)';
  ctx.fill();
  ctx.fillStyle = COLORS.ball;
  ctx.fillRect(x, y + 8, 4, h - 16);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#f2f6fa';
  ctx.font = `600 24px ${FONT_COND}`;
  ctx.fillText(title, x + 24, y + 30);
  if (sub) {
    ctx.fillStyle = '#a9bdd0';
    ctx.font = `500 15px ${FONT_BODY}`;
    ctx.fillText(sub, x + 24, y + 52);
  }
  ctx.restore();
}

function drawSprintAbility(me) {
  const right = cam.team !== 1;
  const cx = right ? VIEW_W - 58 : 58, cy = VIEW_H - 64, r = 26;
  const active = me.sprintActiveTimer > 0;
  const ready = me.sprintCooldown === 0;
  ctx.beginPath(); ctx.arc(cx, cy, r + 3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(8, 19, 31, 0.88)'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = ready || active ? 'rgba(228, 255, 58, 0.14)' : 'rgba(255,255,255,0.04)'; ctx.fill();
  // Rayo
  ctx.beginPath();
  ctx.moveTo(cx + 3, cy - 15); ctx.lineTo(cx - 8, cy + 2); ctx.lineTo(cx - 1, cy + 2);
  ctx.lineTo(cx - 4, cy + 15); ctx.lineTo(cx + 8, cy - 3); ctx.lineTo(cx + 1, cy - 3); ctx.closePath();
  ctx.fillStyle = ready || active ? COLORS.ball : '#6c7f92'; ctx.fill();
  if (!ready && !active) {
    const k = me.sprintCooldown / SPRINT_COOLDOWN;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k);
    ctx.closePath();
    ctx.fillStyle = 'rgba(4, 10, 20, 0.62)'; ctx.fill();
    ctx.fillStyle = '#eef3f8';
    ctx.font = `700 17px ${FONT_COND}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(Math.ceil(me.sprintCooldown / 60), cx, cy + 1);
  }
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = active ? COLORS.ball : (ready ? 'rgba(228, 255, 58, 0.7)' : 'rgba(150, 190, 225, 0.3)');
  ctx.beginPath();
  if (active) ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (me.sprintActiveTimer / SPRINT_DURATION));
  else ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.font = `600 12px ${FONT_COND}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#a9bdd0';
  ctx.fillText('Espacio', cx, cy + r + 17);
}

function drawCursor(me) {
  if (!mouseView.inside) return;
  const ratio = isHost ? (me.chargeFrames / MAX_CHARGE_FRAMES) : (localChargeFrames / MAX_CHARGE_FRAMES);
  const charging = isHost ? me.charging : localInput.charging;
  const lob = isHost ? me.lobMode : localInput.lobMode;
  const { x, y } = mouseView;
  ctx.strokeStyle = 'rgba(4, 10, 20, 0.7)';
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  if (charging) {
    ctx.strokeStyle = lob ? '#60beff' : (ratio > 0.85 ? '#ff8a2a' : COLORS.ball);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, 13, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ratio); ctx.stroke();
  }
}

function syncHud() {
  const servingTeam = state.players[state.serverSlot] ? state.players[state.serverSlot].team : 0;
  if (servingTeam !== fx.servingTeam) {
    fx.servingTeam = servingTeam;
    document.getElementById('sb-blue').classList.toggle('serving', servingTeam === 0);
    document.getElementById('sb-red').classList.toggle('serving', servingTeam === 1);
  }
}

// ---------- Frame completo ----------
let lastRenderTime = performance.now();

function render(now) {
  const me = state.players[mySlot] || state.players[0];
  if (!cam.ready || cam.team !== me.team) {
    setupCamera(me.team);
    rebuildLayers();
    updateAimFromMouse();
    document.getElementById('scorebug').classList.toggle('flip', me.team === 1);
    document.getElementById('status-text').classList.toggle('flip', me.team === 1);
  }
  if (staticLayer.width !== canvas.width) rebuildLayers();

  const dt = clamp((now - lastRenderTime) / (1000 / 60), 0.1, 3);
  lastRenderTime = now;
  updateFx(dt);
  syncHud();

  const S = renderScale;
  const sx = fx.shake ? (Math.random() - 0.5) * fx.shake : 0;
  const sy = fx.shake ? (Math.random() - 0.5) * fx.shake : 0;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#071019';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(staticLayer, sx * S, sy * S);
  ctx.setTransform(S, 0, 0, S, sx * S, sy * S);

  drawRipples(['F', 'L', 'R']);

  // --- Suelo ---
  drawServeBox();
  const built = state.players.map((p, idx) => buildPlayerParts(p, idx, dt, now));
  state.players.forEach(p => drawPlayerShadows(p));
  drawBallShadows(state.ball);
  drawGroundFx();
  state.players.forEach((p, idx) => drawPlayerRing(p, idx));
  state.players.forEach((p, idx) => drawReach(p, idx, built[idx].charging));
  drawLandingMarker();
  drawAimGuide(me, 'ground');

  // Línea vertical de altura de la pelota (ayuda a leer la profundidad)
  const b = state.ball;
  const bh = b.z * ZS;
  if (bh > 30 && state.phase === 'PLAY') {
    const g0 = P(b.x, b.y, 0), g1 = P(b.x, b.y, bh);
    ctx.setLineDash([2, 4]);
    ctx.strokeStyle = 'rgba(228, 255, 58, 0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(g0.x, g0.y); ctx.lineTo(g1.x, g1.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // --- Objetos con profundidad: lado lejano de la red, red, lado cercano ---
  const items = [];
  state.players.forEach((p, idx) => {
    for (const it of drawPlayer(p, idx, built[idx])) { it.x = p.x; items.push(it); }
  });
  items.push(...ballItems(), ...particleItems(), ...impactItems());
  const camLeft = cam.C.x < COURT.netX;
  const far = [], near = [];
  for (const it of items) ((it.x < COURT.netX) === camLeft ? near : far).push(it);
  far.sort((a, c) => c.d - a.d);
  near.sort((a, c) => c.d - a.d);
  for (const it of far) it.draw();
  drawNet();
  for (const it of near) it.draw();

  drawAimGuide(me, 'arc');

  // --- Primer plano: pared cercana translúcida + viñeta ---
  ctx.setTransform(1, 0, 0, 1, sx * S, sy * S);
  ctx.drawImage(fgLayer, 0, 0);
  ctx.setTransform(S, 0, 0, S, sx * S, sy * S);
  drawRipples(['N']);

  // --- HUD ---
  ctx.setTransform(S, 0, 0, S, 0, 0);
  state.players.forEach((p, idx) => drawNameplate(p, idx, built[idx]));
  drawBanner();
  drawSprintAbility(me);
  drawCursor(me);
}

// Loop fijo a 60 FPS para la física; el dibujo va al ritmo de la pantalla
let lastTime = performance.now();
let accumulator = 0;
const STEP = 1000 / 60;

function gameLoop(now) {
  const delta = Math.min(now - lastTime, 100);
  lastTime = now;
  accumulator += delta;

  while (accumulator >= STEP) {
    stepPhysics();
    if (isHost) {
      Object.values(connections).forEach(conn => {
        if (conn && conn.open) conn.send({ type: 'state', state });
      });
    }
    accumulator -= STEP;
  }

  render(now);
  requestAnimationFrame(gameLoop);
}

resizeCanvas();
setupServe(0);
updateScoreUI();
requestAnimationFrame(gameLoop);
</script>
</body>
