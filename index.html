// Calcula el cuadro cruzado obligatorio para el saque
function computeServeBox(server) {
  const serverInTopHalf = server.y < COURT.midY;
  return {
    minX: server.team === 0 ? COURT.netX : COURT.serviceLeft,
    maxX: server.team === 0 ? COURT.serviceRight : COURT.netX,
    minY: serverInTopHalf ? COURT.midY : COURT.y,
    maxY: serverInTopHalf ? (COURT.y + COURT.h) : COURT.midY
  };
}

function getClampedTarget(team, rawAimX, rawAimY, chargeRatio, powerStat, isLob, isServe) {
  const margin = 18, deep = 22;    // objetivo profundo, sin llegar a la zona donde ya cuenta como "directo al cristal"
  const minX = team === 0 ? COURT.netX + 35 : COURT.x + deep;
  const maxX = team === 0 ? COURT.x + COURT.w - deep : COURT.netX - 35;
  const minY = COURT.y + margin;
  const maxY = COURT.y + COURT.h - margin;

  let tx = Math.max(minX, Math.min(maxX, rawAimX));
  let ty = Math.max(minY, Math.min(maxY, rawAimY));

  // En juego normal (no en saque), más carga y más fuerza empujan la bola más profunda
  if (!isLob && !isServe) {
    const depthPull = (chargeRatio - 0.4) * (50 + powerStat * 45);
    tx += (team === 0 ? depthPull : -depthPull);
    tx = Math.max(minX, Math.min(maxX, tx));
  }
  return { tx, ty };
}

// Balística: misma fórmula de siempre (aterriza en el objetivo a la velocidad horizontal pedida)
// + ayuda de paso de red: si la parábola no supera la red, el jugador "levanta" la bola
// (baja la velocidad hasta un 60%). Si aun así no alcanza, la bola se va a la red.
function computeLaunch(fromX, fromY, fromZ, targetX, targetY, speedX, shotLabel, team) {
  const dirX = team === 0 ? 1 : -1;
  const distX = Math.max(85, Math.abs(targetX - fromX));
  let speed = speedX;
  let T = distX / speed;

  const dNet = (COURT.netX - fromX) * dirX;
  if (shotLabel !== 'GLOBO' && dNet > 0 && dNet < distX) {
    const f = dNet / distX;
    const need = NET_H + NET_CLEARANCE;
    const zAtNet = fromZ * (1 - f) + 0.5 * GRAVITY * T * T * f * (1 - f);
    if (zAtNet < need) {
      const tNeed = Math.sqrt(Math.max(0, 2 * (need - fromZ * (1 - f)) / (GRAVITY * f * (1 - f))));
      T = Math.min(tNeed, T / MIN_SPEED_FACTOR);
      speed = distX / T;
    }
  }

  let vz = (0.5 * GRAVITY * T * T - fromZ) / T;
  if (shotLabel === 'GLOBO' && vz < 5.6) vz = 5.9;
  return { vx: dirX * speed, vy: (targetY - fromY) / T, vz };
}

function launchBall(targetX, targetY, speedX, shotLabel, team, isServeShot, cut = 0) {
  const b = state.ball;
  b.cut = cut;
  const v = computeLaunch(b.x, b.y, b.z, targetX, targetY, speedX, shotLabel, team);
  b.vx = v.vx;
  b.vy = v.vy;
  b.vz = v.vz;

  b.lastHitTeam = team;
  b.bouncesInOpponentSide = 0;
  b.isServeShot = isServeShot;
  b.shotType = shotLabel;
  b.hitSeq = (b.hitSeq || 0) + 1;
  b.wallBounced = false;
}

function nextServerSlot(s) {
  for (let k = 0; k < 4; k++) {
    s = (s + 1) % 4;
    if (!state.players[s].out) return s;
  }
  return 0;
}

function setupServe(nextServerSlot) {
  state.phase = 'SERVE';
  if (state.players[nextServerSlot] && state.players[nextServerSlot].out) nextServerSlot = 2;
  state.serverSlot = nextServerSlot;
  state.serveBotTimer = 75;
  state.rally = { cp: [false, false] };
  state.bolts = [];

  const solo1 = state.players[3].out;
  const pos = [
    [145, 155], [145, 365],
    [775, solo1 ? 260 : 155], [775, 365]
  ];
  state.players.forEach((p, i) => {
    p.x = pos[i][0]; p.y = pos[i][1];
    p.vx = 0; p.vy = 0;
    p.charging = false; p.chargeFrames = 0;
    p.swingTimer = 0; p.cooldown = 0;
    p.activeT = 0; p.activeKind = ''; p.clone = null;
    p.stun = 0; p.slow = 0; p.burn = 0;
  });
  // Zeus saca desde un lado y luego cubre toda su mitad
  if (solo1 && nextServerSlot === 2) state.players[2].y = 155;
  state.ice = null;

  const server = state.players[state.serverSlot];
  state.serveTargetBox = computeServeBox(server);

  const dir = server.team === 0 ? 1 : -1;
  const b = state.ball;
  b.x = server.x + dir * (PAD_F + 3);
  b.y = server.y + PAD_S;
  b.z = 16;
  b.vx = 0; b.vy = 0; b.vz = 0;
  b.trail = [];
  b.isServeShot = true;
  b.bouncesInOpponentSide = 0;
  b.shotType = 'SAQUE';
  b.cpTarget = null;

  // El texto lo ven todos en la sala, así que nombra a quien saca
  showBanner(server.isBot ? 'Al saque: ' + server.name : 'Saca ' + server.name + '\nApunta al cuadro iluminado, carga y suelta el clic', 9999);
}

// ---- Frases ----
function say(slot, text) {
  if (!text || !state.players[slot] || state.players[slot].out) return;
  state.talk = { seq: state.talk.seq + 1, slot, text };
}
function talkLine(p, pool) {
  const own = TALK.byLook[p.lookId];
  return own && Math.random() < 0.45 ? pick(own) : pick(pool);
}
function maybeTalkAfterPoint(winner, isFault) {
  if (Math.random() > (isFault ? 0.35 : 0.4)) return;
  const cands = state.players.map((p, i) => i).filter(i => !state.players[i].out && state.players[i].team === winner);
  if (!cands.length) return;
  const slot = pick(cands);
  say(slot, talkLine(state.players[slot], isFault ? TALK.taunt : TALK.brag));
}

function awardPoint(winningTeam, reason, isFault = false) {
  if (isFault) emitSound('fault');
  state.phase = 'POINT_PAUSE';
  state.pauseTimer = 95;
  state.score[winningTeam]++;

  // Repetición para los puntos espectaculares
  const spectacular = /^Por [34]/.test(reason) || reason.startsWith('Remate ganador') || state.rally.cp[winningTeam];
  if (spectacular) {
    state.replay = { seq: state.replay.seq + 1, reason: state.rally.cp[winningTeam] && !/^Por|^Remate/.test(reason) ? 'Salvada con contrapared' : reason };
    state.pauseTimer += 150;
  }
  maybeTalkAfterPoint(winningTeam, isFault);

  const other = 1 - winningTeam;
  const s = state.score;
  const gameWon = state.tiebreak
    ? (s[winningTeam] >= 7 && s[winningTeam] - s[other] >= 2)
    : s[winningTeam] >= 4;   // 40-40 = punto de oro: el siguiente punto gana

  if (gameWon) {
    const finalScore = [s[0], s[1]];
    state.games[winningTeam]++;
    state.score = [0, 0];
    state.celebrate = { seq: state.celebrate.seq + 1, team: winningTeam };
    state.pauseTimer += 80;
    const g = state.games;
    if (state.mode === 'run') {
      const B = BOSSES[state.run.boss];
      if (g[winningTeam] >= B.gamesToWin) endRunMatch(winningTeam, finalScore);
      else showBanner(`Juego para ${winningTeam === 0 ? 'ustedes' : B.team}\n${g[0]}-${g[1]} en juegos: gana el primero en llegar a ${B.gamesToWin}`, 140);
    } else {
      const setWon = state.tiebreak || (g[winningTeam] >= 6 && g[winningTeam] - g[other] >= 2);
      if (setWon) {
        state.sets[winningTeam]++;
        state.result = { winner: winningTeam, games: [g[0], g[1]], tiebreak: state.tiebreak };
        state.tiebreak = false;
        state.afterPause = 'setover';
        showBanner(`Set para el equipo ${winningTeam === 0 ? 'azul' : 'rojo'}\n${g[0]}-${g[1]}`, 9999);
      } else {
        if (g[0] === 6 && g[1] === 6) {
          state.tiebreak = true;
          showBanner(`Juego para el equipo ${winningTeam === 0 ? 'azul' : 'rojo'}\n6-6: tie-break a 7 puntos`, 140);
        } else {
          showBanner(`Juego para el equipo ${winningTeam === 0 ? 'azul' : 'rojo'}\n${reason}  (${g[0]}-${g[1]})`, 140);
        }
        // Tienda y votación: después del juego 2 y luego cada 3 juegos
        const played = g[0] + g[1];
        if (played === 2 || (played > 2 && (played - 2) % 3 === 0)) state.afterPause = 'shop2';
      }
    }
  } else if (state.tiebreak) {
    showBanner(`${reason}\nTie-break ${s[0]}-${s[1]}`, 95);
  } else if (s[0] === 3 && s[1] === 3) {
    showBanner(`Punto de oro, 40 iguales\n${reason}`, 100);
  } else {
    showBanner(`${reason}\n${POINTS_LABELS[s[0]]} – ${POINTS_LABELS[s[1]]}`, 95);
  }
  updateScoreUI();
  state.serverSlot = nextServerSlot(state.serverSlot);
}

function goToScreen(s) {
  state.bannerTimer = 0;
  if (s === 'shop2') openShop2(false);
  else state.screen = s;
}

function setLook(p, id, speed) {
  const L = LOOKS[id];
  if (!L) return;
  p.lookId = id;
  p.name = L.name;
  p.speedStat = speed != null ? speed : L.speed;
  p.powerStat = 1 - p.speedStat;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function resetPlayerExtras(p) {
  p.up = emptyUpgrades();
  p.money = 0;
  p.active = ''; p.activePool = ''; p.activeKind = ''; p.activeT = 0; p.activeCd = 0; p.clone = null;
  p.bodyScale = 1; p.speedMult = 1; p.powerMult = 1; p.backPref = false; p.out = false;
  p.stun = 0; p.slow = 0; p.burn = 0; p.burnCd = 0;
  p.sprintCooldown = 0; p.sprintActiveTimer = 0;
  p.ready = false; p.vote = '';
}

function setMap(id) {
  state.map = MAPS[id] ? id : 'chile';
  state.lights = [true, true];
  state.ice = null;
  state.embers = [];
  state.bolts = [];
  state.tilt = { x: 0, y: 0, t: 0 };
  state.gust = { w: 0, t: 0 };
  state.hz = { bolt: 600 + Math.random() * 300, tilt: 420, gust: 360 };
}

// Arma las parejas según el modo (lo llama el anfitrión antes de empezar)
function prepareRoster(mode) {
  state.mode = mode;
  state.difficulty = DIFFICULTIES[menuSel.diff].skill;
  const pool = shuffle(CHARACTERS.filter(c => c !== menuSel.char));
  state.players.forEach((p, i) => {
    resetPlayerExtras(p);
    if (i === 0) {
      setLook(p, menuSel.char);
      p.isBot = false;
    } else if (!connections[i]) {
      p.isBot = true;
      setLook(p, pool[i - 1]);
      p.skill = p.team === 0 ? Math.max(TEAMMATE_SKILL, state.difficulty) : state.difficulty;
    }
  });
  if (mode === 'run') {
    state.run = { boss: 0 };
    applyBoss(0);
  }
  state.sets = [0, 0];
  state.score = [0, 0];
  state.games = [0, 0];
  state.tiebreak = false;
  state.result = null;
  updateScoreUI();
}

function giveRandomUpgrades(p, n) {
  for (let k = 0; k < n; k++) {
    const opts = UPGRADES.filter(u => !u.cosmetic && upLvl(p, u.id) < u.max);
    if (!opts.length) return;
    p.up[pick(opts).id]++;
  }
}

function applyBoss(i) {
  const B = BOSSES[i];
  [2, 3].forEach((slot, k) => {
    const p = state.players[slot];
    resetPlayerExtras(p);
    const bp = B.players[k];
    if (!bp) { p.out = true; p.isBot = true; p.x = 2000; p.y = 2000; p.name = ''; return; }
    setLook(p, bp.look, bp.speed);
    if (bp.name) p.name = bp.name;
    p.isBot = true;
    p.skill = B.skill;
    p.bodyScale = bp.bodyScale || 1;
    p.speedMult = bp.speedMult || 1;
    p.powerMult = bp.powerMult || 1;
    p.backPref = !!bp.backPref;
    if (bp.ups) giveRandomUpgrades(p, bp.ups);
    if (bp.active === 'all') { p.activePool = 'all'; p.active = pick(ACTIVE_IDS); }
    else if (bp.active === 'random') p.active = pick(ACTIVE_IDS);
    else if (bp.active) p.active = bp.active;
    p.activeCd = 300 + Math.floor(Math.random() * 600);    // no la usan apenas parte el partido
  });
  // El compañero bot del torneo es vanilla y juega casi al nivel del jefe
  const mate = state.players[1];
  if (mate.isBot) {
    const keepLook = mate.lookId;
    resetPlayerExtras(mate);
    setLook(mate, keepLook);
    mate.skill = Math.max(0.3, B.skill - 0.05);
  }
}

function startFriendly() {
  state.score = [0, 0];
  state.games = [0, 0];
  state.tiebreak = false;
  state.result = null;
  state.players.forEach(p => {
    const keep = { lookId: p.lookId, name: p.name, isBot: p.isBot, skill: p.skill, speedStat: p.speedStat };
    resetPlayerExtras(p);
    Object.assign(p, keep);
    p.powerStat = 1 - p.speedStat;
  });
  updateScoreUI();
  openShop2(true);
}

// ---- Tienda del 2v2 y votación de mapa ----
function openShop2(first) {
  const add = first ? FRIENDLY_START_MONEY : FRIENDLY_SHOP_MONEY;
  state.players.forEach(p => {
    if (p.out) return;
    p.money += add;
    p.ready = false;
    p.vote = '';
    if (p.isBot) botShop(p);
  });
  state.vote = { first };
  state.screen = 'shop2';
  state.bannerTimer = 0;
}

function botShop(p) {
  if (p.money >= ACTIVE_COST && (!p.active || Math.random() < 0.15) && Math.random() < 0.7) {
    p.active = pick(ACTIVE_IDS.filter(a => a !== p.active));
    p.money -= ACTIVE_COST;
  }
  if (!p.active && p.money < ACTIVE_COST && Math.random() < 0.45) return;   // ahorra para una activa
  for (let k = 0; k < 6; k++) {
    const opts = UPGRADES.filter(u => !u.cosmetic && upLvl(p, u.id) < u.max && u.cost <= p.money);
    if (!opts.length) break;
    const u = pick(opts);
    p.up[u.id]++;
    p.money -= u.cost;
  }
}

function setVote(slot, mapId) {
  const p = state.players[slot];
  if (!p || p.isBot || state.screen !== 'shop2') return;
  if (mapId !== 'random' && mapId !== 'keep' && !MAPS[mapId]) return;
  p.vote = mapId;
}

function setReady(slot) {
  const p = state.players[slot];
  if (!p || p.isBot || state.screen !== 'shop2') return;
  p.ready = !p.ready;
}

function checkVoteReady() {
  const humans = state.players.filter(p => !p.isBot && !p.out);
  if (humans.length && humans.every(p => p.ready)) resolveVoteAndPlay();
}

function resolveVoteAndPlay() {
  const counts = {};
  state.players.forEach(p => { if (!p.isBot && p.vote) counts[p.vote] = (counts[p.vote] || 0) + 1; });
  let best = [], max = 0;
  for (const [k, v] of Object.entries(counts)) {
    if (v > max) { max = v; best = [k]; } else if (v === max) best.push(k);
  }
  let choice = best.length ? pick(best) : (state.vote.first ? 'random' : 'keep');
  if (choice === 'random') choice = pick(MAP_IDS);
  const changed = choice !== 'keep' && (choice !== state.map || state.vote.first);
  if (choice !== 'keep') setMap(choice);
  state.players.forEach(p => { p.ready = false; });
  state.screen = 'play';
  setupServe(state.serverSlot);
  const M = mapOf();
  showBanner(`${changed ? 'Mapa: ' : 'Siguen en '}${M.name}\n${M.desc}`, 200);
  updateScoreUI();
}

// ---- Torneo ----
function startRun() {
  state.mode = 'run';
  state.run = { boss: 0 };
  state.players.forEach(p => { if (p.team === 0) { const k = { lookId: p.lookId, name: p.name, isBot: p.isBot, skill: p.skill, speedStat: p.speedStat }; resetPlayerExtras(p); Object.assign(p, k); } });
  applyBoss(0);
  setMap(BOSSES[0].map);
  state.screen = 'route';
  state.bannerTimer = 0;
  updateScoreUI();
}

function startBossMatch() {
  const i = state.run.boss;
  const B = BOSSES[i];
  setMap(B.map);
  applyBoss(i);
  state.players.forEach(p => { p.sprintCooldown = 0; p.sprintActiveTimer = 0; if (p.team === 0) p.activeCd = 0; });
  state.score = [0, 0];
  state.games = [0, 0];
  state.tiebreak = false;
  state.result = null;
  state.afterPause = null;
  state.screen = 'play';
  setupServe(0);
  const serveLine = state.bannerText.split('\n').pop();
  showBanner(`Jefe ${i + 1} de ${BOSSES.length}: ${B.team}\n${B.gamesToWin > 1 ? 'Al mejor de 3 juegos. ' : ''}${serveLine}`, 9999);
  updateScoreUI();
}

function endRunMatch(winner, finalScore) {
  const i = state.run.boss;
  state.result = { winner, score: finalScore, games: [...state.games], boss: i };
  if (winner === 0) {
    state.players.forEach(p => { if (p.team === 0 && !p.isBot) p.money += RUN_REWARD; });
    state.afterPause = i >= BOSSES.length - 1 ? 'champion' : 'shop';
    showBanner(`¡Le ganaron a ${BOSSES[i].team}!\n+$${RUN_REWARD.toLocaleString('es-CL')} para cada uno`, 9999);
  } else {
    state.afterPause = 'lost';
    showBanner(`Perdieron contra ${BOSSES[i].team}\nEl torneo vuelve a empezar`, 9999);
  }
}

function tryBuy(slot, id) {
  const p = state.players[slot];
  if (!p || p.isBot || (state.screen !== 'shop' && state.screen !== 'shop2')) return;
  if (ACTIVES[id]) {
    if (p.active === id || p.money < ACTIVE_COST) return;
    p.money -= ACTIVE_COST;
    p.active = id;
    p.activeCd = 0; p.activeT = 0;
    return;
  }
  const u = UPG[id];
  if (!u) return;
  const lvl = upLvl(p, id);
  if (lvl >= u.max || p.money < u.cost) return;
  p.money -= u.cost;
  p.up[id] = lvl + 1;
}

function resetMatch() {
  if (!isHost) return;
  if (state.mode === 'run') startRun();
  else startFriendly();
}

function setText(id, v) {
  const el = document.getElementById(id);
  if (el && el.textContent !== String(v)) el.textContent = v;
}

function hazardLabel() {
  if (state.screen !== 'play') return '';
  if (state.gust.t > 0) return 'Ráfaga de viento';
  if (state.tilt.t > 0) return 'La cancha se inclina';
  if (state.ice) return 'Cancha de hielo';
  return '';
}

function updateScoreUI() {
  const tb = state.tiebreak;
  const lab = n => (tb ? String(n) : (POINTS_LABELS[n] || '0'));
  const run = state.mode === 'run';
  setText('score-blue', lab(state.score[0]));
  setText('score-red', lab(state.score[1]));
  setText('games-blue', state.games[0]);
  setText('games-red', state.games[1]);
  setText('name-blue', run ? 'Ustedes' : 'Azul');
  setText('name-red', run ? BOSSES[state.run.boss].team : 'Rojo');
  const inGame = state.screen !== 'menu';
  setText('sb-sub', !inGame ? '' : run ? `Jefe ${state.run.boss + 1} de ${BOSSES.length}, ${mapOf().name}` : `Set ${state.sets[0] + state.sets[1] + 1}, ${mapOf().name}`);
  setText('sb-cond', hazardLabel());
  const golden = !tb && state.score[0] === 3 && state.score[1] === 3;
  setText('sb-tag', tb ? 'Tie-break' : 'Punto de oro');
  document.getElementById('sb-tag').classList.toggle('show', tb || golden);
  const sb = document.getElementById('scorebug');
  // En el torneo se ven los juegos solo cuando es al mejor de 3
  sb.classList.toggle('run', run && BOSSES[state.run.boss].gamesToWin === 1);
  const longest = Math.max(document.getElementById('name-blue').textContent.length, document.getElementById('name-red').textContent.length);
  const nw = Math.max(92, Math.round(longest * 8.6 + 16)) + 'px';
  if (sb.style.getPropertyValue('--namew') !== nw) sb.style.setProperty('--namew', nw);
}

// ---- Activas ----
function activate(p, idx) {
  let kind = p.active;
  if (p.activePool === 'all') { kind = pick(ACTIVE_IDS); p.active = kind; }
  if (!kind || !ACTIVES[kind]) return;
  p.activeKind = kind;
  p.activeT = ACTIVE_DURATION;
  p.activeCd = ACTIVE_COOLDOWN;
  if (kind === 'clone') {
    let cy = 2 * COURT.midY - p.y;
    if (Math.abs(cy - p.y) < 90) cy = p.y < COURT.midY ? p.y + 150 : p.y - 150;
    p.clone = { x: p.x, y: clamp(cy, COURT.y + BODY_MARGIN, COURT.y + COURT.h - BODY_MARGIN) };
  }
  if (kind === 'hielo') state.ice = { side: 1 - p.team, t: ACTIVE_DURATION };
  emitSound('power');
  if (Math.random() < 0.55) say(idx, talkLine(p, TALK.power[kind]));
}

// ---- Peligros de los mapas (los decide el anfitrión) ----
function updateHazards() {
  const M = mapOf();
  if (state.ice && --state.ice.t <= 0) state.ice = null;
  state.embers.forEach(e => e.t--);
  state.embers = state.embers.filter(e => e.t > 0);
  if (state.phase === 'POINT_PAUSE') return;

  if (M.gusts) {
    if (state.gust.t > 0) state.gust.t--;
    else if (--state.hz.gust <= 0) {
      state.gust = { w: (Math.random() < 0.5 ? -1 : 1) * (0.014 + Math.random() * 0.006), t: 180 };
      state.hz.gust = 540 + Math.random() * 420;
    }
  }
  if (M.tilt) {
    if (state.tilt.t > 0) {
      if (--state.tilt.t === 0) { state.tilt.x = 0; state.tilt.y = 0; }
    } else if (--state.hz.tilt <= 0) {
      const a = Math.random() * Math.PI * 2;
      state.tilt = { x: Math.cos(a), y: Math.sin(a), t: 240 };
      state.hz.tilt = 480 + Math.random() * 360;
    }
  }
  if (M.bolts && state.phase === 'PLAY') {
    if (--state.hz.bolt <= 0) {
      state.hz.bolt = 840 + Math.random() * 420;
      const zeusBoss = state.mode === 'run' && BOSSES[state.run.boss].solo;
      const teams = zeusBoss ? [0] : [0, 1];
      teams.forEach(t => {
        const cands = state.players.map((p, i) => i).filter(i => state.players[i].team === t && !state.players[i].out);
        if (!cands.length) return;
        const slot = pick(cands);
        state.bolts.push({ slot, t: 120, x: state.players[slot].x, y: state.players[slot].y });
      });
    }
  }
  // Rayos: el aviso sigue al jugador y se fija en el último 0,7 s; si no se mueve, queda paralizado 4 s
  for (const bo of state.bolts) {
    const p = state.players[bo.slot];
    if (bo.t > 42 && p) { bo.x = p.x; bo.y = p.y; }
    if (--bo.t <= 0) {
      state.players.forEach(q => {
        if (!q.out && Math.hypot(q.x - bo.x, q.y - bo.y) < 30) { q.stun = 240; q.charging = false; q.chargeFrames = 0; }
      });
      emitSound('bolt');
    }
  }
  state.bolts = state.bolts.filter(bo => bo.t > 0);
}

// ---- Bots ----
function updateBotLogic(p, idx) {
  const b = state.ball;
  const sk = p.skill == null ? 1 : p.skill;   // 1 = exactamente el bot original
  const lack = Math.max(0, 1 - sk);
  const inp = {
    up: false, down: false, left: false, right: false,
    sprint: false,
    speedPref: p.speedStat,
    charging: p.charging, lobMode: p.lobMode,
    aimX: p.aimX, aimY: p.aimY,
    releaseSeq: p.lastReleaseSeq,
    lastChargeRatio: 0.55, lastReleaseLob: false
  };

  if (state.phase === 'SERVE') {
    if (state.serverSlot === idx) {
      const box = state.serveTargetBox;
      if (state.serveBotTimer > 25) {
        if (!p.charging) {
          // Bots flojos apuntan peor y a veces sacan fuera
          p.botErrX = (Math.random() - 0.5) * lack * 120;
          p.botErrY = (Math.random() - 0.5) * lack * 150;
        }
        inp.charging = true;
        inp.aimX = (box.minX + box.maxX) / 2 + p.botErrX;
        inp.aimY = (box.minY + box.maxY) / 2 + p.botErrY;
      } else if (state.serveBotTimer <= 25 && p.charging) {
        inp.charging = false;
        inp.releaseSeq = p.lastReleaseSeq + 1;
        inp.lastChargeRatio = 0.5;
      }
    }
    return inp;
  }

  // Cada golpe rival: tiempo de reacción, error de posición, chance de fallar y de usar su activa
  if (b.hitSeq !== p.botSeq) {
    p.botSeq = b.hitSeq;
    const incoming = b.lastHitTeam !== p.team;
    p.botDelay = incoming ? Math.round(lack * 26 * (0.6 + Math.random() * 0.8)) : 0;
    p.botErrX = incoming ? (Math.random() - 0.5) * 2 * lack * 50 : 0;
    p.botErrY = incoming ? (Math.random() - 0.5) * 2 * lack * 50 : 0;
    p.botWhiff = incoming && Math.random() < lack * 0.32;
    p.botUseActive = incoming && Math.random() < 0.3 + 0.25 * sk;
    // Juego de pared: si la pelota va a botar cerca de su fondo, a veces la dejan pasar y la juegan de rebote
    p.botWallPlay = false;
    if (incoming) {
      let x = b.x, y = b.y, z = b.z, vx = b.vx, vy = b.vy, vz = b.vz;
      for (let k = 0; k < 300 && z > 0; k++) { x += vx; y += vy; z += vz; vz -= GRAVITY; }
      const ownBack = p.team === 0 ? x - COURT.x : COURT.x + COURT.w - x;
      p.botWallPlay = ownBack < 150 && ownBack > 0 && (b.shotType === 'DRIVE' || b.shotType === 'SAQUE') && Math.random() < WALL_PLAY;
    }
  }

  const partner = state.players[idx % 2 === 0 ? idx + 1 : idx - 1];
  const solo = !partner || partner.out;
  const isTopPlayer = (idx % 2 === 0);
  const backX = p.team === 0 ? 175 : 745;
  const netXPos = p.backPref ? backX : (p.team === 0 ? 315 : 605);
  const homeY = solo ? COURT.midY : (isTopPlayer ? 155 : 365);

  const ballOnMySide = (p.team === 0 && b.x < COURT.netX) || (p.team === 1 && b.x > COURT.netX);
  const ballApproaching = (p.team === 0 && b.vx < 0) || (p.team === 1 && b.vx > 0);
  const inMyHalfY = solo ? true : (isTopPlayer ? (b.y < 285) : (b.y >= 235));

  let targetX = (ballOnMySide || ballApproaching) ? b.x : (b.shotType === 'GLOBO' ? backX : netXPos);
  let targetY = ((ballOnMySide || ballApproaching) && inMyHalfY) ? b.y : homeY;
  const waitWall = p.botWallPlay && !b.wallBounced && b.lastHitTeam !== p.team;
  if (waitWall && (ballOnMySide || ballApproaching)) {
    targetX = p.team === 0 ? Math.min(b.x, COURT.x + 75) : Math.max(b.x, COURT.x + COURT.w - 75);
  }

  if (p.botDelay > 0) {
    p.botDelay--;
    targetX = p.x; targetY = p.y;
  } else if (lack > 0) {
    const near = clamp(Math.hypot(b.x - p.x, b.y - p.y) / 220, 0, 1);
    targetX += p.botErrX * (0.35 + 0.65 * near);
    targetY += p.botErrY * (0.35 + 0.65 * near);
  }
  // Esquiva el aviso de rayo si lo ve venir
  const bolt = state.bolts.find(bo => bo.slot === idx);
  if (bolt && Math.random() < 0.3 + 0.5 * sk) { targetY = p.y + (p.y < COURT.midY ? 80 : -80); }

  if (p.x < targetX - 8) inp.right = true;
  if (p.x > targetX + 8) inp.left = true;
  if (p.y < targetY - 8) inp.down = true;
  if (p.y > targetY + 8) inp.up = true;

  const dir = p.team === 0 ? 1 : -1;
  const paddleX = p.x + dir * PAD_F;
  const paddleY = p.y + PAD_S;
  let distToPaddle = Math.hypot(b.x - paddleX, b.y - paddleY);
  if (p.clone) distToPaddle = Math.min(distToPaddle, Math.hypot(b.x - (p.clone.x + dir * PAD_F), b.y - (p.clone.y + PAD_S)));
  const reach = reachOf(p);

  if (!p.active && sk >= 0.55 && ballOnMySide && inMyHalfY && distToPaddle > 135 && p.sprintCooldown === 0) {
    inp.sprint = true;
  }
  // Activas: la usan cuando la pelota viene a ellos (hielo: justo al pegarle, para que caiga en la cancha congelada)
  if (p.active && p.activeCd === 0 && p.activeT === 0 && p.botUseActive && b.lastHitTeam !== p.team && ballOnMySide) {
    const kind = p.activePool === 'all' ? 'any' : p.active;
    if ((kind === 'hielo' && distToPaddle < reach + 12) || (kind !== 'hielo' && distToPaddle < 160)) inp.sprint = true;
  }

  if (state.phase === 'PLAY' && b.lastHitTeam !== p.team && ballOnMySide && distToPaddle < 130) {
    if (!p.charging && p.cooldown === 0) {
      inp.charging = true;
      // Contrapared: si la pelota ya lo pasó y está pegado a su fondo, le pega a su propio cristal
      const behind = p.team === 0 ? (b.x < p.x - 6) : (b.x > p.x + 6);
      const nearWall = p.team === 0 ? (p.x < COURT.x + 150) : (p.x > COURT.x + COURT.w - 150);
      const contra = behind && nearWall && b.bouncesInOpponentSide >= 1 && Math.random() < 0.6;
      inp.lobMode = !contra && (Math.random() < 0.22 && Math.abs(p.x - COURT.netX) > 220);
      if (contra) {
        inp.aimX = p.team === 0 ? COURT.x - 30 : COURT.x + COURT.w + 30;
        inp.aimY = b.y;
      } else {
        inp.aimX = p.team === 0 ? (600 + Math.random() * 230) : (90 + Math.random() * 230);
        inp.aimY = 260 + (Math.random() - 0.5) * 350 * (0.45 + 0.55 * sk);
      }
    }
    if (p.charging && !p.botWhiff && !waitWall && distToPaddle < reach - 1 && b.z <= reachZOf(p) - 5) {
      inp.charging = false;
      inp.releaseSeq = p.lastReleaseSeq + 1;
      inp.lastChargeRatio = Math.min(p.chargeFrames / MAX_CHARGE_FRAMES, 0.3 + 0.7 * sk);
      inp.lastReleaseLob = p.lobMode;
    }
  } else if (p.charging && b.lastHitTeam === p.team) {
    inp.charging = false;
  }

  return inp;
}

// ¿Está apuntando a su propio cristal de fondo para hacer contrapared?
function isContraAim(p, aimX) {
  if (p.team === 0) return aimX < p.x - 25 && p.x < COURT.x + 170;
  return aimX > p.x + 25 && p.x > COURT.x + COURT.w - 170;
}
function contraTarget(p, aimY) {
  const tx = p.team === 0 ? COURT.netX + (COURT.x + COURT.w - COURT.netX) * 0.72 : COURT.netX - (COURT.netX - COURT.x) * 0.72;
  return { tx, ty: clamp(aimY, COURT.y + 40, COURT.y + COURT.h - 40) };
}
function launchContra(p) {
  const b = state.ball;
  const wallX = p.team === 0 ? COURT.x + 10 : COURT.x + COURT.w - 10;
  const dist = Math.max(14, Math.abs(b.x - wallX));
  const T = Math.max(6, dist / 5.2);
  const wy = clamp(p.aimY, COURT.y + 30, COURT.y + COURT.h - 30);
  b.vx = (wallX - b.x) / T;
  b.vy = (wy - b.y) / T;
  b.vz = (58 - b.z + 0.5 * GRAVITY * T * T) / T;
  b.lastHitTeam = p.team;
  b.bouncesInOpponentSide = 0;
  b.isServeShot = false;
  b.shotType = 'CONTRAPARED';
  b.cut = 0;
  b.cpTarget = contraTarget(p, p.aimY);
  b.hitSeq = (b.hitSeq || 0) + 1;
  b.wallBounced = false;
}

function stepPhysics() {
  if (localInput.charging) {
    localChargeFrames = Math.min(MAX_CHARGE_FRAMES, localChargeFrames + chargeRateOf(state.players[mySlot]));
  } else {
    localChargeFrames = 0;
  }

  if (!isHost) return;

  remoteInputs[0] = { ...localInput };
  if (state.screen === 'shop2') { checkVoteReady(); return; }
  if (state.screen !== 'play') return;

  if (state.bannerTimer > 0 && state.phase === 'PLAY') state.bannerTimer--;
  updateHazards();

  if (state.phase === 'POINT_PAUSE') {
    state.pauseTimer--;
    if (state.pauseTimer <= 0) {
      if (state.afterPause) { const s = state.afterPause; state.afterPause = null; goToScreen(s); }
      else setupServe(state.serverSlot);
    }
    return;
  }

  const b = state.ball;
  const M = mapOf();

  state.players.forEach((p, idx) => {
    if (p.out) return;
    if (p.cooldown > 0) p.cooldown--;
    if (p.swingTimer > 0) p.swingTimer--;
    if (p.sprintActiveTimer > 0) p.sprintActiveTimer--;
    if (p.sprintCooldown > 0) p.sprintCooldown--;
    if (p.activeCd > 0) p.activeCd--;
    if (p.activeT > 0 && --p.activeT === 0) { p.activeKind = ''; p.clone = null; }
    if (p.slow > 0) p.slow--;
    if (p.burn > 0) p.burn--;
    if (p.burnCd > 0) p.burnCd--;

    const inp = p.isBot ? updateBotLogic(p, idx) : remoteInputs[idx];

    if (typeof inp.speedPref === 'number' && !p.isBot) {
      p.speedStat = Math.max(0.15, Math.min(0.85, inp.speedPref));
      p.powerStat = 1 - p.speedStat;
    }

    p.aimX = inp.aimX;
    p.aimY = inp.aimY;

    // Paralizado por un rayo: no se mueve ni le pega
    if (p.stun > 0) {
      p.stun--;
      p.charging = false; p.chargeFrames = 0;
      p.lastReleaseSeq = inp.releaseSeq;
      p.vx = 0; p.vy = 0;
      return;
    }

    // Espacio: activa si tiene una equipada; si no, sprint
    if (inp.sprint) {
      if (p.active) {
        if (p.activeCd === 0 && p.activeT === 0) activate(p, idx);
      } else if (p.sprintCooldown === 0 && p.sprintActiveTimer === 0) {
        const sl = upLvl(p, 'sprint');
        p.sprintDurMax = Math.round(SPRINT_DURATION * (1 + 0.15 * sl));
        p.sprintCdMax = Math.round(SPRINT_COOLDOWN * (1 - 0.3 * sl));
        p.sprintActiveTimer = p.sprintDurMax;
        p.sprintCooldown = p.sprintCdMax;
        emitSound('sprint');
      }
    }

    if (inp.charging && p.cooldown === 0) {
      p.charging = true;
      p.lobMode = inp.lobMode;
      p.chargeFrames = Math.min(MAX_CHARGE_FRAMES, p.chargeFrames + chargeRateOf(p));
    }

    if (inp.releaseSeq !== p.lastReleaseSeq) {
      p.lastReleaseSeq = inp.releaseSeq;
      if (p.cooldown === 0) {
        p.swingTimer = 11;
        p.swingCharge = Math.max(0.15, inp.lastChargeRatio || (p.chargeFrames / MAX_CHARGE_FRAMES));
        p.swingLob = inp.lastReleaseLob;
        p.cooldown = 28;
      }
      p.charging = false;
      p.chargeFrames = 0;
    } else if (!inp.charging) {
      p.charging = false;
      p.chargeFrames = 0;
    }

    // Velocidad
    const sprinting = p.sprintActiveTimer > 0;
    let moveSpeed = (2.75 + p.speedStat * 1.85) * SPEED_BOOST * (p.speedMult || 1);
    if (p.charging) moveSpeed *= sprinting ? 0.8 : 0.68;       // con sprint la carga pesa menos
    if (sprinting) moveSpeed *= 1.58;
    moveSpeed *= 1 + 0.07 * upLvl(p, 'zapas');
    if (p.isBot) moveSpeed *= 0.8 + 0.2 * (p.skill == null ? 1 : p.skill);
    if (actOn(p, 'gordo')) moveSpeed *= 0.45;
    if (p.slow > 0) moveSpeed *= 0.5;
    if (p.burn > 0) moveSpeed *= 0.6;

    const tvx = (inp.right ? moveSpeed : 0) - (inp.left ? moveSpeed : 0);
    const tvy = (inp.down ? moveSpeed : 0) - (inp.up ? moveSpeed : 0);
    if (state.ice && state.ice.side === p.team) {
      // Hielo: cuesta frenar y cambiar de dirección
      p.vx += (tvx - p.vx) * 0.06;
      p.vy += (tvy - p.vy) * 0.06;
    } else {
      p.vx = tvx; p.vy = tvy;
    }
    p.x += p.vx;
    p.y += p.vy;
    if (state.tilt.t > 0) { p.x += state.tilt.x * 0.5; p.y += state.tilt.y * 0.5; }

    let minX = p.team === 0 ? COURT.x + BODY_MARGIN : COURT.netX + NET_MARGIN;
    let maxX = p.team === 0 ? COURT.netX - NET_MARGIN : COURT.x + COURT.w - BODY_MARGIN;
    if (state.phase === 'SERVE' && idx === state.serverSlot) {
      if (p.team === 0) maxX = COURT.serviceLeft - 10;
      else minX = COURT.serviceRight + 10;
    }
    const minY = COURT.y + BODY_MARGIN, maxY = COURT.y + COURT.h - BODY_MARGIN;
    const rawX = p.x, rawY = p.y;
    p.x = Math.max(minX, Math.min(maxX, p.x));
    p.y = Math.max(minY, Math.min(maxY, p.y));

    // Cráter: tocar el cristal quema y empuja hacia adentro
    if (M.hotGlass && p.burnCd === 0) {
      const backWall = p.team === 0 ? rawX < COURT.x + BODY_MARGIN : rawX > COURT.x + COURT.w - BODY_MARGIN;
      const sideWall = rawY < minY || rawY > maxY;
      if (backWall || sideWall) {
        p.burn = 240; p.burnCd = 300;
        if (backWall) p.x += (p.team === 0 ? 1 : -1) * 26;
        if (rawY < minY) p.y += 26;
        if (rawY > maxY) p.y -= 26;
        emitSound('burn');
      }
    }
    if (M.embers) {
      for (const e of state.embers) if (Math.hypot(p.x - e.x, p.y - e.y) < 22) { p.slow = 20; break; }
    }
    if (p.clone) {
      p.clone.x = clamp(p.clone.x + p.vx, minX, maxX);
      p.clone.y = clamp(p.clone.y + p.vy, minY, maxY);
    }

    const dir = p.team === 0 ? 1 : -1;
    const paddleX = p.x + dir * PAD_F;
    const paddleY = p.y + PAD_S;
    const power = (p.powerMult || 1) * (actOn(p, 'gordo') ? 1.5 : 1);

    // FASE DE SAQUE
    if (state.phase === 'SERVE' && idx === state.serverSlot) {
      state.serveTargetBox = computeServeBox(p);
      b.x = paddleX + dir * 6;
      b.y = paddleY;
      b.z = 16;
      if (p.isBot) state.serveBotTimer--;

      if (p.swingTimer > 0) {
        state.phase = 'PLAY';
        p.swingTimer = 0;
        const { tx, ty } = getClampedTarget(p.team, p.aimX, p.aimY, p.swingCharge, p.powerStat, false, true);
        const serveSpeed = (5.4 + (p.swingCharge * 2.2) + (p.powerStat * 1.4)) * (1 + 0.06 * upLvl(p, 'fuerza')) * Math.min(power, 1.15);
        launchBall(tx, ty, serveSpeed, 'SAQUE', p.team, true, upLvl(p, 'cortado'));
        emitSound('hit');
        showBanner('Saque en juego', 35);
      }
      return;
    }

    // FASE DE JUEGO: impacto con la pala (o con la del clon)
    if (state.phase === 'PLAY' && p.swingTimer > 0) {
      const ballStrictlyOnMySide = (p.team === 0 && b.x < COURT.netX - 6) || (p.team === 1 && b.x > COURT.netX + 6);
      if (b.lastHitTeam === p.team || !ballStrictlyOnMySide) return;

      let distToPaddle = Math.hypot(b.x - paddleX, b.y - paddleY);
      if (p.clone) distToPaddle = Math.min(distToPaddle, Math.hypot(b.x - (p.clone.x + dir * PAD_F), b.y - (p.clone.y + PAD_S)));
      if (distToPaddle <= reachOf(p) && b.z <= reachZOf(p)) {
        p.swingTimer = 0;
        const chargePct = Math.round(p.swingCharge * 100);

        if (!p.swingLob && isContraAim(p, p.aimX)) {
          launchContra(p);
          emitSound('hit');
          showBanner('Contrapared', 40);
          return;
        }

        const { tx, ty } = getClampedTarget(p.team, p.aimX, p.aimY, p.swingCharge, p.powerStat, p.swingLob, false);
        const powerMultiplier = (0.78 + (p.powerStat * 0.52)) * (1 + 0.12 * upLvl(p, 'fuerza')) * power;
        const rl = upLvl(p, 'remate');

        if (p.swingLob) {
          const lobSpeed = 3.9 + p.swingCharge * 1.3;
          launchBall(tx, ty, lobSpeed, 'GLOBO', p.team, false, 0);
          emitSound('lob');
          showBanner(`Globo ${chargePct}%`, 35);
        } else if (b.z > smashMinOf(p) && p.swingCharge >= (rl ? 0.4 : 0.5) && Math.abs(p.x - COURT.netX) < 220) {
          const smashSpeed = (7.8 + p.swingCharge * 3.8) * powerMultiplier * (1 + 0.1 * rl);
          launchBall(tx, ty, smashSpeed, '¡REMATE!', p.team, false, 0);
          emitSound(isFlashShot(p) ? 'flash' : 'smash');
          showBanner(`Remate ${chargePct}%`, 45);
        } else {
          const driveSpeed = (5.2 + p.swingCharge * 4.0) * powerMultiplier;
          launchBall(tx, ty, driveSpeed, 'DRIVE', p.team, false, upLvl(p, 'cortado'));
          emitSound(isFlashShot(p) ? 'flash' : 'hit');
        }
      }
    }
  });

  if (state.phase !== 'PLAY') return;

  b.trail.push({ x: b.x, y: b.y, z: b.z });
  if (b.trail.length > 10) b.trail.shift();

  const prevX = b.x;
  b.x += b.vx;
  b.y += b.vy;
  b.z += b.vz;
  b.vz -= GRAVITY;
  if (b.z > 0) {
    if (state.gust.t > 0) b.vy += state.gust.w;
    if (state.tilt.t > 0) { b.vx += state.tilt.x * 0.011; b.vy += state.tilt.y * 0.011; }
  }

  // Focos: un globo altísimo puede romper uno
  LIGHTS.forEach((L, i) => {
    if (!state.lights[i]) return;
    if (Math.hypot(b.x - L.x, b.y - L.y) < 42 && Math.abs(b.z * ZS - L.z) < 36) {
      state.lights[i] = false;
      b.vz = -Math.abs(b.vz) * 0.3;
      b.vx *= 0.6;
      b.vy = (L.y < COURT.midY ? 1 : -1) * Math.max(0.5, Math.abs(b.vy) * 0.6);
      emitSound('lightbreak');
      showBanner('¡Rompieron un foco!\nEse lado de la cancha queda más oscuro', 90);
    }
  });

  // Cruce de red
  const crossedNet = (prevX <= COURT.netX && b.x > COURT.netX) || (prevX >= COURT.netX && b.x < COURT.netX);
  if (crossedNet) {
    if (b.z < NET_H) {
      if (b.bouncesInOpponentSide >= 1) {
        awardPoint(b.lastHitTeam, 'Remate ganador: volvió contra la red');
      } else {
        awardPoint(b.lastHitTeam === 0 ? 1 : 0, b.isServeShot ? 'Falta de saque: red' : 'Pelota en la red', true);
      }
      return;
    }
  }

  // Bote en el suelo
  if (b.z <= 0) {
    b.z = 0;
    const currentSide = b.x < COURT.netX ? 0 : 1;
    const iced = state.ice && state.ice.side === currentSide;
    const bounceRestitution = (b.shotType === '¡REMATE!' ? 0.84 : 0.74 - 0.07 * (b.cut || 0)) * M.bounceZ * (iced ? 0.8 : 1);
    b.vz = Math.abs(b.vz) * bounceRestitution;
    const roll = BASE_ROLL * M.roll * (iced ? 1.08 : 1);
    b.vx *= roll;
    b.vy *= roll;
    if (M.embers && b.shotType === '¡REMATE!') state.embers.push({ x: b.x, y: b.y, t: 240 });
    emitSound('bounce');

    // CASO 1: la pelota bota en el lado del mismo equipo que golpeó
    if (currentSide === b.lastHitTeam) {
      if (b.bouncesInOpponentSide >= 1) {
        awardPoint(b.lastHitTeam, 'Remate ganador: la pelota volvió a su campo');
      } else {
        awardPoint(currentSide === 0 ? 1 : 0, 'Falta: botó en su propio campo', true);
      }
      return;
    }

    // CASO 2: la pelota bota en el campo rival
    if (b.isServeShot && b.bouncesInOpponentSide === 0) {
      const box = state.serveTargetBox;
      const inBoxX = b.x >= box.minX - 4 && b.x <= box.maxX + 4;
      const inBoxY = b.y >= box.minY - 4 && b.y <= box.maxY + 4;
      if (!inBoxX || !inBoxY) {
        awardPoint(b.lastHitTeam === 0 ? 1 : 0, 'Falta de saque: fuera del cuadro', true);
        return;
      }
    }

    b.bouncesInOpponentSide++;

    if (b.bouncesInOpponentSide >= 2) {
      awardPoint(b.lastHitTeam, 'Doble bote');
      return;
    }
  }

  // Rebotes en cristales y malla metálica
  const hitLeft = b.x <= COURT.x + 10;
  const hitRight = b.x >= COURT.x + COURT.w - 10;
  const hitTop = b.y <= COURT.y + 10;
  const hitBottom = b.y >= COURT.y + COURT.h - 10;

  if (hitLeft || hitRight || hitTop || hitBottom) {
    // 0. Contrapared: la pelota pega en el cristal propio y sale en globo hacia el rival
    if (b.shotType === 'CONTRAPARED') {
      const ownSide = (b.x < COURT.netX ? 0 : 1) === b.lastHitTeam;
      if (ownSide && b.cpTarget) {
        if (hitLeft) b.x = COURT.x + 11;
        if (hitRight) b.x = COURT.x + COURT.w - 11;
        if (hitTop) b.y = COURT.y + 11;
        if (hitBottom) b.y = COURT.y + COURT.h - 11;
        const v = computeLaunch(b.x, b.y, b.z, b.cpTarget.tx, b.cpTarget.ty, 4.6, 'GLOBO', b.lastHitTeam);
        b.vx = v.vx; b.vy = v.vy; b.vz = v.vz;
        b.shotType = 'GLOBO';
        b.cpTarget = null;
        state.rally.cp[b.lastHitTeam] = true;
        emitSound('glass');
        return;
      }
    }

    // 1. Contra la pared rival sin haber dado su primer bote en el suelo: fuera
    if (b.bouncesInOpponentSide === 0) {
      const msg = b.isServeShot ? 'Falta de saque: directo a la pared' : 'Fuera: directo al cristal';
      awardPoint(b.lastHitTeam === 0 ? 1 : 0, msg, true);
      return;
    }

    // 2. Saque que bota en el cuadro y luego toca la malla metálica: falta
    const isSideMesh = (hitTop || hitBottom) &&
      (b.x > COURT.x + COURT.glassLength) &&
      (b.x < COURT.x + COURT.w - COURT.glassLength);

    if (b.isServeShot && isSideMesh) {
      awardPoint(b.lastHitTeam === 0 ? 1 : 0, 'Falta de saque: tocó la malla', true);
      return;
    }

    // 3. Tras botar, sale por encima de la pared → punto para quien pegó (por 3 / por 4)
    let wallH = 0;
    if (hitLeft || hitRight) wallH = Math.max(wallH, WALL_H_TALL);
    if (hitTop || hitBottom) wallH = Math.max(wallH, sideWallHeight(b.x));
    if (OVER_WALL_RULE && b.z * ZS > wallH) {
      const overBack = (hitLeft || hitRight);
      awardPoint(b.lastHitTeam, overBack ? 'Por 4: salió por encima del fondo' : 'Por 3: salió por la pared lateral');
      return;
    }

    emitSound('glass');

    let wallRestitution = b.shotType === '¡REMATE!' ? 0.92 : 0.74;
    if (M.hotGlass && (hitLeft || hitRight)) wallRestitution *= 1.3;   // cristales ardientes
    if (hitLeft) { b.x = COURT.x + 11; b.vx = Math.abs(b.vx) * wallRestitution; }
    if (hitRight) { b.x = COURT.x + COURT.w - 11; b.vx = -Math.abs(b.vx) * wallRestitution; }
    if (hitTop) { b.y = COURT.y + 11; b.vy = Math.abs(b.vy) * wallRestitution; }
    if (hitBottom) { b.y = COURT.y + COURT.h - 11; b.vy = -Math.abs(b.vy) * wallRestitution; }

    if (hitLeft || hitRight) b.wallBounced = true;
    if (b.shotType === '¡REMATE!' && (hitLeft || hitRight)) {
      b.vz = Math.max(b.vz, 3.6);
    } else if (b.vz < 2.0) {
      b.vz = 2.4;
    }
    b.isServeShot = false;
  }
}

// Los influencers sacan una foto con flash cuando le pegan cargado
function isFlashShot(p) {
  return p.team === 1 && state.mode === 'run' && BOSSES[state.run.boss].flash && p.swingCharge >= 0.65;
}

// ======================  RENDER 3D EN PERSPECTIVA  ====================
// =====================================================================
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
function angleDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

const FONT_COND = '"Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif';
const FONT_BODY = '"Saira", system-ui, sans-serif';
const COLORS = {
  ball: '#e4ff3a',
  blue: '#45a8ff',
  red: '#ff5c50',
  ink: '#e8f0f7'
};

// Focos sobre los laterales (6,5 m), generan las 4 sombras típicas de un partido nocturno
const LIGHTS = [
  { x: 460, y: 36, z: 300 },     // lateral del fondo
  { x: 460, y: 484, z: 300 }     // lateral cercano a la cámara
];
// Estilo por mapa: césped, pasillo, piso exterior y luz ambiente
const MAP_STYLE = {
  chile:  { turf: [31, 88, 170], apron: [24, 64, 124], outer: 'floor', amb: 0.42, wear: 0.26 },
  brasil: { turf: [36, 98, 172], apron: [196, 174, 128], outer: 'sand', amb: 0.62, wear: 0.42 },
  china:  { turf: [30, 42, 66], apron: [56, 58, 66], outer: 'roof', amb: 0.4, wear: 0.18, border: [176, 28, 40] },
  altura: { turf: [30, 80, 146], apron: [62, 68, 74], outer: 'rock', amb: 0.5, wear: 0.2 },
  atlas:  { turf: [48, 104, 190], apron: [214, 206, 188], outer: 'sky', amb: 0.72, wear: 0.15 },
  crater: { turf: [34, 60, 112], apron: [42, 34, 32], outer: 'lava', amb: 0.4, wear: 0.22 }
};
const styleOf = () => MAP_STYLE[state.map] || MAP_STYLE.chile;
const BACK_Y = -175;     // plano del paisaje de fondo (justo detrás del público)
const BACK_ZK = 0.42;    // el paisaje se pinta "aplastado": cerros lejanos en una franja sobre la tribuna

// ---------- Cámara: inclinada (pitch) y girada en diagonal (yaw) ----------
const cam = { ready: false, team: -1 };

function makeCam(yaw, pitch, dist, target) {
  const hx = Math.sin(yaw), hy = -Math.cos(yaw);
  const f = { x: hx * Math.cos(pitch), y: hy * Math.cos(pitch), z: -Math.sin(pitch) };
  const r = { x: Math.cos(yaw), y: Math.sin(yaw), z: 0 };
  const u = { x: hx * Math.sin(pitch), y: hy * Math.sin(pitch), z: Math.cos(pitch) };
  const C = { x: target.x - f.x * dist, y: target.y - f.y * dist, z: target.z - f.z * dist };
  return { yaw, pitch, f, r, u, C };
}

function setupCamera(team) {
  const yaw = (team === 1 ? -1 : 1) * 0.36;   // ~21°: tu equipo queda más cerca de la cámara
  CAMS.replay = fitCam(-yaw * 1.25, 0.6, 1500, team);
  CAMS.main = fitCam(yaw, 0.83, 1900, team);   // ~48° de inclinación, al estilo MOBA
  Object.assign(cam, CAMS.main);
  cam.ready = true;
}

function fitCam(yaw, pitch, dist, team) {
  const base = makeCam(yaw, pitch, dist, { x: COURT.netX, y: COURT.midY + 8, z: 24 });
  const { f, r, u, C } = base;

  // Encuadre automático: cancha + paredes completas dentro de la vista
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const corners = [[60, 40], [860, 40], [60, 480], [860, 480]];
  for (const [x, y] of corners) {
    for (const z of [0, WALL_H_TALL]) {
      const rx = x - C.x, ry = y - C.y, rz = z - C.z;
      const d = rx * f.x + ry * f.y + rz * f.z;
      const nx = (rx * r.x + ry * r.y) / d;
      const ny = -(rx * u.x + ry * u.y + rz * u.z) / d;
      minX = Math.min(minX, nx); maxX = Math.max(maxX, nx);
      minY = Math.min(minY, ny); maxY = Math.max(maxY, ny);
    }
  }
  const padL = 30, padR = 30, padT = 34, padB = 20;
  const F = Math.min((VIEW_W - padL - padR) / (maxX - minX), (VIEW_H - padT - padB) / (maxY - minY));
  return {
    ...base, team, F, ready: true,
    cx: padL + (VIEW_W - padL - padR) / 2 - F * (minX + maxX) / 2,
    cy: padT + (VIEW_H - padT - padB) / 2 - F * (minY + maxY) / 2
  };
}

// Mundo → pantalla. s = píxeles de pantalla por píxel de mundo a esa profundidad
function P(x, y, z) {
  const rx = x - cam.C.x, ry = y - cam.C.y, rz = z - cam.C.z;
  const d = rx * cam.f.x + ry * cam.f.y + rz * cam.f.z;
  const s = cam.F / d;
  return {
    x: cam.cx + (rx * cam.r.x + ry * cam.r.y) * s,
    y: cam.cy - (rx * cam.u.x + ry * cam.u.y + rz * cam.u.z) * s,
    d, s
  };
}

// Pantalla → suelo (z = 0)
function unprojectGround(sx, sy) {
  const a = (sx - cam.cx) / cam.F;
  const b = -(sy - cam.cy) / cam.F;
  const dx = cam.f.x + a * cam.r.x + b * cam.u.x;
  const dy = cam.f.y + a * cam.r.y + b * cam.u.y;
  const dz = cam.f.z + b * cam.u.z;
  if (dz > -1e-4) return null;
  const t = -cam.C.z / dz;
  return { x: cam.C.x + t * dx, y: cam.C.y + t * dy };
}

function pathPts(c, pts, close = true) {
  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
  if (close) c.closePath();
}

function groundCircle(x, y, r, z = 0, n = 30) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    pts.push(P(x + Math.cos(a) * r, y + Math.sin(a) * r, z));
  }
  return pts;
}

// ---------- Ruido procedural para el césped ----------
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let tx = x - xi, ty = y - yi;
  tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
}

function makeGrid(x0, y0, x1, y1, step, fn) {
  const w = Math.ceil((x1 - x0) / step) + 1, h = Math.ceil((y1 - y0) / step) + 1;
  const data = new Float32Array(w * h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) data[j * w + i] = fn(x0 + i * step, y0 + j * step);
  return { x0, y0, step, w, h, data };
}
function sampleGrid(g, x, y) {
  let fx = (x - g.x0) / g.step, fy = (y - g.y0) / g.step;
  if (fx < 0) fx = 0; else if (fx > g.w - 1.001) fx = g.w - 1.001;
  if (fy < 0) fy = 0; else if (fy > g.h - 1.001) fy = g.h - 1.001;
  const ix = fx | 0, iy = fy | 0, tx = fx - ix, ty = fy - iy, i = iy * g.w + ix, d = g.data;
  return (d[i] * (1 - tx) + d[i + 1] * tx) * (1 - ty) + (d[i + g.w] * (1 - tx) + d[i + g.w + 1] * tx) * ty;
}

// Luz de los 2 focos (caída suave); un foco roto deja su lado más oscuro
function lightField(x, y) {
  let E = 0;
  LIGHTS.forEach((L, i) => {
    if (!state.lights[i]) return;
    const dh = Math.hypot(x - L.x, y - L.y);
    E += 1 / (1 + (dh / 520) * (dh / 520));
  });
  return E;
}

let LUM_GRID = null, WEAR_GRID = null, gridKey = '';
function buildFieldGrids() {
  const key = state.map + '|' + state.lights.join(',');
  if (key !== gridKey) {
    gridKey = key;
    const amb = styleOf().amb;
    LUM_GRID = makeGrid(-900, -900, 1820, 1400, 10, (x, y) => Math.min(1.25, amb + (1.15 - amb) * lightField(x, y) / 1.6));
  }
  if (WEAR_GRID) return;
  const WEAR = [
    [112, 150, 62, 1], [112, 372, 62, 1], [808, 150, 62, 1], [808, 372, 62, 1],
    [150, 260, 70, 0.55], [770, 260, 70, 0.55],
    [405, 165, 45, 0.6], [405, 355, 45, 0.6], [515, 165, 45, 0.6], [515, 355, 45, 0.6]
  ];
  WEAR_GRID = makeGrid(40, 20, 880, 500, 4, (x, y) => {
    let w = 0;
    for (const [cx, cy, r, k] of WEAR) w += k * Math.exp(-((x - cx) ** 2 + (y - cy) ** 2) / (2 * r * r));
    const n = vnoise(x * 0.05, y * 0.05);
    return Math.min(1, w * (0.55 + 0.9 * n));
  });
}

function lineCov(d, fp, w) {
  const lo = Math.max(d - fp * 0.5, -w * 0.5), hi = Math.min(d + fp * 0.5, w * 0.5);
  return hi > lo ? (hi - lo) / Math.max(fp, 1e-3) : 0;
}

// Suelo renderizado píxel a píxel: rayo desde cada píxel al plano del suelo.
// Textura con corrección de perspectiva, antialias de líneas y luz de focos.
function renderGround(lctx, W, H) {
  buildFieldGrids();
  const ST = styleOf();
  const S = W / VIEW_W;
  const img = lctx.createImageData(W, H);
  const data = img.data;
  const { f, r, u, C, F, cx, cy } = cam;
  const prevX = new Float32Array(W), prevY = new Float32Array(W);
  let havePrev = false;

  for (let py = 0; py < H; py++) {
    const ly = (py + 0.5) / S;
    const b = -(ly - cy) / F;
    const dz = f.z + b * u.z;
    let o = py * W * 4;
    if (dz > -1e-4) {
      for (let px = 0; px < W; px++, o += 4) { data[o] = 6; data[o + 1] = 12; data[o + 2] = 20; data[o + 3] = 255; }
      havePrev = false;
      continue;
    }
    const t = -C.z / dz;
    const kx = t * r.x / (F * S), ky = t * r.y / (F * S);
    const a0 = (0.5 / S - cx) / F;
    let X = C.x + t * (f.x + a0 * r.x + b * u.x);
    let Y = C.y + t * (f.y + a0 * r.y + b * u.y);

    for (let px = 0; px < W; px++, X += kx, Y += ky, o += 4) {
      let fx = Math.abs(kx), fy = Math.abs(ky);
      if (havePrev) { fx += Math.abs(X - prevX[px]); fy += Math.abs(Y - prevY[px]); }
      else { fx *= 2.2; fy *= 2.2; }
      prevX[px] = X; prevY[px] = Y;
      const fp = fx > fy ? fx : fy;

      let lum = sampleGrid(LUM_GRID, X, Y);
      let R, G, B;

      const inCourt = X >= 60 && X <= 860 && Y >= 40 && Y <= 480;
      if (inCourt) {
        // Césped sintético con arena
        R = ST.turf[0]; G = ST.turf[1]; B = ST.turf[2];
        const n1 = vnoise(X * 0.013, Y * 0.013) - 0.5;
        const n2 = vnoise(X * 0.07 + 31.7, Y * 0.07 + 17.3) - 0.5;
        let k = 1 + n1 * 0.08 + n2 * 0.05;
        // Rollos de césped (franjas sutiles de instalación)
        k *= ((Math.floor((Y - 40) / 110) & 1) ? 1.02 : 0.985);
        const gAmt = clamp(1.25 - fp * 0.9, 0, 1);
        if (gAmt > 0) {
          k *= 1 + (hash2(Math.floor(X * 1.7), Math.floor(Y * 1.7)) - 0.5) * 0.18 * gAmt;
        }
        R *= k; G *= k; B *= k;
        // Zonas gastadas: la arena aflora donde más se pisa
        const w = sampleGrid(WEAR_GRID, X, Y) * ST.wear;
        R = R + (150 - R) * w; G = G + (146 - G) * w; B = B + (138 - B) * w;
        if (gAmt > 0 && hash2(Math.floor(X * 2.3) + 7, Math.floor(Y * 2.3) + 3) > (state.map === 'brasil' ? 0.955 : 0.982)) {
          const sAmt = 0.4 * gAmt;
          R += (196 - R) * sAmt; G += (184 - G) * sAmt; B += (150 - B) * sAmt;
        }
        // Oclusión ambiental junto a las paredes
        const dw = Math.min(X - 60, 860 - X, Y - 40, 480 - Y);
        if (ST.border && dw < 7) { const c = 0.85; R += (ST.border[0] - R) * c; G += (ST.border[1] - G) * c; B += (ST.border[2] - B) * c; }
        lum *= 1 - 0.36 * Math.exp(-dw / 6);
        // Líneas reglamentarias (5 cm)
        let cov = Math.max(lineCov(X - COURT.serviceLeft, fx, 2), lineCov(X - COURT.serviceRight, fx, 2));
        if (X >= COURT.serviceLeft - 8 && X <= COURT.serviceRight + 8) cov = Math.max(cov, lineCov(Y - COURT.midY, fy, 2));
        if (cov > 0) {
          const c = cov * 0.94;
          R += (236 - R) * c; G += (240 - G) * c; B += (244 - B) * c;
        }
      } else {
        const dOut = Math.max(60 - X, X - 860, 40 - Y, Y - 480);
        const n = vnoise(X * 0.02, Y * 0.02) - 0.5;
        if (dOut < 70 && !(ST.outer === 'sand' && dOut > 20)) {
          // Pasillo alrededor de la cancha
          R = ST.apron[0]; G = ST.apron[1]; B = ST.apron[2];
          const k = 0.92 + n * 0.12;
          R *= k; G *= k; B *= k;
          lum *= 1 - 0.4 * Math.exp(-dOut / 4);
          if (ST.outer === 'sky' && dOut > 58) { R *= 0.7; G *= 0.7; B *= 0.7; }   // canto de la plataforma
        } else if (ST.outer === 'sky') {
          // Cielo bajo la plataforma de Atlas
          const c = vnoise(X * 0.004, Y * 0.006);
          const cloud = clamp((c - 0.45) * 3, 0, 1);
          R = 120 + cloud * 110; G = 150 + cloud * 95; B = 214 + cloud * 35;
          lum = 0.95;
        } else if (ST.outer === 'sand') {
          const k = 1 + n * 0.18 + (hash2(Math.floor(X * 1.3), Math.floor(Y * 1.3)) - 0.5) * 0.08;
          R = 204 * k; G = 178 * k; B = 128 * k;
          lum = Math.max(lum, 0.7) * (0.6 + 0.4 * Math.exp(-Math.max(0, dOut - 70) / 400));
        } else if (ST.outer === 'lava') {
          const v = vnoise(X * 0.012, Y * 0.012);
          const crack = Math.abs(v - 0.5);
          R = 40; G = 32; B = 30;
          if (crack < 0.035 && dOut > 75) {
            const g = 1 - crack / 0.035;
            R = 40 + 215 * g; G = 32 + 90 * g; B = 30 + 10 * g;
            lum = 1;
          } else lum *= 0.55 + 0.45 * Math.exp(-(dOut - 70) / 300);
        } else {
          // Piso del club / azotea / roca
          const k = 1 + n * 0.25;
          if (ST.outer === 'roof') {
            R = 46 * k; G = 48 * k; B = 56 * k;
            if ((Math.floor(X / 60) + Math.floor(Y / 60)) & 1) { R *= 1.06; G *= 1.06; B *= 1.06; }
          } else if (ST.outer === 'rock') { R = 70 * k; G = 74 * k; B = 80 * k; }
          else { R = 30 * k; G = 38 * k; B = 50 * k; }
          const fade = 0.25 + 0.75 * Math.exp(-(dOut - 70) / 260);
          lum *= fade;
          if (dOut < 74) lum *= 0.75;
        }
      }
      // Luz cálida de focos, sombra fría
      R = R * lum + (lum - 1) * 10;
      G = G * lum + (lum - 1) * 6;
      B = B * lum;
      data[o] = R < 0 ? 0 : (R > 255 ? 255 : R);
      data[o + 1] = G < 0 ? 0 : (G > 255 ? 255 : G);
      data[o + 2] = B < 0 ? 0 : (B > 255 ? 255 : B);
      data[o + 3] = 255;
    }
    havePrev = true;
  }
  lctx.putImageData(img, 0, 0);
}

// ---------- Paredes: cristal templado + malla metálica ----------
const WALLS = {
  F: { kind: 'side', pt: (a, z) => ({ x: a, y: COURT.y, z }) },
  N: { kind: 'side', pt: (a, z) => ({ x: a, y: COURT.y + COURT.h, z }) },
  L: { kind: 'back', pt: (a, z) => ({ x: COURT.x, y: a, z }) },
  R: { kind: 'back', pt: (a, z) => ({ x: COURT.x + COURT.w, y: a, z }) }
};

function wallPanels(kind) {
  if (kind === 'back') {
    const out = [];
    for (let i = 0; i < 5; i++) out.push({ a0: 40 + i * 88, a1: 40 + (i + 1) * 88, glass: GLASS_H, top: WALL_H_TALL });
    return out;
  }
  const g = COURT.glassLength / 2;
  const out = [
    { a0: 60, a1: 60 + g, glass: GLASS_H, top: WALL_H_TALL },
    { a0: 60 + g, a1: 60 + 2 * g, glass: GLASS_STEP_H, top: WALL_H_LOW }
  ];
  const m0 = 60 + 2 * g, m1 = 860 - 2 * g;
  for (let i = 0; i < 6; i++) out.push({ a0: m0 + (m1 - m0) * i / 6, a1: m0 + (m1 - m0) * (i + 1) / 6, glass: 0, top: WALL_H_LOW });
  out.push({ a0: 860 - 2 * g, a1: 860 - g, glass: GLASS_STEP_H, top: WALL_H_LOW });
  out.push({ a0: 860 - g, a1: 860, glass: GLASS_H, top: WALL_H_TALL });
  return out;
}

const DOOR = [438, 482], DOOR_H = 84;   // vano de la puerta al centro de la malla lateral

function drawWall(c, key, alpha) {
  const wall = WALLS[key];
  const panels = wallPanels(wall.kind);
  const pt = (a, z) => { const q = wall.pt(a, z); return P(q.x, q.y, q.z); };

  for (const pn of panels) {
    // Cristal
    if (pn.glass > 0) {
      const q = [pt(pn.a0, 0), pt(pn.a1, 0), pt(pn.a1, pn.glass), pt(pn.a0, pn.glass)];
      pathPts(c, q);
      c.fillStyle = `rgba(150, 205, 255, ${0.07 * alpha})`;
      c.fill();
      const gr = c.createLinearGradient(q[0].x, q[0].y, q[2].x, q[2].y);
      gr.addColorStop(0, 'rgba(255,255,255,0)');
      gr.addColorStop(0.38, 'rgba(255,255,255,0)');
      gr.addColorStop(0.46, `rgba(225,240,255,${0.12 * alpha})`);
      gr.addColorStop(0.52, 'rgba(255,255,255,0)');
      gr.addColorStop(0.63, `rgba(225,240,255,${0.06 * alpha})`);
      gr.addColorStop(0.68, 'rgba(255,255,255,0)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = gr;
      c.fill();
      // Canto superior del vidrio
      c.strokeStyle = `rgba(210, 236, 255, ${0.55 * alpha})`;
      c.lineWidth = Math.max(0.8, 1.2 * q[3].s);
      c.beginPath(); c.moveTo(q[3].x, q[3].y); c.lineTo(q[2].x, q[2].y); c.stroke();
      // Junta inferior con el césped
      c.strokeStyle = `rgba(0, 0, 0, ${0.45 * alpha})`;
      c.lineWidth = Math.max(0.8, 1.5 * q[0].s);
      c.beginPath(); c.moveTo(q[0].x, q[0].y); c.lineTo(q[1].x, q[1].y); c.stroke();
    }
    // Malla
    if (pn.top > pn.glass) {
      const z0 = pn.glass, z1 = pn.top;
      const q = [pt(pn.a0, z0), pt(pn.a1, z0), pt(pn.a1, z1), pt(pn.a0, z1)];
      pathPts(c, q);
      c.fillStyle = `rgba(14, 22, 32, ${0.16 * alpha})`;
      c.fill();
      c.strokeStyle = `rgba(150, 168, 188, ${0.2 * alpha})`;
      c.lineWidth = 0.7;
      c.beginPath();
      const step = 8;
      const isSide = wall.kind === 'side';
      const inDoor = a => isSide && a > DOOR[0] && a < DOOR[1];
      for (let a = pn.a0 + step; a < pn.a1 - 1; a += step) {
        const zs = inDoor(a) ? Math.max(z0, DOOR_H) : z0;
        if (zs >= z1) continue;
        const p0 = pt(a, zs), p1 = pt(a, z1);
        c.moveTo(p0.x, p0.y); c.lineTo(p1.x, p1.y);
      }
      for (let z = z0 + step; z < z1 - 1; z += step) {
        if (isSide && z < DOOR_H && pn.a0 < DOOR[1] && pn.a1 > DOOR[0]) {
          // la malla se corta en el vano de la puerta
          const segs = [[pn.a0, Math.max(pn.a0, Math.min(pn.a1, DOOR[0]))], [Math.min(pn.a1, Math.max(pn.a0, DOOR[1])), pn.a1]];
          for (const [a0, a1] of segs) if (a1 - a0 > 1) { const p0 = pt(a0, z), p1 = pt(a1, z); c.moveTo(p0.x, p0.y); c.lineTo(p1.x, p1.y); }
        } else {
          const p0 = pt(pn.a0, z), p1 = pt(pn.a1, z);
          c.moveTo(p0.x, p0.y); c.lineTo(p1.x, p1.y);
        }
      }
      c.stroke();
      // Marco de la malla
      c.strokeStyle = `rgba(22, 28, 36, ${0.9 * alpha})`;
      c.lineWidth = Math.max(1, 2.2 * q[3].s);
      c.beginPath();
      c.moveTo(q[0].x, q[0].y); c.lineTo(q[1].x, q[1].y);
      c.moveTo(q[3].x, q[3].y); c.lineTo(q[2].x, q[2].y);
      c.stroke();
    }
  }

  // Marco de la puerta lateral
  if (wall.kind === 'side') {
    const d0 = pt(DOOR[0], 0), d1 = pt(DOOR[0], DOOR_H), d2 = pt(DOOR[1], DOOR_H), d3 = pt(DOOR[1], 0);
    c.strokeStyle = `rgba(22, 28, 36, ${0.95 * alpha})`;
    c.lineWidth = Math.max(1.2, 2.6 * d1.s);
    c.beginPath(); c.moveTo(d0.x, d0.y); c.lineTo(d1.x, d1.y); c.lineTo(d2.x, d2.y); c.lineTo(d3.x, d3.y); c.stroke();
  }

  // Postes de acero en cada junta
  const posts = new Map();
  for (const pn of panels) {
    posts.set(pn.a0, Math.max(posts.get(pn.a0) || 0, pn.top));
    posts.set(pn.a1, Math.max(posts.get(pn.a1) || 0, pn.top));
  }
  for (const [a, h] of posts) {
    const b0 = pt(a, 0), b1 = pt(a, h);
    const w = Math.max(1.2, 3.2 * (b0.s + b1.s) / 2);
    c.lineCap = 'butt';
    c.strokeStyle = `rgba(20, 26, 34, ${0.95 * alpha})`;
    c.lineWidth = w;
    c.beginPath(); c.moveTo(b0.x, b0.y); c.lineTo(b1.x, b1.y); c.stroke();
    c.strokeStyle = `rgba(190, 210, 230, ${0.18 * alpha})`;
    c.lineWidth = Math.max(0.6, w * 0.3);
    c.beginPath(); c.moveTo(b0.x - w * 0.25, b0.y); c.lineTo(b1.x - w * 0.25, b1.y); c.stroke();
  }
}

function drawNetShadows(c) {
  const hc = NET_H * ZS;
  for (const L of LIGHTS.filter((L, i) => state.lights[i])) {
    const k = L.z / (L.z - hc);
    const pts = [];
    for (let y = COURT.y; y <= COURT.y + COURT.h; y += 20) pts.push(P(COURT.netX, y, 0));
    for (let y = COURT.y + COURT.h; y >= COURT.y; y -= 20) {
      const sx = L.x + (COURT.netX - L.x) * k, sy = clamp(L.y + (y - L.y) * k, COURT.y, COURT.y + COURT.h);
      pts.push(P(sx, sy, 0));
    }
    pathPts(c, pts);
    c.fillStyle = 'rgba(2, 10, 26, 0.12)';
    c.fill();
  }
}

function drawLightFixture(c, i, alpha) {
  const L = LIGHTS[i];
  const on = state.lights[i];
  const outY = i === 0 ? L.y - 22 : L.y + 22;
  const base = P(L.x, outY, 0), top = P(L.x, outY, L.z + 10), arm = P(L.x, L.y, L.z + 10);
  c.save();
  c.globalAlpha = alpha;
  c.strokeStyle = '#141b24';
  c.lineCap = 'butt';
  c.lineWidth = Math.max(1.5, 4 * top.s);
  c.beginPath(); c.moveTo(base.x, base.y); c.lineTo(top.x, top.y); c.lineTo(arm.x, arm.y); c.stroke();
  const q = [P(L.x - 16, L.y - 6, L.z + 4), P(L.x + 16, L.y - 6, L.z + 4), P(L.x + 16, L.y + 6, L.z + 4), P(L.x - 16, L.y + 6, L.z + 4)];
  pathPts(c, q);
  c.fillStyle = '#1b232d';
  c.fill();
  const face = [P(L.x - 13, L.y - 4, L.z), P(L.x + 13, L.y - 4, L.z), P(L.x + 13, L.y + 4, L.z), P(L.x - 13, L.y + 4, L.z)];
  pathPts(c, face);
  c.fillStyle = on ? '#fff8df' : '#2a2f36';
  c.fill();
  if (!on) {
    c.strokeStyle = 'rgba(200, 210, 220, 0.6)';
    c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(face[0].x, face[0].y); c.lineTo(face[2].x, face[2].y); c.moveTo(face[1].x, face[1].y); c.lineTo(face[3].x, face[3].y); c.stroke();
  } else {
    const mid = P(L.x, L.y, L.z);
    c.globalCompositeOperation = 'lighter';
    const g = c.createRadialGradient(mid.x, mid.y, 0, mid.x, mid.y, 100);
    g.addColorStop(0, 'rgba(255, 244, 210, 0.55)');
    g.addColorStop(0.25, 'rgba(255, 236, 190, 0.16)');
    g.addColorStop(1, 'rgba(255, 236, 190, 0)');
    c.fillStyle = g;
    c.fillRect(mid.x - 100, mid.y - 100, 200, 200);
    const g1 = P(L.x - 260, i === 0 ? L.y + 260 : L.y - 260, 0), g2 = P(L.x + 260, i === 0 ? L.y + 260 : L.y - 260, 0);
    const beam = c.createLinearGradient(mid.x, mid.y, (g1.x + g2.x) / 2, (g1.y + g2.y) / 2);
    beam.addColorStop(0, 'rgba(255, 240, 205, 0.06)');
    beam.addColorStop(1, 'rgba(255, 240, 205, 0)');
    c.fillStyle = beam;
    c.beginPath(); c.moveTo(mid.x - 5, mid.y); c.lineTo(g1.x, g1.y); c.lineTo(g2.x, g2.y); c.lineTo(mid.x + 5, mid.y); c.closePath();
    c.fill();
  }
  c.restore();
}

// Paisaje pintado en un plano vertical detrás de la cancha
function BP(x, z) { return P(x, BACK_Y, z * BACK_ZK); }
function planePoly(c, pts, fill) {
  c.beginPath();
  pts.forEach(([x, z], k) => { const q = BP(x, z); if (k) c.lineTo(q.x, q.y); else c.moveTo(q.x, q.y); });
  c.closePath();
  c.fillStyle = fill;
  c.fill();
}
function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function drawBackdrop(c) {
  const id = state.map;
  const X0 = -1600, X1 = 2600;
  // Altura máxima del plano que sigue delante de la cámara (si no, la proyección se da vuelta)
  let Z1 = 3200;
  while (Z1 > 200 && Math.min(BP(X0, Z1).d, BP(X1, Z1).d, BP(460, Z1).d) < 60) Z1 -= 50;
  const SKY = {
    chile: ['#16284a', '#e8935a'], brasil: ['#3a8fd0', '#ffd59a'], china: ['#0b1030', '#3b1530'],
    altura: ['#55657a', '#aab8c6'], atlas: ['#25407f', '#f3d79a'], crater: ['#120606', '#6a1a0a']
  }[id] || ['#0a1626', '#0a1626'];
  const top = BP(460, Math.min(Z1, 1100)), bot = BP(460, 0);
  const g = c.createLinearGradient(top.x, top.y, bot.x, bot.y);
  g.addColorStop(0, SKY[0]); g.addColorStop(1, SKY[1]);
  planePoly(c, [[X0, 0], [X1, 0], [X1, Z1], [X0, Z1]], g);
  const rnd = seeded(id.length * 977 + 13);

  if (id === 'chile' || id === 'altura') {
    // Cordillera nevada en dos capas: primero el cerro, después la nieve en cada cumbre
    for (const [col, hMin, hMax, snow] of [['#4b5a7a', 380, 760, '#f3f5f9'], ['#2c3954', 220, 460, 'rgba(236, 240, 247, 0.92)']]) {
      const peaks = [];
      const pts = [[X0, 0]];
      let x = X0;
      while (x < X1) {
        const h = hMin + rnd() * (hMax - hMin), w = 120 + rnd() * 160;
        const valley = hMin * 0.55 + rnd() * 60;
        pts.push([x + w * 0.5, h]); pts.push([x + w, valley]);
        peaks.push([x + w * 0.5, h, w]);
        x += w;
      }
      pts.push([X1, 0]);
      planePoly(c, pts, col);
      for (const [px, h, w] of peaks) planePoly(c, [[px - w * 0.16, h * 0.74], [px, h], [px + w * 0.16, h * 0.74], [px + w * 0.05, h * 0.8], [px - w * 0.06, h * 0.78]], snow);
    }
    if (id === 'altura') {
      for (let k = 0; k < 14; k++) planePoly(c, ellipsePts(X0 + rnd() * (X1 - X0), 40 + rnd() * 80, 260 + rnd() * 200, 40 + rnd() * 30), 'rgba(225, 232, 240, 0.55)');
    }
  } else if (id === 'brasil') {
    const sun = BP(1500, 300);
    const sg = c.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, 70);
    sg.addColorStop(0, 'rgba(255, 245, 210, 1)'); sg.addColorStop(0.4, 'rgba(255, 220, 150, 0.8)'); sg.addColorStop(1, 'rgba(255, 210, 140, 0)');
    c.fillStyle = sg; c.fillRect(sun.x - 70, sun.y - 70, 140, 140);
    const st = BP(460, 140), sb = BP(460, 0);
    const sea = c.createLinearGradient(st.x, st.y, sb.x, sb.y);
    sea.addColorStop(0, '#1f7fa0'); sea.addColorStop(1, '#45c3cf');
    planePoly(c, [[X0, 0], [X1, 0], [X1, 140], [X0, 140]], sea);
    for (let k = 0; k < 40; k++) { const x = X0 + rnd() * (X1 - X0), z = 10 + rnd() * 120; planePoly(c, [[x, z], [x + 60, z], [x + 60, z + 3], [x, z + 3]], 'rgba(255,255,255,0.35)'); }
  } else if (id === 'china') {
    for (let k = 0; k < 60; k++) {
      const x = X0 + (k / 60) * (X1 - X0) + rnd() * 30, w = 50 + rnd() * 70, h = 160 + rnd() * 520;
      planePoly(c, [[x, 0], [x + w, 0], [x + w, h], [x, h]], k % 3 ? '#151b36' : '#1b2244');
      for (let wy = 30; wy < h - 20; wy += 28) for (let wx = x + 10; wx < x + w - 10; wx += 16) {
        if (rnd() < 0.35) planePoly(c, [[wx, wy], [wx + 7, wy], [wx + 7, wy + 10], [wx, wy + 10]], rnd() < 0.7 ? '#ffd27a' : '#9fd3ff');
      }
    }
    // Pagoda
    for (let t = 0; t < 5; t++) {
      const z = t * 110, w = 230 - t * 34;
      planePoly(c, [[-80 - w / 2, z], [-80 + w / 2, z], [-80 + w / 2 - 18, z + 80], [-80 - w / 2 + 18, z + 80]], '#3a1520');
      planePoly(c, [[-80 - w / 2 - 40, z + 80], [-80 + w / 2 + 40, z + 80], [-80 + w / 2 - 10, z + 108], [-80 - w / 2 + 10, z + 108]], '#7a1e2a');
    }
    // Torre con esferas
    planePoly(c, [[1185, 0], [1215, 0], [1205, 1100], [1195, 1100]], '#2a2448');
    planePoly(c, ellipsePts(1200, 420, 95, 95), '#c8457a');
    planePoly(c, ellipsePts(1200, 780, 60, 60), '#d85a8a');
  } else if (id === 'atlas') {
    for (let k = 0; k < 18; k++) planePoly(c, ellipsePts(X0 + rnd() * (X1 - X0), 80 + rnd() * 900, 180 + rnd() * 220, 50 + rnd() * 50), 'rgba(255, 255, 255, 0.55)');
    // El titán Atlas sostiene la cancha sobre sus hombros
    const bronze = '#9a6b3e', dark = '#6e4626';
    planePoly(c, [[-500, 0], [1420, 0], [1250, 420], [-330, 420]], dark);                   // hombros
    planePoly(c, [[-560, 0], [-330, 420], [-420, 780], [-640, 420]], bronze);              // brazo izquierdo alzado
    planePoly(c, [[1480, 0], [1250, 420], [1340, 780], [1560, 420]], bronze);              // brazo derecho alzado
    planePoly(c, ellipsePts(460, 700, 260, 560), bronze);                                  // cabeza
    planePoly(c, [[230, 560], [690, 560], [610, 200], [310, 200]], '#e9e3d6');             // barba
    planePoly(c, [[330, 800], [420, 780], [420, 765], [330, 780]], dark);                  // ojos cerrados
    planePoly(c, [[500, 780], [590, 800], [590, 780], [500, 765]], dark);
  } else if (id === 'crater') {
    planePoly(c, [[-1200, 0], [-300, 700], [-60, 760], [160, 690], [900, 0]], '#1c0e0a');   // volcán
    const cr = BP(-60, 740);
    const cg = c.createRadialGradient(cr.x, cr.y, 0, cr.x, cr.y, 90);
    cg.addColorStop(0, 'rgba(255, 170, 60, 0.95)'); cg.addColorStop(1, 'rgba(255, 80, 20, 0)');
    c.fillStyle = cg; c.fillRect(cr.x - 90, cr.y - 90, 180, 180);
    for (const [x0, x1] of [[-120, -500], [0, 380], [-60, 120]]) planePoly(c, [[x0, 720], [x0 + 18, 720], [x1 + 30, 0], [x1, 0]], 'rgba(255, 110, 30, 0.85)');
    for (let k = 0; k < 10; k++) planePoly(c, ellipsePts(-60 + (rnd() - 0.5) * 900, 900 + rnd() * 900, 160 + rnd() * 160, 70 + rnd() * 50), 'rgba(40, 20, 18, 0.7)');
  }
}

function ellipsePts(cx, cz, rx, rz) {
  const out = [];
  for (let k = 0; k < 20; k++) { const a = k / 20 * Math.PI * 2; out.push([cx + Math.cos(a) * rx, cz + Math.sin(a) * rz]); }
  return out;
}

// Público simple alrededor de la cancha
const CROWD_STYLE = {
  chile: () => pick([['#d52b1e', '#ffffff'], ['#c8102e', '#111111'], ['#1f3f99', '#d52b1e'], ['#f4f4f4', '#111111']]),
  brasil: () => pick([['#ffdf00', '#1fa34a'], ['#1fa34a', '#ffdf00'], ['#2b6fd6', '#ffffff'], ['#ffffff', '#1fa34a']]),
  china: () => pick([['#c8102e', '#ffcc33'], ['#ffcc33', '#c8102e'], ['#222222', '#c8102e'], ['#f4f4f4', '#c8102e']]),
  altura: () => pick([['#f4b400', '#333333'], ['#e53935', '#333333'], ['#1e88e5', '#ffffff'], ['#43a047', '#ffffff']]),
  atlas: () => ['#f6f2e8', '#ffd54a'],
  crater: () => (Math.random() < 0.5 ? ['bone', '#e8e2d0'] : ['devil', '#c62828'])
};
const SKINS_CROWD = ['#e9c09b', '#c9935f', '#8a5a3c', '#f2d2b6', '#b07a52'];

function drawCrowd(c) {
  const style = CROWD_STYLE[state.map] || CROWD_STYLE.chile;
  const seats = [];
  for (let row = 0; row < 3; row++) {
    const y = -36 - row * 38;
    for (let x = 64; x < 860; x += 24) seats.push({ x: x + (row % 2) * 12, y, z: row * 14 });
  }
  for (const side of [-1, 1]) for (let row = 0; row < 2; row++) {
    const x = side < 0 ? 22 - row * 34 : 898 + row * 34;
    for (let y = 70; y < 460; y += 28) seats.push({ x, y: y + (row % 2) * 14, z: row * 14 });
  }
  // Gradas
  c.fillStyle = 'rgba(60, 66, 76, 0.85)';
  for (let row = 0; row < 3; row++) {
    const y = -36 - row * 38, z = row * 14;
    pathPts(c, [P(56, y - 14, z), P(872, y - 14, z), P(872, y + 14, z), P(56, y + 14, z)]);
    c.fill();
  }
  const rnd = seeded(4242);
  const old = Math.random;
  Math.random = rnd;           // público siempre igual en cada reconstrucción
  try {
    seats.map(s => ({ ...s, d: P(s.x, s.y, 30).d })).sort((a, b) => b.d - a.d).forEach(s => {
      if (rnd() < 0.18) return;     // asientos vacíos
      const [shirt, accent] = style();
      const body = P(s.x, s.y, s.z + 20), head = P(s.x, s.y, s.z + 38);
      const k = body.s;
      if (state.map === 'atlas') {
        // ángeles: alas y aureola
        c.fillStyle = 'rgba(255,255,255,0.9)';
        c.beginPath(); c.moveTo(body.x, body.y - 4 * k); c.lineTo(body.x - 16 * k, body.y - 14 * k); c.lineTo(body.x - 6 * k, body.y + 4 * k); c.fill();
        c.beginPath(); c.moveTo(body.x, body.y - 4 * k); c.lineTo(body.x + 16 * k, body.y - 14 * k); c.lineTo(body.x + 6 * k, body.y + 4 * k); c.fill();
      }
      if (state.map === 'brasil' && rnd() < 0.2) {
        const um = P(s.x, s.y, s.z + 62);
        c.fillStyle = pick(['#ff5252', '#ffd740', '#40c4ff', '#69f0ae']);
        c.beginPath(); c.ellipse(um.x, um.y, 16 * k, 6 * k, 0, Math.PI, 0); c.fill();
      }
      const bone = shirt === 'bone', devil = shirt === 'devil';
      c.fillStyle = bone ? '#e8e2d0' : devil ? '#b71c1c' : shirt;
      c.beginPath(); c.ellipse(body.x, body.y, 7.5 * k * (bone ? 0.75 : 1), 10 * k, 0, 0, Math.PI * 2); c.fill();
      if (!bone && !devil) {
        c.fillStyle = accent;
        c.fillRect(body.x - 7 * k, body.y - 2 * k, 14 * k, 2.4 * k);
      } else if (bone) {
        c.strokeStyle = '#6d665a'; c.lineWidth = 0.7;
        c.beginPath(); for (let r = -1; r <= 1; r++) { c.moveTo(body.x - 4 * k, body.y + r * 3 * k); c.lineTo(body.x + 4 * k, body.y + r * 3 * k); } c.stroke();
      }
      c.fillStyle = bone ? '#efe9da' : devil ? '#d32f2f' : pick(SKINS_CROWD);
      c.beginPath(); c.arc(head.x, head.y, 5.4 * k, 0, Math.PI * 2); c.fill();
      if (bone) { c.fillStyle = '#222'; c.fillRect(head.x - 2.6 * k, head.y - 1 * k, 1.6 * k, 1.6 * k); c.fillRect(head.x + 1 * k, head.y - 1 * k, 1.6 * k, 1.6 * k); }
      if (devil) {
        c.fillStyle = '#ffcc80';
        c.beginPath(); c.moveTo(head.x - 4 * k, head.y - 3 * k); c.lineTo(head.x - 3 * k, head.y - 9 * k); c.lineTo(head.x - 1.5 * k, head.y - 4 * k); c.fill();
        c.beginPath(); c.moveTo(head.x + 4 * k, head.y - 3 * k); c.lineTo(head.x + 3 * k, head.y - 9 * k); c.lineTo(head.x + 1.5 * k, head.y - 4 * k); c.fill();
      }
      if (state.map === 'atlas') {
        c.strokeStyle = '#ffd54a'; c.lineWidth = Math.max(0.8, 1.4 * k);
        c.beginPath(); c.ellipse(head.x, head.y - 8 * k, 5 * k, 1.8 * k, 0, 0, Math.PI * 2); c.stroke();
      }
    });
  } finally {
    Math.random = old;
  }
}

// Utilería de cada mapa (palmeras, faroles, banderines, rocas)
function drawProps(c) {
  const id = state.map;
  if (id === 'brasil') {
    for (const [x, y] of [[-40, -70], [960, -50], [-90, 230], [1010, 330], [300, -200], [700, -190]]) drawPalm(c, x, y);
    // Banderines verde-amarillos sobre el fondo
    for (let x = 60; x < 860; x += 20) {
      const a = P(x, 40, 164), b = P(x + 20, 40, 164), m = P(x + 10, 40, 150);
      c.fillStyle = (x / 20) % 2 ? '#1fa34a' : '#ffdf00';
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.lineTo(m.x, m.y); c.fill();
    }
  } else if (id === 'china') {
    // Farolillos rojos colgando afuera
    const y = -12;
    c.strokeStyle = 'rgba(30, 20, 20, 0.8)'; c.lineWidth = 1;
    c.beginPath(); for (let x = 40; x <= 880; x += 20) { const q = P(x, y, 205 - Math.sin((x - 40) / 840 * Math.PI) * 18); if (x === 40) c.moveTo(q.x, q.y); else c.lineTo(q.x, q.y); } c.stroke();
    for (let x = 80; x < 860; x += 70) {
      const q = P(x, y, 190 - Math.sin((x - 40) / 840 * Math.PI) * 18);
      const r = 8 * q.s;
      const g = c.createRadialGradient(q.x, q.y, 0, q.x, q.y, r * 3);
      g.addColorStop(0, 'rgba(255, 120, 80, 0.5)'); g.addColorStop(1, 'rgba(255, 60, 40, 0)');
      c.fillStyle = g; c.fillRect(q.x - r * 3, q.y - r * 3, r * 6, r * 6);
      c.fillStyle = '#d71f2a'; c.beginPath(); c.ellipse(q.x, q.y, r, r * 1.2, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#ffcc33'; c.fillRect(q.x - r * 0.5, q.y - r * 1.35, r, r * 0.3); c.fillRect(q.x - r * 0.5, q.y + r * 1.05, r, r * 0.3);
    }
  } else if (id === 'crater') {
    for (const [x, y, s] of [[-60, -60, 1.2], [990, -40, 1], [-70, 520, 0.9], [990, 560, 1.1], [420, -210, 1.4]]) {
      const pts = [];
      for (let k = 0; k < 7; k++) { const a = k / 7 * Math.PI * 2; pts.push(P(x + Math.cos(a) * 40 * s, y + Math.sin(a) * 26 * s, 0)); }
      pts.push(P(x, y, 70 * s));
      c.fillStyle = '#231512';
      pathPts(c, [pts[0], pts[1], pts[2], pts[7], pts[5], pts[6]]); c.fill();
    }
  }
}

function drawPalm(c, x, y) {
  const base = P(x, y, 0);
  const pts = [];
  for (let k = 0; k <= 8; k++) { const t = k / 8; pts.push(P(x + Math.sin(t * 1.4) * 30, y, t * 230)); }
  c.strokeStyle = '#7a5a36'; c.lineCap = 'round';
  c.lineWidth = Math.max(2, 7 * base.s);
  pathPts(c, pts, false); c.stroke();
  const top = pts[pts.length - 1];
  c.fillStyle = '#2e7d32';
  for (let k = 0; k < 7; k++) {
    const a = k / 7 * Math.PI * 2;
    const tip = P(x + Math.sin(1.4) * 30 + Math.cos(a) * 80, y + Math.sin(a) * 60, 200);
    const mid = P(x + Math.sin(1.4) * 30 + Math.cos(a) * 40, y + Math.sin(a) * 30, 240);
    c.beginPath(); c.moveTo(top.x, top.y); c.quadraticCurveTo(mid.x, mid.y - 6, tip.x, tip.y); c.quadraticCurveTo(mid.x, mid.y + 4, top.x, top.y); c.fill();
  }
}

// ---------- Capas estáticas en caché (una por cámara: juego y repetición) ----------
const staticLayer = document.createElement('canvas');
const fgLayer = document.createElement('canvas');
const groundLayer = document.createElement('canvas');
const LAYERS = {
  main: { st: staticLayer, fg: fgLayer, key: '' },
  replay: { st: document.createElement('canvas'), fg: document.createElement('canvas'), key: '' }
};
const CAMS = { main: null, replay: null };
let renderScale = 1;

function layerKey(which) {
  return [which, canvas.width, canvas.height, state.map, state.lights.join(','), cam.team, CAMS[which] && CAMS[which].yaw].join('|');
}

function rebuildLayers(which = 'main') {
  if (which === 'main' && !CAMS.main && cam.ready) CAMS.main = { ...cam };
  if (!cam.ready || !CAMS[which]) return;
  const saved = { ...cam };
  Object.assign(cam, CAMS[which]);
  try {
    const W = canvas.width, H = canvas.height;
    renderScale = W / VIEW_W;
    const set = LAYERS[which];
    for (const l of [set.st, set.fg]) { l.width = W; l.height = H; }

    const s = set.st.getContext('2d');
    const gScale = Math.min(renderScale, 1.5);
    groundLayer.width = Math.round(VIEW_W * gScale);
    groundLayer.height = Math.round(VIEW_H * gScale);
    renderGround(groundLayer.getContext('2d'), groundLayer.width, groundLayer.height);
    s.setTransform(1, 0, 0, 1, 0, 0);
    s.imageSmoothingEnabled = true;
    s.imageSmoothingQuality = 'high';
    s.drawImage(groundLayer, 0, 0, W, H);
    s.setTransform(renderScale, 0, 0, renderScale, 0, 0);
    drawBackdrop(s);
    drawCrowd(s);
    drawProps(s);
    drawNetShadows(s);
    drawLightFixture(s, 0, 1);
    drawWall(s, 'F', 1);
    const lFar = P(COURT.x, COURT.midY, 0).d > P(COURT.x + COURT.w, COURT.midY, 0).d;
    drawWall(s, lFar ? 'L' : 'R', 1);
    drawWall(s, lFar ? 'R' : 'L', 1);

    const g = set.fg.getContext('2d');
    g.setTransform(renderScale, 0, 0, renderScale, 0, 0);
    g.clearRect(0, 0, VIEW_W, VIEW_H);
    drawWall(g, 'N', 0.42);
    const v = g.createRadialGradient(VIEW_W / 2, VIEW_H * 0.52, VIEW_W * 0.32, VIEW_W / 2, VIEW_H * 0.52, VIEW_W * 0.78);
    v.addColorStop(0, 'rgba(3, 8, 16, 0)');
    v.addColorStop(1, 'rgba(3, 8, 16, 0.55)');
    g.fillStyle = v;
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    set.key = layerKey(which);
  } finally {
    Object.assign(cam, saved);
  }
}

function resizeCanvas() {
  const rect = wrapper.getBoundingClientRect();
  if (rect.width < 10) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(rect.width * dpr);
  const h = Math.round(w * VIEW_H / VIEW_W);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    renderScale = w / VIEW_W;
  }
}

let resizeTimer = null;
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resizeCanvas, 120);
}).observe(wrapper);

// ---------- Efectos (solo visuales, viven en cada cliente) ----------
function newPf() {
  return {
    phase: 0, facing: null, lastX: null, lastY: null, vx: 0, vy: 0,
    lastCooldown: 0, swingT: -1, swingKind: 'drive', from: null,
    pose: { beta: 0.35, z: 44, reach: 11, tilt: 0.9, kind: 'ready' }, tips: [], dust: 0
  };
}

const fx = {
  particles: [],
  rings: [],
  ripples: [],
  impacts: [],
  shake: 0,
  net: { amp: 0, y0: 260, t: 0, dir: 1 },
  ballSpin: 0,
  players: [0, 1, 2, 3].map(() => newPf()),
  clones: [0, 1, 2, 3].map(() => newPf()),
  servingTeam: -1,
  rain: [],
  streaks: [],
  birds: [],
  sparks: [],
  strikes: [],
  flash: 0,
  replay: null, replaySeq: -1,
  celeb: null, celebQueue: null, celebSeq: -1,
  talk: null, talkSeq: -1,
  prevLights: [true, true],
  prevBolts: [],
  view: { rot: 0, oy: 0, k: 1 },
  inited: false
};

// ---------- Repetición: se graban los últimos ~1,5 s de juego ----------
const replayBuf = [];
function recordFrame() {
