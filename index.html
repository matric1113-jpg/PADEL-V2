<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Padel Club 2v2 Online – Pro Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --night: #0a1724;
      --night-2: #0f2131;
      --panel: #11263a;
      --line: rgba(150, 190, 225, 0.16);
      --ink: #e8f0f7;
      --ink-dim: #8fa6bb;
      --ball: #e4ff3a;
      --blue: #45a8ff;
      --red: #ff5c50;
      --cond: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
      --body: 'Saira', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 80% at 50% 0%, #12304a 0%, var(--night) 60%);
      color: var(--ink);
      font-family: var(--body);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      gap: 10px;
      user-select: none;
      min-height: 100vh;
    }

    /* ---------- Escenario ---------- */
    #canvas-wrapper {
      position: relative;
      width: min(100%, calc((100vh - 150px) * 16 / 9));
      min-width: 320px;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background: #071019;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(150, 190, 225, 0.12);
    }
    canvas#game { display: block; width: 100%; height: 100%; cursor: none; }

    /* Marcador estilo transmisión */
    .scorebug {
      position: absolute;
      top: 14px;
      left: 14px;
      display: grid;
      grid-template-columns: auto;
      gap: 2px;
      font-family: var(--cond);
      pointer-events: none;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
    }
    .scorebug.flip { left: auto; right: 14px; }
    .sb-row {
      justify-self: start;
      display: grid;
      grid-template-columns: 5px 14px var(--namew, 92px) 30px 40px;
      align-items: stretch;
      height: 30px;
      background: rgba(8, 19, 31, 0.9);
    }
    .sb-row:first-child { border-radius: 6px 6px 0 0; overflow: hidden; }
    .sb-row:nth-child(2) { border-radius: 0 0 6px 6px; overflow: hidden; }
    .sb-strip { background: var(--blue); }
    .sb-red .sb-strip { background: var(--red); }
    .sb-serve { display: grid; place-items: center; }
    .sb-serve::after {
      content: '';
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--ball);
      box-shadow: 0 0 6px rgba(228, 255, 58, 0.8);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .sb-row.serving .sb-serve::after { opacity: 1; }
    .sb-team { align-self: center; font-weight: 600; font-size: 17px; letter-spacing: 0.02em; padding: 0 10px 0 2px; white-space: nowrap; }
    .scorebug.run .sb-row { grid-template-columns: 5px 14px var(--namew, 92px) 40px; }
    .scorebug.run .sb-games { display: none; }
    .sb-meta { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
    .sb-sub { font-weight: 600; font-size: 13px; color: var(--ink); background: rgba(8, 19, 31, 0.85); padding: 2px 8px; border-radius: 4px; }
    .sb-sub:empty { display: none; }
    .sb-games {
      display: grid; place-items: center;
      font-weight: 600; font-size: 17px;
      color: var(--ink-dim);
      background: rgba(255, 255, 255, 0.05);
    }
    .sb-pts {
      display: grid; place-items: center;
      font-weight: 700; font-size: 19px;
      background: #eef3f8; color: #0b1a29;
      font-variant-numeric: tabular-nums;
    }
    .sb-tag {
      font-weight: 600; font-size: 13px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--ball); color: #18210a;
      display: none;
    }
    .sb-tag.show { display: block; }

    .room-pill {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(8, 19, 31, 0.82);
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      pointer-events: none;
    }
    .room-pill.flip { right: auto; left: 14px; }

    /* ---------- Panel de sala ---------- */
    .dock {
      width: min(100%, calc((100vh - 150px) * 16 / 9));
      min-width: 320px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
    }
    .brand {
      font-family: var(--cond);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.01em;
      display: flex; align-items: center; gap: 8px;
    }
    .brand-ball {
      width: 14px; height: 14px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fbffd0 0%, var(--ball) 40%, #8fa61e 100%);
    }
    .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input, select {
      font-family: var(--body);
      background: var(--night);
      border: 1px solid rgba(150, 190, 225, 0.25);
      color: var(--ink);
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 14px;
      outline: none;
    }
    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 2px solid var(--ball);
      outline-offset: 2px;
    }
    select { cursor: pointer; }
    button {
      font-family: var(--body);
      font-weight: 600;
      font-size: 14px;
      padding: 7px 14px;
      border-radius: 7px;
      border: 1px solid rgba(150, 190, 225, 0.28);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: rgba(150, 190, 225, 0.1); }
    button.primary { background: var(--ball); color: #16200a; border-color: var(--ball); }
    button.primary:hover { background: #eeff7a; }
    button.on { border-color: var(--ball); color: var(--ball); }
    .sep { width: 1px; height: 26px; background: var(--line); }

    .keys {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 18px;
      font-size: 13px;
      color: var(--ink-dim);
    }
    .key {
      display: inline-block;
      font-family: var(--cond);
      font-weight: 600;
      font-size: 13px;
      color: var(--ink);
      background: rgba(150, 190, 225, 0.1);
      border: 1px solid rgba(150, 190, 225, 0.22);
      border-bottom-width: 2px;
      padding: 0 7px;
      border-radius: 5px;
      margin-right: 4px;
    }
    /* ---------- Menús sobre la cancha ---------- */
    .overlay {
      position: absolute; inset: 0;
      display: none;
      overflow: auto;
      padding: 20px;
      background: rgba(5, 13, 22, 0.76);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 5;
    }
    .overlay.show { display: flex; }
    .ov-panel { width: min(100%, 1000px); margin: auto; }
    .ov-title { font-family: var(--cond); font-weight: 700; font-size: clamp(26px, 3vw, 38px); line-height: 1.05; }
    .ov-sub { color: var(--ink-dim); margin-top: 6px; font-size: 15px; max-width: 70ch; }
    .ov-h { font-family: var(--cond); font-weight: 600; font-size: 18px; margin-top: 16px; color: var(--ink); }
    .cards { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
    .card, .mode, .item {
      background: rgba(17, 38, 58, 0.92);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: inherit;
      font: inherit;
      text-align: left;
    }
    .card { padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
    .card:hover, .mode:hover { border-color: rgba(228, 255, 58, 0.45); background: rgba(22, 48, 72, 0.95); }
    .card.sel, .mode.sel { border-color: var(--ball); box-shadow: inset 0 0 0 1px var(--ball); }
    .portrait {
      display: block; width: 100%; aspect-ratio: 1 / 1; border-radius: 7px;
      background: radial-gradient(120% 90% at 50% 100%, #2a63b0 0%, #163a66 45%, #0c2036 100%);
    }
    .card .nm { font-family: var(--cond); font-weight: 700; font-size: 21px; line-height: 1; }
    .card .rl { font-size: 13px; color: var(--ball); font-weight: 600; }
    .stat { display: grid; grid-template-columns: 58px 1fr; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-dim); }
    .bar { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.09); overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--blue); }
    .bar.pw i { background: var(--red); }
    .card .ds { font-size: 12px; color: var(--ink-dim); line-height: 1.35; }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .mode { padding: 12px 14px; cursor: pointer; }
    .mode h3 { font-family: var(--cond); font-weight: 700; font-size: 20px; }
    .mode p { font-size: 13px; color: var(--ink-dim); margin-top: 3px; line-height: 1.4; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
    .row .lbl { font-size: 14px; color: var(--ink-dim); }
    .net-msg { margin-top: 10px; padding: 9px 12px; border-radius: 8px; background: rgba(255, 92, 80, 0.12); border: 1px solid rgba(255, 92, 80, 0.4); font-size: 14px; max-width: 75ch; }
    .seg { display: inline-flex; border: 1px solid rgba(150, 190, 225, 0.28); border-radius: 8px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; border-right: 1px solid rgba(150, 190, 225, 0.18); }
    .seg button:last-child { border-right: 0; }
    .seg button.sel { background: rgba(228, 255, 58, 0.16); color: var(--ball); }
    .spacer { flex: 1; }
    button.big { font-size: 16px; padding: 10px 20px; }
    .shop { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
    .item { padding: 11px 12px; display: flex; flex-direction: column; gap: 6px; }
    .item h4 { font-family: var(--cond); font-weight: 700; font-size: 18px; }
    .item p { font-size: 12.5px; color: var(--ink-dim); line-height: 1.35; flex: 1; }
    .item .team { font-size: 11px; color: var(--ball); font-weight: 600; }
    .pips { display: flex; gap: 4px; }
    .pips i { width: 16px; height: 5px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); }
    .pips i.on { background: var(--ball); }
    .item button { width: 100%; }
    button:disabled { opacity: 0.4; cursor: default; }
    button:disabled:hover { background: transparent; }
    .money { font-family: var(--cond); font-weight: 700; font-size: 26px; color: var(--ball); }
    .wallets { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 12px; align-items: baseline; }
    .wallets div { font-size: 14px; color: var(--ink-dim); }
    .rivals { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
    .rivals .portrait { width: 92px; }
    .rivals .who { font-size: 14px; color: var(--ink-dim); line-height: 1.5; }
    .rivals .who b { color: var(--ink); font-family: var(--cond); font-size: 20px; font-weight: 700; }
    .slots { display: grid; gap: 6px; margin-top: 12px; max-width: 520px; }
    .slot { display: grid; grid-template-columns: 6px 1fr auto; gap: 10px; align-items: center; background: rgba(17, 38, 58, 0.92); border-radius: 8px; padding: 8px 12px 8px 0; font-size: 15px; }
    .slot .tm { align-self: stretch; border-radius: 8px 0 0 8px; background: var(--blue); }
    .slot.red .tm { background: var(--red); }
    .slot .kind { font-size: 13px; color: var(--ink-dim); }
    .slot .kind.me { color: var(--ball); font-weight: 600; }
    .ladder { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .ladder span { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-dim); }
    .ladder span.done { color: #16200a; background: var(--ball); border-color: var(--ball); }
    .ladder span.now { color: var(--ink); border-color: var(--ball); }
    .portrait.mini { width: 46px; border-radius: 6px; }
    .route { display: flex; align-items: stretch; gap: 0; margin-top: 14px; overflow-x: auto; padding-bottom: 4px; }
    .route-link { flex: 0 0 18px; align-self: center; height: 3px; background: rgba(150, 190, 225, 0.3); }
    .stop { flex: 1 0 120px; background: rgba(17, 38, 58, 0.92); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
    .stop.now { border-color: var(--ball); box-shadow: inset 0 0 0 1px var(--ball); }
    .stop.done { opacity: 0.75; }
    .stop.locked { opacity: 0.55; }
    .stop-n { font-size: 12px; font-weight: 600; color: var(--ball); }
    .stop.locked .stop-n { color: var(--ink-dim); }
    .stop-faces { display: flex; gap: 4px; }
    .stop-team { font-family: var(--cond); font-weight: 700; font-size: 16px; line-height: 1.1; }
    .stop-meta { font-size: 12px; color: var(--ink-dim); }
    .mapchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink); }
    .mapchip i { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
    .maps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    .mapcard { background: rgba(17, 38, 58, 0.92); border: 1px solid var(--line); border-radius: 10px; color: inherit; font: inherit; text-align: left; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
    .mapcard i { display: block; height: 34px; border-radius: 6px; }
    .mapcard b { font-family: var(--cond); font-size: 16px; }
    .mapcard span { font-size: 12px; color: var(--ink-dim); line-height: 1.3; }
    .mapcard .tag { color: var(--ball); font-weight: 600; }
    .mapcard em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--ball); }
    .mapcard.sel { border-color: var(--ball); box-shadow: inset 0 0 0 1px var(--ball); }
    .item.act { border-color: rgba(160, 120, 255, 0.35); }
    .item.act .team { color: #b79cff; }
    .item.act.mine { box-shadow: inset 0 0 0 1px #b79cff; }
    .actchip, .okchip { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: rgba(160, 120, 255, 0.2); color: #d7c8ff; }
    .okchip { background: rgba(228, 255, 58, 0.18); color: var(--ball); }
    .money.sm { font-size: 18px; }
    .row.sticky { position: sticky; bottom: -20px; margin: 14px -20px -20px; padding: 12px 20px; background: rgba(9, 20, 33, 0.96); border-top: 1px solid var(--line); }
    @media (max-width: 1000px) {
      .maps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .shop { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .sb-row { grid-template-columns: 4px 12px 70px 26px 34px; height: 26px; }
      .sb-team, .sb-games { font-size: 15px; }
      .sb-pts { font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <div id="canvas-wrapper">
    <canvas id="game" width="1280" height="720"></canvas>

    <div class="scorebug" id="scorebug">
      <div class="sb-row sb-blue" id="sb-blue">
        <span class="sb-strip"></span>
        <span class="sb-serve"></span>
        <span class="sb-team" id="name-blue">Azul</span>
        <span class="sb-games" id="games-blue">0</span>
        <span class="sb-pts" id="score-blue">0</span>
      </div>
      <div class="sb-row sb-red" id="sb-red">
        <span class="sb-strip"></span>
        <span class="sb-serve"></span>
        <span class="sb-team" id="name-red">Rojo</span>
        <span class="sb-games" id="games-red">0</span>
        <span class="sb-pts" id="score-red">0</span>
      </div>
      <div class="sb-meta">
        <span class="sb-sub" id="sb-sub"></span>
        <span class="sb-sub" id="sb-cond"></span>
        <span class="sb-tag" id="sb-tag">Punto de oro</span>
      </div>
    </div>

    <div class="room-pill" id="status-text">Sin conexión</div>
    <div class="overlay" id="overlay"></div>
  </div>

  <section class="dock">
    <div class="brand"><span class="brand-ball"></span>Padel Club 2v2</div>
    <div class="group">
      <button id="menu-btn" onclick="openMenu()">Menú</button>
      <button id="music-btn" class="on" onclick="toggleMusic()">Música: sí</button>
    </div>
  </section>

  <footer class="keys">
    <div><span class="key">W A S D</span>Moverse</div>
    <div><span class="key">Espacio</span>Sprint, o tu activa si compraste una</div>
    <div><span class="key">Mouse</span>Apuntar en la cancha</div>
    <div><span class="key">Clic izq.</span>Cargar hasta 2 s y soltar: saque, drive o remate</div>
    <div><span class="key">Clic der.</span>Globo</div>
  </footer>

<script>
'use strict';
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvas-wrapper');

// Espacio lógico de dibujo (la física sigue en las mismas coordenadas de siempre)
const VIEW_W = 1280;
const VIEW_H = 720;

const COURT = {
  x: 60, y: 40,
  w: 800, h: 440,
  netX: 460,
  midY: 260,
  serviceLeft: 210,
  serviceRight: 710,
  glassLength: 150 // Los primeros 150px desde el fondo son cristal; el resto hasta la red es malla metálica
};

const POINTS_LABELS = ['0', '15', '30', '40', 'ORO'];
const GRAVITY = 0.16;
const MAX_CHARGE_FRAMES = 120;      // 2 segundos de carga de pala
const SPRINT_DURATION = 95;         // ~1.6 segundos de sprint activo
const SPRINT_COOLDOWN = 1200;       // Exactamente 20 segundos a 60 FPS

// ---- Escala real: 40 px de mundo = 1 m. La altura física (z) se dibuja con ZS ----
const ZS = 1.2;                 // 1 unidad de z = 1,2 px de mundo (3 cm)
const NET_H = 29;               // Red: 29 unidades = 0,88 m (antes 11 = 33 cm, la pelota la cruzaba a ras de suelo)
const NET_CLEARANCE = 3;        // Margen que intenta dejar el jugador sobre la red
const MIN_SPEED_FACTOR = 0.6;   // Cuánto puede "levantar" (frenar) un golpe para pasar la red
const SMASH_MIN_Z = 44;         // Remate solo con bola sobre ~1,3 m (antes 28 = 84 cm, altura de cintura)
const BALL_R = 4.6;             // Radio visual (exagerado para que se lea bien)
const WALL_H_TALL = 160;        // Fondo y primer tramo lateral: 4 m (3 m cristal + 1 m malla)
const WALL_H_LOW = 120;         // Resto del lateral: 3 m
const GLASS_H = 120;
const GLASS_STEP_H = 80;
const OVER_WALL_RULE = true;   // Pelota que bota y sale por encima de la pared = punto para quien pegó (por 3 / por 4)

// Cancha 15% más grande respecto a los jugadores: personajes, pala y alcance se achican en esa
// proporción (la cámara sigue mostrando la cancha completa) y además corren un 5% más.
const COURT_SCALE = 1.15;
const ENTITY_K = 1 / COURT_SCALE;
const SPEED_BOOST = 1.05;
const PAD_F = 17 * ENTITY_K;          // dónde está la pala respecto al cuerpo
const PAD_S = 6 * ENTITY_K;
const BODY_MARGIN = 18 * ENTITY_K;    // distancia mínima del cuerpo a las paredes
const NET_MARGIN = 28 * ENTITY_K;
const BASE_ROLL = 0.95;               // velocidad horizontal que conserva la pelota al botar (antes 0,90): llega más al fondo
const ACTIVE_DURATION = 300;          // 5 s
const ACTIVE_COOLDOWN = 2700;         // 45 s
let WALL_PLAY = 0.25;                 // chance de que un bot deje pasar la pelota y la juegue de pared

function sideWallHeight(x) {
  return (x < COURT.x + COURT.glassLength / 2 || x > COURT.x + COURT.w - COURT.glassLength / 2)
    ? WALL_H_TALL : WALL_H_LOW;
}

// ================= PERSONAJES, JEFES Y MEJORAS =================
// "speed" es el reparto velocidad/fuerza de siempre (0,15 = pegador, 0,85 = veloz).
// body: w = ancho, h = altura, belly = guata, arm/leg = grosor de brazos y piernas.
const CHARACTERS = ['german', 'maxi', 'joaquin', 'alvaro', 'fernando', 'matias'];
const LOOKS = {
  german: {
    name: 'Germán', role: 'Pegador', speed: 0.15,
    desc: 'Guatita de campeón y bigote de los 80. No corre: espera que la pelota llegue.',
    skin: '#e3b38f', hair: 'bald', hairColor: '#4a3426',
    body: { w: 1.32, h: 0.95, belly: 1.55, arm: 1.2, leg: 1.2 },
    shirt: '#f2f2ec', shirtHi: '#ffffff', shirtLo: '#a3a39a', shorts: '#1f2c4a', shoes: '#2a2a2a', band: '#e53935',
    extras: { mustache: '#4a3426', headband: '#e53935' },
    paddle: { face: '#c62828', rim: '#1b1b1b', shape: 'round' }
  },
  maxi: {
    name: 'Maxi', role: 'Veloz', speed: 0.85,
    desc: 'Mullet rubio, lentes de sol y cero frenos. Llega a todas, aunque le pega suavecito.',

// ================= SONIDO (Web Audio API) =================
let audioCtx = null;
let musicPlaying = false;
let musicInterval = null;
let beatStep = 0;
let noiseBuffer = null;

function ensureAudio() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (musicPlaying && !musicTimer) startMusic();
}

function getNoise() {
  if (!noiseBuffer) {
    const len = Math.floor(audioCtx.sampleRate * 0.5);
    noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuffer;
}

function noiseHit(t, dur, freq, q, gain, type = 'bandpass') {
  const src = audioCtx.createBufferSource();
  src.buffer = getNoise();
  const f = audioCtx.createBiquadFilter();
  f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start(t, Math.random() * 0.3);
  src.stop(t + dur + 0.02);
}

function toneHit(t, type, f0, f1, dur, gain) {
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.01);
}

function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  if (type === 'hit') {
    // "Pock" de pala de carbono: transitorio de ruido + cuerpo grave corto
    noiseHit(now, 0.045, 1900, 1.3, 0.55);
    toneHit(now, 'sine', 340, 120, 0.07, 0.32);
  } else if (type === 'smash') {
    noiseHit(now, 0.08, 1500, 0.9, 0.8);
    toneHit(now, 'triangle', 260, 65, 0.12, 0.45);
  } else if (type === 'lob') {
    noiseHit(now, 0.04, 2300, 1.5, 0.32);
    toneHit(now, 'sine', 290, 150, 0.06, 0.22);
  } else if (type === 'bounce') {
    toneHit(now, 'sine', 170, 55, 0.07, 0.26);
    noiseHit(now, 0.03, 700, 0.7, 0.14, 'lowpass');
  } else if (type === 'glass') {
    // Cristal templado: golpe sordo + brillo metálico de la estructura
    toneHit(now, 'sine', 150, 60, 0.09, 0.3);
    noiseHit(now, 0.11, 3400, 7, 0.32);
    toneHit(now, 'sine', 920, 640, 0.16, 0.05);
  } else if (type === 'sprint') {
    noiseHit(now, 0.18, 900, 0.6, 0.12);
    toneHit(now, 'sine', 240, 560, 0.18, 0.1);
  } else if (type === 'power') {
    toneHit(now, 'sawtooth', 220, 880, 0.25, 0.08);
    noiseHit(now, 0.3, 2400, 0.8, 0.12);
  } else if (type === 'bolt') {
    noiseHit(now, 0.5, 600, 0.5, 0.6, 'lowpass');
    toneHit(now, 'square', 90, 40, 0.4, 0.15);
  } else if (type === 'lightbreak') {
    noiseHit(now, 0.35, 5200, 3, 0.4);
    toneHit(now, 'triangle', 1400, 300, 0.25, 0.12);
  } else if (type === 'burn') {
    noiseHit(now, 0.35, 3000, 0.7, 0.18, 'highpass');
  } else if (type === 'flash') {
    noiseHit(now, 0.045, 1900, 1.3, 0.55);
    toneHit(now, 'sine', 340, 120, 0.07, 0.3);
    noiseHit(now + 0.02, 0.05, 6000, 2, 0.35, 'highpass');
  } else if (type === 'fault') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(170, now);
    osc.frequency.setValueAtTime(135, now + 0.12);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.34);
  }
}

function playJingle(win) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const notes = win ? [523.25, 659.25, 783.99, 1046.5] : [392, 329.63, 261.63, 196];
  notes.forEach((f, i) => toneHit(now + i * 0.13, 'triangle', f, f * 0.98, 0.22, 0.12));
}

// ---- Música: groove latino suave (La menor: Am - F - C - G), con secuenciador preciso ----
musicPlaying = true;   // por defecto suena; el botón la apaga
let musicBus = null, musicTimer = null, musicNextTime = 0, musicStep = 0;
const MUSIC_BPM = 104;
const NOTE = n => 440 * Math.pow(2, n / 12);           // n = semitonos desde La4
const CHORDS = [[-12, -9, -5], [-16, -12, -9], [-9, -5, -2], [-14, -10, -7]];   // Am, F, C, G
const BASS = [-36, -40, -33, -38];
const MELODY = [
  [7, null, null, 3, null, 5, 7, null, null, 0, null, null, 3, null, 5, null],
  [3, null, null, 0, null, 3, 8, null, null, 7, null, null, 3, null, 0, null],
  [-2, null, null, 3, null, 7, 10, null, null, 7, null, null, 5, null, 3, null],
  [2, null, null, 5, null, 10, 5, null, null, 2, null, null, 0, null, -2, null]
];
const MELODY_B = [
  [12, null, 10, null, 7, null, null, null, 7, null, 5, null, 3, null, null, null],
  [8, null, 7, null, 3, null, null, null, 0, null, 3, null, 5, null, null, null],
  [7, null, 10, null, 12, null, null, null, 10, null, 7, null, 3, null, null, null],
  [5, null, 7, null, 10, null, 7, null, 5, null, null, null, 2, null, null, null]
];

function musicVoice(t, type, freq, dur, gain, attack = 0.005) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(musicBus);
  o.start(t); o.stop(t + dur + 0.02);
}
function musicNoise(t, dur, freq, gain, type) {
  const s = audioCtx.createBufferSource();
  s.buffer = getNoise();
  const f = audioCtx.createBiquadFilter();
  f.type = type; f.frequency.value = freq;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(musicBus);
  s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.02);
}
function scheduleMusicStep(step, t) {
  const s16 = step % 16, bar = Math.floor(step / 16) % 8, chord = bar % 4;
  const beat = 60 / MUSIC_BPM / 4;
  // Batería
  if (s16 % 4 === 0) {                                       // bombo
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.55, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.22);
  }
  if (s16 === 4 || s16 === 12) musicNoise(t, 0.12, 1700, 0.16, 'bandpass');   // palmas
  if (s16 % 2 === 0) musicNoise(t, 0.03, 8000, s16 % 4 === 2 ? 0.07 : 0.03, 'highpass');   // hi-hat
  if ([3, 7, 11, 15].includes(s16)) musicNoise(t, 0.05, 5000, 0.035, 'highpass');           // shaker
  // Bajo con ritmo 3-3-2
  if ([0, 3, 6, 8, 11, 14].includes(s16)) {
    const n = BASS[chord] + (s16 === 6 || s16 === 14 ? 12 : 0);
    musicVoice(t, 'triangle', NOTE(n), beat * 2.2, 0.22);
  }
  // Acordes: colchón suave y golpecitos tipo marimba
  if (s16 === 0) CHORDS[chord].forEach(n => musicVoice(t, 'sine', NOTE(n), beat * 15, 0.035, 0.12));
  if ([2, 6, 10, 14].includes(s16)) CHORDS[chord].forEach(n => musicVoice(t, 'triangle', NOTE(n + 12), beat * 1.6, 0.03));
  // Melodía (A en los compases 1-4, B en los 5-8)
  const mel = (bar < 4 ? MELODY : MELODY_B)[chord][s16];
  if (mel != null) {
    musicVoice(t, 'sine', NOTE(mel), beat * 3, 0.075);
    musicVoice(t, 'sine', NOTE(mel + 12), beat * 1.2, 0.018);
  }
}
function musicScheduler() {
  if (!audioCtx || !musicPlaying) return;
  const beat = 60 / MUSIC_BPM / 4;
  while (musicNextTime < audioCtx.currentTime + 0.15) {
    scheduleMusicStep(musicStep, musicNextTime);
    musicNextTime += beat;
    musicStep++;
  }
}
function startMusic() {
  if (!audioCtx || musicTimer) return;
  if (!musicBus) {
    musicBus = audioCtx.createGain();
    musicBus.gain.value = 0.55;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 7000;
    musicBus.connect(lp); lp.connect(audioCtx.destination);
  }
  musicNextTime = audioCtx.currentTime + 0.08;
  musicTimer = setInterval(musicScheduler, 25);
}
function stopMusic() {
  clearInterval(musicTimer);
  musicTimer = null;
}
function updateMusicButton() {
  const btn = document.getElementById('music-btn');
  btn.innerText = musicPlaying ? 'Música: sí' : 'Música: no';
  btn.classList.toggle('on', musicPlaying);
}
function toggleMusic() {
  ensureAudio();
  musicPlaying = !musicPlaying;
  updateMusicButton();
  document.getElementById('music-btn').blur();
  if (musicPlaying) startMusic(); else stopMusic();
}

const mouseView = { x: VIEW_W * 0.72, y: VIEW_H * 0.45, inside: false, moved: false };

function updateAimFromMouse() {
  if (!cam.ready || !mouseView.moved) return;
  let mx = mouseView.x, my = mouseView.y;
  const v = fx.view;
  if (v && (v.rot || v.oy || v.k !== 1)) {
    const cx = VIEW_W / 2, cy = VIEW_H / 2 + v.oy;
    const dx = (mx - cx) / v.k, dy = (my - cy) / v.k;
    mx = cx + dx * Math.cos(-v.rot) - dy * Math.sin(-v.rot);
    my = cy - v.oy + dx * Math.sin(-v.rot) + dy * Math.cos(-v.rot);
  }
  const g = unprojectGround(mx, my);
  if (g) {
    localInput.aimX = g.x;
    localInput.aimY = g.y;
  }
}

  mouseView.inside = true;

function randomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for (let i = 0; i < 4; i++) out += chars[Math.floor(Math.random() * chars.length)];

}

function peerAvailable() {
  if (typeof Peer === 'undefined') {
    document.getElementById('status-text').innerText = 'No se pudo cargar PeerJS: revisa tu conexión';
    return false;
  }
  return true;
}

// Sin un servidor TURN, dos casas detrás de routers/NAT estrictos (o datos móviles) muchas
// veces no logran conectarse por WebRTC: el "unirse" se queda pegado para siempre.
// Si sigue fallando entre redes distintas, crea una cuenta gratis en un proveedor TURN
// (por ejemplo metered.ca) y reemplaza aquí urls, username y credential.
const PEER_OPTIONS = {
  debug: 1,
  config: {
    iceServers: [
      { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  }
};
const peerOptions = () => Object.assign({}, PEER_OPTIONS, window.PEER_OVERRIDE || {});

let netMsg = '';          // mensaje de conexión visible en el menú
let gotHostState = false; // el invitado ya recibió el estado del anfitrión

function setStatus(t) { document.getElementById('status-text').innerText = t; }
function setNetMsg(t) { netMsg = t; overlayKey = ''; }

function sendStateTo(conn) {
  if (conn && conn.open) {
    try { conn.send({ type: 'state', state }); } catch (e) { /* conexión cerrándose */ }
  }
}

function leaveNetwork() {
  clearTimeout(joinTimer);
  const old = peer;
  peer = null;
  hostConn = null;
  if (old) { try { old.destroy(); } catch (e) { /* nada */ } }
  gotHostState = false;
  hostConn = null;
  connections = {};
  isHost = true;
  mySlot = 0;
  state.roomCode = '';
  setStatus('Sin conexión');
}

function createRoom() {
  ensureAudio();
  if (!peerAvailable()) return;
  leaveNetwork();
  const code = randomCode();
  const peerId = 'padel2v2-pro-' + code;

  isHost = true;
  mySlot = 0;
  prepareRoster(menuSel.mode);
  state.screen = 'lobby';
  uiMenuOpen = false;
  const myPeer = new Peer(peerId, peerOptions());
  peer = myPeer;
  setStatus('Creando sala...');

  myPeer.on('open', () => {
    state.roomCode = code;
    setStatus('Sala ' + code);
  });

  myPeer.on('error', err => {
    if (peer !== myPeer) return;
    if (err && err.type === 'unavailable-id') { createRoom(); return; }   // código repetido: otro
    if (err && err.type === 'peer-unavailable') return;
    setStatus('Problema con el servidor de salas');
    if (!state.roomCode) { openMenu(); setNetMsg('No se pudo crear la sala. Revisa tu internet y vuelve a intentarlo.'); }
  });

  myPeer.on('disconnected', () => {
    // Se cayó el enlace con el servidor de salas: las partidas en curso siguen, pero nadie nuevo podría entrar
    if (peer === myPeer && !myPeer.destroyed) { try { myPeer.reconnect(); } catch (e) { /* nada */ } }
  });

  myPeer.on('connection', conn => {
    // En el torneo solo se puede entrar como compañero; en amistoso, a cualquier puesto libre
    const allowed = state.mode === 'run' ? [1] : [1, 2, 3];
    let slot = -1;
    for (const i of allowed) {
      if (state.players[i].isBot && !connections[i]) { slot = i; break; }
    }
    if (slot === -1) {
      conn.on('open', () => {
        conn.send({ type: 'full', mode: state.mode });
        setTimeout(() => conn.close(), 800);
      });
      return;
    }

    connections[slot] = conn;
    state.players[slot].isBot = false;

    conn.on('open', () => {
      conn.send({ type: 'welcome', slot });
      sendStateTo(conn);     // no depende de que el loop del anfitrión esté corriendo
      showBanner('Se unió un jugador', 120);
    });

    conn.on('data', data => {
      if (data.type === 'input') {
        remoteInputs[slot] = data.input;
        const cid = data.input && data.input.charId;
        if (cid && CHARACTERS.includes(cid) && state.players[slot].lookId !== cid) setLook(state.players[slot], cid);
      } else if (data.type === 'buy') {
        tryBuy(slot, data.id);
      } else if (data.type === 'vote') {
        setVote(slot, data.map);
      } else if (data.type === 'ready') {
        setReady(slot);
      }
    });

    conn.on('error', () => { /* se maneja en close */ });
    conn.on('close', () => {
      if (connections[slot] !== conn) return;
      const p = state.players[slot];
      p.isBot = true;
      p.skill = state.mode === 'run' ? Math.max(0.3, BOSSES[state.run.boss].skill - 0.05) : (p.team === 0 ? Math.max(TEAMMATE_SKILL, state.difficulty) : state.difficulty);
      delete connections[slot];
      showBanner('Un jugador salió; lo reemplaza un bot', 120);
    });
  });
}

function joinRoom() {
  ensureAudio();
  const input = document.getElementById('room-code-input');
  const code = (input ? input.value : menuSel.code).trim().toUpperCase();
  if (!code) { setNetMsg('Escribe el código de 4 letras que aparece en la pantalla del anfitrión.'); return; }
  if (typeof Peer === 'undefined') { setNetMsg('No se pudo cargar PeerJS. Revisa tu internet y recarga la página.'); return; }
  leaveNetwork();

  isHost = false;
  const myPeer = new Peer(peerOptions());
  peer = myPeer;
  let welcomed = false;
  setStatus('Conectando a ' + code + '...');
  setNetMsg('Conectando a la sala ' + code + '…');

  const fail = msg => {
    if (peer !== myPeer) return;
    leaveNetwork();
    uiMenuOpen = true;
    state.screen = 'menu';
    setNetMsg(msg);
  };

  joinTimer = setTimeout(() => {
    if (!welcomed) fail('No se pudo conectar con la sala ' + code + '. Si el código está bien, lo más probable es que sus redes no se dejen conectar directo (router o datos móviles): prueben otra red, o que otro de ustedes cree la sala.');
  }, 15000);

  myPeer.on('open', () => {
    const conn = myPeer.connect('padel2v2-pro-' + code, { reliable: true });
    hostConn = conn;
    conn.on('open', () => {
      setStatus('Conectado a ' + code);
      setNetMsg('Conectado, esperando al anfitrión…');
    });
    conn.on('data', data => {
      if (peer !== myPeer) return;
      if (data.type === 'welcome') {
        welcomed = true;
        clearTimeout(joinTimer);
        mySlot = data.slot;
        uiMenuOpen = false;
        setNetMsg('');
        setStatus('Sala ' + code);
      } else if (data.type === 'full') {
        welcomed = true;
        fail(data.mode === 'run'
          ? 'La sala está llena: el torneo de jefes es para 2 jugadores. Para jugar 3 o 4, el anfitrión debe crear un partido amistoso.'
          : 'La sala está llena (4 jugadores).');
      } else if (data.type === 'state') {
        gotHostState = true;
        Object.assign(state, data.state);
        recordFrame();
        if (state.soundTrigger.seq !== lastPlayedSoundSeq) {
          lastPlayedSoundSeq = state.soundTrigger.seq;
          playSound(state.soundTrigger.type);
          onGameEvent(state.soundTrigger.type);
        }
      }
    });
    conn.on('error', () => { /* se maneja en close o en el tiempo límite */ });
    conn.on('close', () => {
      if (peer !== myPeer) return;
      if (!welcomed) return;   // lo maneja 'full' o el tiempo límite
      fail('El anfitrión cerró la sala.');
      setStatus('Se cerró la sala');
    });
  });

  myPeer.on('error', err => {
    const t = err && err.type;
    console.warn('PeerJS:', t, err && err.message);
    if (t === 'peer-unavailable') fail('No existe una sala con el código ' + code + '. Revisa el código y que el anfitrión siga en la pantalla de la sala.');
    else if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') fail('No se pudo llegar al servidor de salas. Revisa tu internet y vuelve a intentarlo.');
    else if (t === 'browser-incompatible') fail('Este navegador no permite jugar online. Prueben con Chrome, Edge o Firefox actualizados.');
    else if (!welcomed) fail('Error al conectar (' + (t || 'desconocido') + ').');
  });
}
