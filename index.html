<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Padel Club 2v2 Online – Pro Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --night: #0a1724;
      --night-2: #0f2131;
      --panel: #11263a;
      --line: rgba(150, 190, 225, 0.16);
      --ink: #e8f0f7;
      --ink-dim: #8fa6bb;
      --ball: #e4ff3a;
      --blue: #45a8ff;
      --red: #ff5c50;
      --cond: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
      --body: 'Saira', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 80% at 50% 0%, #12304a 0%, var(--night) 60%);
      color: var(--ink);
      font-family: var(--body);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      gap: 10px;
      user-select: none;
      min-height: 100vh;
    }

    /* ---------- Escenario ---------- */
    #canvas-wrapper {
      position: relative;
      width: min(100%, calc((100vh - 150px) * 16 / 9));
      min-width: 320px;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background: #071019;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(150, 190, 225, 0.12);
    }
    canvas#game { display: block; width: 100%; height: 100%; cursor: none; }

    /* Marcador estilo transmisión */
    .scorebug {
      position: absolute;
      top: 14px;
      left: 14px;
      display: grid;
      grid-template-columns: auto;
      gap: 2px;
      font-family: var(--cond);
      pointer-events: none;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
    }
    .scorebug.flip { left: auto; right: 14px; }
    .sb-row {
      display: grid;
      grid-template-columns: 5px 14px 92px 30px 40px;
      align-items: stretch;
      height: 30px;
      background: rgba(8, 19, 31, 0.9);
    }
    .sb-row:first-child { border-radius: 6px 6px 0 0; overflow: hidden; }
    .sb-row:nth-child(2) { border-radius: 0 0 6px 6px; overflow: hidden; }
    .sb-strip { background: var(--blue); }
    .sb-red .sb-strip { background: var(--red); }
    .sb-serve { display: grid; place-items: center; }
    .sb-serve::after {
      content: '';
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--ball);
      box-shadow: 0 0 6px rgba(228, 255, 58, 0.8);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .sb-row.serving .sb-serve::after { opacity: 1; }
    .sb-team { align-self: center; font-weight: 600; font-size: 17px; letter-spacing: 0.02em; padding-left: 2px; }
    .sb-games {
      display: grid; place-items: center;
      font-weight: 600; font-size: 17px;
      color: var(--ink-dim);
      background: rgba(255, 255, 255, 0.05);
    }
    .sb-pts {
      display: grid; place-items: center;
      font-weight: 700; font-size: 19px;
      background: #eef3f8; color: #0b1a29;
      font-variant-numeric: tabular-nums;
    }
    .sb-tag {
      margin-top: 4px;
      justify-self: start;
      font-weight: 600; font-size: 13px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--ball); color: #18210a;
      display: none;
    }
    .sb-tag.show { display: block; }

    .room-pill {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(8, 19, 31, 0.82);
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      pointer-events: none;
    }
    .room-pill.flip { right: auto; left: 14px; }

    /* ---------- Panel de sala ---------- */
    .dock {
      width: min(100%, calc((100vh - 150px) * 16 / 9));
      min-width: 320px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
    }
    .brand {
      font-family: var(--cond);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.01em;
      display: flex; align-items: center; gap: 8px;
    }
    .brand-ball {
      width: 14px; height: 14px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fbffd0 0%, var(--ball) 40%, #8fa61e 100%);
    }
    .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input, select {
      font-family: var(--body);
      background: var(--night);
      border: 1px solid rgba(150, 190, 225, 0.25);
      color: var(--ink);
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 14px;
      outline: none;
    }
    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 2px solid var(--ball);
      outline-offset: 2px;
    }
    select { cursor: pointer; }
    button {
      font-family: var(--body);
      font-weight: 600;
      font-size: 14px;
      padding: 7px 14px;
      border-radius: 7px;
      border: 1px solid rgba(150, 190, 225, 0.28);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: rgba(150, 190, 225, 0.1); }
    button.primary { background: var(--ball); color: #16200a; border-color: var(--ball); }
    button.primary:hover { background: #eeff7a; }
    button.on { border-color: var(--ball); color: var(--ball); }
    .sep { width: 1px; height: 26px; background: var(--line); }

    .keys {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 18px;
      font-size: 13px;
      color: var(--ink-dim);
    }
    .key {
      display: inline-block;
      font-family: var(--cond);
      font-weight: 600;
      font-size: 13px;
      color: var(--ink);
      background: rgba(150, 190, 225, 0.1);
      border: 1px solid rgba(150, 190, 225, 0.22);
      border-bottom-width: 2px;
      padding: 0 7px;
      border-radius: 5px;
      margin-right: 4px;
    }
    @media (max-width: 720px) {
      .sb-row { grid-template-columns: 4px 12px 70px 26px 34px; height: 26px; }
      .sb-team, .sb-games { font-size: 15px; }
      .sb-pts { font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <div id="canvas-wrapper">
    <canvas id="game" width="1280" height="720"></canvas>

    <div class="scorebug" id="scorebug">
      <div class="sb-row sb-blue" id="sb-blue">
        <span class="sb-strip"></span>
        <span class="sb-serve"></span>
        <span class="sb-team">Azul</span>
        <span class="sb-games" id="games-blue">0</span>
        <span class="sb-pts" id="score-blue">0</span>
      </div>
      <div class="sb-row sb-red" id="sb-red">
        <span class="sb-strip"></span>
        <span class="sb-serve"></span>
        <span class="sb-team">Rojo</span>
        <span class="sb-games" id="games-red">0</span>
        <span class="sb-pts" id="score-red">0</span>
      </div>
      <div class="sb-tag" id="sb-tag">Punto de oro</div>
    </div>

    <div class="room-pill" id="status-text">Modo local contra bots</div>
  </div>

  <section class="dock">
    <div class="brand"><span class="brand-ball"></span>Padel Club 2v2</div>
    <div class="group">
      <input type="text" id="player-name" placeholder="Tu nombre" maxlength="10" value="Jugador 1" style="width: 116px;" aria-label="Tu nombre">
      <select id="stat-preset" title="Más velocidad reduce tu fuerza y viceversa" aria-label="Estilo de juego">
        <option value="0.85">Veloz (85% vel. / 15% fza.)</option>
        <option value="0.68">Ágil (68% vel. / 32% fza.)</option>
        <option value="0.50" selected>Equilibrado (50% / 50%)</option>
        <option value="0.32">Potente (32% vel. / 68% fza.)</option>
        <option value="0.15">Pegador (15% vel. / 85% fza.)</option>
      </select>
      <span class="sep"></span>
      <button class="primary" onclick="createRoom()">Crear sala</button>
      <input type="text" id="room-code-input" placeholder="Código" maxlength="6" style="width: 84px; text-transform: uppercase;" aria-label="Código de sala">
      <button onclick="joinRoom()">Unirse</button>
    </div>
    <div class="group">
      <button id="music-btn" onclick="toggleMusic()">Música: no</button>
      <button onclick="resetMatch()">Reiniciar partido</button>
    </div>
  </section>

  <footer class="keys">
    <div><span class="key">W A S D</span>Moverse</div>
    <div><span class="key">Espacio</span>Sprint (recarga 20 s)</div>
    <div><span class="key">Mouse</span>Apuntar en la cancha</div>
    <div><span class="key">Clic izq.</span>Cargar hasta 2 s y soltar: saque, drive o remate</div>
    <div><span class="key">Clic der.</span>Globo</div>
  </footer>

<script>
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvas-wrapper');

// Espacio lógico de dibujo (la física sigue en las mismas coordenadas de siempre)
const VIEW_W = 1280;
const VIEW_H = 720;

const COURT = {
  x: 60, y: 40,
  w: 800, h: 440,
  netX: 460,
  midY: 260,
  serviceLeft: 210,
  serviceRight: 710,
  glassLength: 150 // Los primeros 150px desde el fondo son cristal; el resto hasta la red es malla metálica
};

const POINTS_LABELS = ['0', '15', '30', '40', 'ORO'];
const GRAVITY = 0.16;
const MAX_CHARGE_FRAMES = 120;      // 2 segundos de carga de pala
const SPRINT_DURATION = 95;         // ~1.6 segundos de sprint activo
const SPRINT_COOLDOWN = 1200;       // Exactamente 20 segundos a 60 FPS

// ---- Escala real: 40 px de mundo = 1 m. La altura física (z) se dibuja con ZS ----
const ZS = 1.2;                 // 1 unidad de z = 1,2 px de mundo (3 cm)
const NET_H = 29;               // Red: 29 unidades = 0,88 m (antes 11 = 33 cm, la pelota la cruzaba a ras de suelo)
const NET_CLEARANCE = 3;        // Margen que intenta dejar el jugador sobre la red
const MIN_SPEED_FACTOR = 0.6;   // Cuánto puede "levantar" (frenar) un golpe para pasar la red
const SMASH_MIN_Z = 44;         // Remate solo con bola sobre ~1,3 m (antes 28 = 84 cm, altura de cintura)
const BALL_R = 4.6;             // Radio visual (exagerado para que se lea bien)
const WALL_H_TALL = 160;        // Fondo y primer tramo lateral: 4 m (3 m cristal + 1 m malla)
const WALL_H_LOW = 120;         // Resto del lateral: 3 m
const GLASS_H = 120;
const GLASS_STEP_H = 80;
const OVER_WALL_RULE = true;   // Pelota que bota y sale por encima de la pared = punto para quien pegó (por 3 / por 4)

function sideWallHeight(x) {
  return (x < COURT.x + COURT.glassLength / 2 || x > COURT.x + COURT.w - COURT.glassLength / 2)
    ? WALL_H_TALL : WALL_H_LOW;
}

// ================= SONIDO (Web Audio API) =================
let audioCtx = null;
let musicPlaying = false;
let musicInterval = null;
let beatStep = 0;
let noiseBuffer = null;

function ensureAudio() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function getNoise() {
  if (!noiseBuffer) {
    const len = Math.floor(audioCtx.sampleRate * 0.5);
    noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuffer;
}

function noiseHit(t, dur, freq, q, gain, type = 'bandpass') {
  const src = audioCtx.createBufferSource();
  src.buffer = getNoise();
  const f = audioCtx.createBiquadFilter();
  f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start(t, Math.random() * 0.3);
  src.stop(t + dur + 0.02);
}

function toneHit(t, type, f0, f1, dur, gain) {
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.01);
}

function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  if (type === 'hit') {
    // "Pock" de pala de carbono: transitorio de ruido + cuerpo grave corto
    noiseHit(now, 0.045, 1900, 1.3, 0.55);
    toneHit(now, 'sine', 340, 120, 0.07, 0.32);
  } else if (type === 'smash') {
    noiseHit(now, 0.08, 1500, 0.9, 0.8);
    toneHit(now, 'triangle', 260, 65, 0.12, 0.45);
  } else if (type === 'lob') {
    noiseHit(now, 0.04, 2300, 1.5, 0.32);
    toneHit(now, 'sine', 290, 150, 0.06, 0.22);
  } else if (type === 'bounce') {
    toneHit(now, 'sine', 170, 55, 0.07, 0.26);
    noiseHit(now, 0.03, 700, 0.7, 0.14, 'lowpass');
  } else if (type === 'glass') {
    // Cristal templado: golpe sordo + brillo metálico de la estructura
    toneHit(now, 'sine', 150, 60, 0.09, 0.3);
    noiseHit(now, 0.11, 3400, 7, 0.32);
    toneHit(now, 'sine', 920, 640, 0.16, 0.05);
  } else if (type === 'sprint') {
    noiseHit(now, 0.18, 900, 0.6, 0.12);
    toneHit(now, 'sine', 240, 560, 0.18, 0.1);
  } else if (type === 'fault') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(170, now);
    osc.frequency.setValueAtTime(135, now + 0.12);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.34);
  }
}

function toggleMusic() {
  ensureAudio();
  musicPlaying = !musicPlaying;
  const btn = document.getElementById('music-btn');
  btn.innerText = musicPlaying ? 'Música: sí' : 'Música: no';
  btn.classList.toggle('on', musicPlaying);
  btn.blur();

  if (musicPlaying) {
    const bassNotes = [110, 110, 130.81, 146.83, 110, 110, 164.81, 146.83];
    const chordNotes = [220, 261.63, 329.63, 293.66, 220, 261.63, 392.00, 329.63];
    musicInterval = setInterval(() => {
      if (!audioCtx || !musicPlaying) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(bassNotes[beatStep % bassNotes.length], now);
      gain.gain.setValueAtTime(0.07, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.19);

      if (beatStep % 2 === 0) {
        const lead = audioCtx.createOscillator();
        const lGain = audioCtx.createGain();
        lead.type = 'sine';
        lead.frequency.setValueAtTime(chordNotes[(beatStep / 2) % chordNotes.length], now);
        lGain.gain.setValueAtTime(0.04, now);
        lGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        lead.connect(lGain); lGain.connect(audioCtx.destination);
        lead.start(now); lead.stop(now + 0.15);
      }
      beatStep++;
    }, 220);
  } else {
    clearInterval(musicInterval);
  }
}

// ================= RED P2P Y CONTROLES =================
let peer = null;
let isHost = true;
let mySlot = 0;
let connections = {};
let hostConn = null;

const localInput = {
  up: false, down: false, left: false, right: false,
  sprint: false,
  speedPref: 0.50,
  charging: false,
  lobMode: false,
  aimX: 600,          // Coordenadas de MUNDO (suelo de la cancha), igual que antes
  aimY: 260,
  releaseSeq: 0,
  lastChargeRatio: 0,
  lastReleaseLob: false
};

let localChargeFrames = 0;

document.getElementById('stat-preset').addEventListener('change', e => {
  localInput.speedPref = parseFloat(e.target.value);
  e.target.blur();
});

window.addEventListener('keydown', e => {
  if (document.activeElement.tagName === 'INPUT') return;
  ensureAudio();
  const k = e.key.toLowerCase();
  if (k === 'w' || e.key === 'ArrowUp') { localInput.up = true; e.preventDefault(); }
  if (k === 's' || e.key === 'ArrowDown') { localInput.down = true; e.preventDefault(); }
  if (k === 'a' || e.key === 'ArrowLeft') { localInput.left = true; e.preventDefault(); }
  if (k === 'd' || e.key === 'ArrowRight') { localInput.right = true; e.preventDefault(); }
  if (e.code === 'Space') { localInput.sprint = true; e.preventDefault(); }
});

window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || e.key === 'ArrowUp') localInput.up = false;
  if (k === 's' || e.key === 'ArrowDown') localInput.down = false;
  if (k === 'a' || e.key === 'ArrowLeft') localInput.left = false;
  if (k === 'd' || e.key === 'ArrowRight') localInput.right = false;
  if (e.code === 'Space') localInput.sprint = false;
});

// El mouse se proyecta desde la pantalla al suelo 3D (rayo cámara → plano z=0)
const mouseView = { x: VIEW_W * 0.72, y: VIEW_H * 0.45, inside: false, moved: false };

function updateAimFromMouse() {
  if (!cam.ready || !mouseView.moved) return;
  const g = unprojectGround(mouseView.x, mouseView.y);
  if (g) {
    localInput.aimX = g.x;
    localInput.aimY = g.y;
  }
}

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseView.x = (e.clientX - rect.left) * VIEW_W / rect.width;
  mouseView.y = (e.clientY - rect.top) * VIEW_H / rect.height;
  mouseView.inside = true;
  mouseView.moved = true;
  updateAimFromMouse();
});
canvas.addEventListener('mouseleave', () => { mouseView.inside = false; });

canvas.addEventListener('mousedown', e => {
  ensureAudio();
  if (document.activeElement.tagName === 'INPUT') document.activeElement.blur();
  if (e.button === 0) {
    localInput.charging = true;
    localInput.lobMode = e.shiftKey;
  } else if (e.button === 2) {
    localInput.charging = true;
    localInput.lobMode = true;
  }
});

window.addEventListener('mouseup', e => {
  if (!localInput.charging) return;
  if (e.button === 0 || e.button === 2) {
    localInput.lastChargeRatio = Math.min(1, localChargeFrames / MAX_CHARGE_FRAMES);
    localInput.lastReleaseLob = localInput.lobMode;
    localInput.charging = false;
    localInput.releaseSeq++;
    localChargeFrames = 0;
  }
});

function createPlayer(x, y, team, name, isBot, speedPref = 0.5) {
  return {
    x, y, vx: 0, vy: 0, team, name, isBot,
    speedStat: speedPref,          // 0.15 a 0.85
    powerStat: 1 - speedPref,      // Inversamente proporcional a la velocidad
    sprintActiveTimer: 0,
    sprintCooldown: 0,             // 1200 frames = 20s
    charging: false,
    lobMode: false,
    chargeFrames: 0,
    swingTimer: 0,
    swingCharge: 0,
    swingLob: false,
    cooldown: 0,
    aimX: team === 0 ? 600 : 320,
    aimY: 260,
    lastReleaseSeq: 0
  };
}

const state = {
  phase: 'SERVE', // 'SERVE' | 'PLAY' | 'POINT_PAUSE'
  serverSlot: 0,
  serveTargetBox: { minX: 460, maxX: 710, minY: 260, maxY: 480 },
  serveBotTimer: 75,
  pauseTimer: 0,
  soundTrigger: { seq: 0, type: '' },
  players: [
    createPlayer(145, 150, 0, 'Jugador 1', false, 0.50),
    createPlayer(145, 370, 0, 'Compañero IA', true, 0.65),
    createPlayer(775, 150, 1, 'Rival Veloz', true, 0.75),
    createPlayer(775, 370, 1, 'Rival Pegador', true, 0.25)
  ],
  ball: {
    x: 175, y: 150, z: 18,
    vx: 0, vy: 0, vz: 0,
    lastHitTeam: 0,
    bouncesInOpponentSide: 0,
    hasBouncedInValidBox: false,
    isServeShot: true,
    shotType: 'SAQUE',
    trail: []
  },
  score: [0, 0],
  games: [0, 0],
  bannerText: 'Saca cruzado al cuadro iluminado',
  bannerTimer: 9999
};

let lastPlayedSoundSeq = 0;

function emitSound(type) {
  state.soundTrigger.seq++;
  state.soundTrigger.type = type;
  playSound(type);
  onGameEvent(type);
  lastPlayedSoundSeq = state.soundTrigger.seq;
}

const remoteInputs = [
  { ...localInput },
  { ...localInput },
  { ...localInput },
  { ...localInput }
];

// ================= CONEXIÓN P2P =================
function randomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for (let i = 0; i < 4; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

function peerAvailable() {
  if (typeof Peer === 'undefined') {
    document.getElementById('status-text').innerText = 'No se pudo cargar PeerJS: revisa tu conexión';
    return false;
  }
  return true;
}

function createRoom() {
  ensureAudio();
  if (!peerAvailable()) return;
  const code = randomCode();
  const peerId = 'padel2v2-pro-' + code;
  if (peer) peer.destroy();

  isHost = true;
  mySlot = 0;
  peer = new Peer(peerId);
  document.getElementById('status-text').innerText = 'Creando sala...';

  peer.on('open', () => {
    document.getElementById('status-text').innerText = 'Sala ' + code;
    showBanner('Sala creada\nComparte el código ' + code, 150);
  });

  peer.on('connection', conn => {
    let slot = -1;
    for (let i = 1; i < 4; i++) {
      if (state.players[i].isBot) { slot = i; break; }
    }
    if (slot === -1) { conn.close(); return; }

    connections[slot] = conn;
    state.players[slot].isBot = false;
    state.players[slot].name = 'Jugador ' + (slot + 1);

    conn.on('open', () => {
      conn.send({ type: 'welcome', slot });
      showBanner('Se unió el jugador ' + (slot + 1), 120);
    });

    conn.on('data', data => {
      if (data.type === 'input') {
        remoteInputs[slot] = data.input;
        if (data.name) state.players[slot].name = data.name.slice(0, 10);
      }
    });

    conn.on('close', () => {
      state.players[slot].isBot = true;
      state.players[slot].name = 'Bot ' + (slot + 1);
      delete connections[slot];
      showBanner('El jugador ' + (slot + 1) + ' salió', 120);
    });
  });
}

function joinRoom() {
  ensureAudio();
  const code = document.getElementById('room-code-input').value.trim().toUpperCase();
  if (!code) return alert('Ingresa el código de 4 letras.');
  if (!peerAvailable()) return;
  if (peer) peer.destroy();

  isHost = false;
  peer = new Peer();
  document.getElementById('status-text').innerText = 'Conectando a ' + code + '...';

  peer.on('open', () => {
    hostConn = peer.connect('padel2v2-pro-' + code);
    hostConn.on('open', () => {
      document.getElementById('status-text').innerText = 'Conectado a ' + code;
    });
    hostConn.on('data', data => {
      if (data.type === 'welcome') {
        mySlot = data.slot;
        document.getElementById('status-text').innerText = 'Sala ' + code + ', jugador ' + (mySlot + 1);
      } else if (data.type === 'state') {
        Object.assign(state, data.state);
        if (state.soundTrigger.seq !== lastPlayedSoundSeq) {
          lastPlayedSoundSeq = state.soundTrigger.seq;
          playSound(state.soundTrigger.type);
          onGameEvent(state.soundTrigger.type);
        }
        updateScoreUI();
      }
    });
    hostConn.on('close', () => {
      document.getElementById('status-text').innerText = 'Desconectado del anfitrión';
      isHost = true;
    });
  });
}

setInterval(() => {
  if (!isHost && hostConn && hostConn.open) {
    const myName = document.getElementById('player-name').value || ('J' + (mySlot + 1));
    hostConn.send({ type: 'input', input: localInput, name: myName });
  }
}, 20);

// ================= FÍSICA, SAQUE REGLAMENTARIO Y REBOTES =================
function showBanner(text, duration = 90) {
  state.bannerText = text;
  state.bannerTimer = duration;
}

// Calcula el cuadro cruzado obligatorio para el saque
function computeServeBox(server) {
  const serverInTopHalf = server.y < COURT.midY;
  return {
    minX: server.team === 0 ? COURT.netX : COURT.serviceLeft,
    maxX: server.team === 0 ? COURT.serviceRight : COURT.netX,
    minY: serverInTopHalf ? COURT.midY : COURT.y,
    maxY: serverInTopHalf ? (COURT.y + COURT.h) : COURT.midY
  };
}

function getClampedTarget(team, rawAimX, rawAimY, chargeRatio, powerStat, isLob, isServe) {
  const margin = 18;
  const minX = team === 0 ? COURT.netX + 35 : COURT.x + margin;
  const maxX = team === 0 ? COURT.x + COURT.w - margin : COURT.netX - 35;
  const minY = COURT.y + margin;
  const maxY = COURT.y + COURT.h - margin;

  let tx = Math.max(minX, Math.min(maxX, rawAimX));
  let ty = Math.max(minY, Math.min(maxY, rawAimY));

  // En juego normal (no en saque), más carga y más fuerza empujan la bola más profunda
  if (!isLob && !isServe) {
    const depthPull = (chargeRatio - 0.4) * (50 + powerStat * 45);
    tx += (team === 0 ? depthPull : -depthPull);
    tx = Math.max(minX, Math.min(maxX, tx));
  }
  return { tx, ty };
}

// Balística: misma fórmula de siempre (aterriza en el objetivo a la velocidad horizontal pedida)
// + ayuda de paso de red: si la parábola no supera la red, el jugador "levanta" la bola
// (baja la velocidad hasta un 60%). Si aun así no alcanza, la bola se va a la red.
function computeLaunch(fromX, fromY, fromZ, targetX, targetY, speedX, shotLabel, team) {
  const dirX = team === 0 ? 1 : -1;
  const distX = Math.max(85, Math.abs(targetX - fromX));
  let speed = speedX;
  let T = distX / speed;

  const dNet = (COURT.netX - fromX) * dirX;
  if (shotLabel !== 'GLOBO' && dNet > 0 && dNet < distX) {
    const f = dNet / distX;
    const need = NET_H + NET_CLEARANCE;
    const zAtNet = fromZ * (1 - f) + 0.5 * GRAVITY * T * T * f * (1 - f);
    if (zAtNet < need) {
      const tNeed = Math.sqrt(Math.max(0, 2 * (need - fromZ * (1 - f)) / (GRAVITY * f * (1 - f))));
      T = Math.min(tNeed, T / MIN_SPEED_FACTOR);
      speed = distX / T;
    }
  }

  let vz = (0.5 * GRAVITY * T * T - fromZ) / T;
  if (shotLabel === 'GLOBO' && vz < 5.6) vz = 5.9;
  return { vx: dirX * speed, vy: (targetY - fromY) / T, vz };
}

function launchBall(targetX, targetY, speedX, shotLabel, team, isServeShot) {
  const b = state.ball;
  const v = computeLaunch(b.x, b.y, b.z, targetX, targetY, speedX, shotLabel, team);
  b.vx = v.vx;
  b.vy = v.vy;
  b.vz = v.vz;

  b.lastHitTeam = team;
  b.bouncesInOpponentSide = 0;
  b.isServeShot = isServeShot;
  b.shotType = shotLabel;
}

function setupServe(nextServerSlot) {
  state.phase = 'SERVE';
  state.serverSlot = nextServerSlot;
  state.serveBotTimer = 75;

  const pos = [
    [145, 155], [145, 365],
    [775, 155], [775, 365]
  ];
  state.players.forEach((p, i) => {
    p.x = pos[i][0]; p.y = pos[i][1];
    p.charging = false; p.chargeFrames = 0;
    p.swingTimer = 0; p.cooldown = 0;
  });

  const server = state.players[state.serverSlot];
  state.serveTargetBox = computeServeBox(server);

  const dir = server.team === 0 ? 1 : -1;
  const b = state.ball;
  b.x = server.x + dir * 20;
  b.y = server.y + 6;
  b.z = 16;
  b.vx = 0; b.vy = 0; b.vz = 0;
  b.trail = [];
  b.isServeShot = true;
  b.bouncesInOpponentSide = 0;
  b.shotType = 'SAQUE';

  if (state.serverSlot === mySlot) {
    showBanner('Tu saque\nApunta al cuadro iluminado, carga y suelta el clic', 9999);
  } else {
    showBanner('Al saque: ' + server.name, 9999);
  }
}

function awardPoint(winningTeam, reason, isFault = false) {
  if (isFault) emitSound('fault');
  state.phase = 'POINT_PAUSE';
  state.pauseTimer = 95;
  state.score[winningTeam]++;

  const s0 = state.score[0];
  const s1 = state.score[1];

  if (state.score[winningTeam] >= 4) {
    state.games[winningTeam]++;
    state.score = [0, 0];
    showBanner(`Juego para el equipo ${winningTeam === 0 ? 'azul' : 'rojo'}\n${reason}`, 100);
  } else if (s0 === 3 && s1 === 3) {
    showBanner(`Punto de oro, 40 iguales\n${reason}`, 100);
  } else {
    showBanner(`${reason}\n${POINTS_LABELS[s0]} – ${POINTS_LABELS[s1]}`, 95);
  }
  updateScoreUI();
  state.serverSlot = (state.serverSlot + 1) % 4;
}

function resetMatch() {
  if (!isHost) return;
  state.score = [0, 0];
  state.games = [0, 0];
  updateScoreUI();
  setupServe(0);
}

function updateScoreUI() {
  document.getElementById('score-blue').innerText = POINTS_LABELS[state.score[0]] || '0';
  document.getElementById('score-red').innerText = POINTS_LABELS[state.score[1]] || '0';
  document.getElementById('games-blue').innerText = state.games[0];
  document.getElementById('games-red').innerText = state.games[1];
  document.getElementById('sb-tag').classList.toggle('show', state.score[0] === 3 && state.score[1] === 3);
}

function updateBotLogic(p, idx) {
  const b = state.ball;
  const inp = {
    up: false, down: false, left: false, right: false,
    sprint: false,
    speedPref: p.speedStat,
    charging: p.charging, lobMode: p.lobMode,
    aimX: p.aimX, aimY: p.aimY,
    releaseSeq: p.lastReleaseSeq,
    lastChargeRatio: 0.55, lastReleaseLob: false
  };

  if (state.phase === 'SERVE') {
    if (state.serverSlot === idx) {
      const box = state.serveTargetBox;
      if (state.serveBotTimer > 25) {
        inp.charging = true;
        inp.aimX = (box.minX + box.maxX) / 2;
        inp.aimY = (box.minY + box.maxY) / 2;
      } else if (state.serveBotTimer <= 25 && p.charging) {
        inp.charging = false;
        inp.releaseSeq = p.lastReleaseSeq + 1;
        inp.lastChargeRatio = 0.5;
      }
    }
    return inp;
  }

  const isTopPlayer = (idx % 2 === 0);
  const backX = p.team === 0 ? 175 : 745;
  const netXPos = p.team === 0 ? 315 : 605;
  const homeY = isTopPlayer ? 155 : 365;

  const ballOnMySide = (p.team === 0 && b.x < COURT.netX) || (p.team === 1 && b.x > COURT.netX);
  const ballApproaching = (p.team === 0 && b.vx < 0) || (p.team === 1 && b.vx > 0);
  const inMyHalfY = isTopPlayer ? (b.y < 285) : (b.y >= 235);

  let targetX = (ballOnMySide || ballApproaching) ? b.x : (b.shotType === 'GLOBO' ? backX : netXPos);
  let targetY = ((ballOnMySide || ballApproaching) && inMyHalfY) ? b.y : homeY;

  if (p.x < targetX - 8) inp.right = true;
  if (p.x > targetX + 8) inp.left = true;
  if (p.y < targetY - 8) inp.down = true;
  if (p.y > targetY + 8) inp.up = true;

  const dir = p.team === 0 ? 1 : -1;
  const paddleX = p.x + dir * 17;
  const paddleY = p.y + 6;
  const distToPaddle = Math.hypot(b.x - paddleX, b.y - paddleY);

  if (ballOnMySide && inMyHalfY && distToPaddle > 135 && p.sprintCooldown === 0) {
    inp.sprint = true;
  }

  if (state.phase === 'PLAY' && b.lastHitTeam !== p.team && ballOnMySide && distToPaddle < 130) {
    if (!p.charging && p.cooldown === 0) {
      inp.charging = true;
      inp.lobMode = (Math.random() < 0.22 && Math.abs(p.x - COURT.netX) > 220);
      inp.aimX = p.team === 0 ? (580 + Math.random() * 190) : (150 + Math.random() * 190);
      inp.aimY = 85 + Math.random() * 350;
    }
    if (p.charging && distToPaddle < 34 && b.z <= 75) {
      inp.charging = false;
      inp.releaseSeq = p.lastReleaseSeq + 1;
      inp.lastChargeRatio = Math.min(1, p.chargeFrames / MAX_CHARGE_FRAMES);
      inp.lastReleaseLob = p.lobMode;
    }
  } else if (p.charging && b.lastHitTeam === p.team) {
    inp.charging = false;
  }

  return inp;
}

function stepPhysics() {
  if (localInput.charging) {
    localChargeFrames = Math.min(MAX_CHARGE_FRAMES, localChargeFrames + 1);
  } else {
    localChargeFrames = 0;
  }

  if (!isHost) return;

  state.players[0].name = document.getElementById('player-name').value || 'Jugador 1';
  remoteInputs[0] = { ...localInput };

  if (state.bannerTimer > 0 && state.phase === 'PLAY') state.bannerTimer--;

  if (state.phase === 'POINT_PAUSE') {
    state.pauseTimer--;
    if (state.pauseTimer <= 0) setupServe(state.serverSlot);
    return;
  }

  const b = state.ball;

  state.players.forEach((p, idx) => {
    if (p.cooldown > 0) p.cooldown--;
    if (p.swingTimer > 0) p.swingTimer--;
    if (p.sprintActiveTimer > 0) p.sprintActiveTimer--;
    if (p.sprintCooldown > 0) p.sprintCooldown--;

    const inp = p.isBot ? updateBotLogic(p, idx) : remoteInputs[idx];

    if (typeof inp.speedPref === 'number') {
      p.speedStat = Math.max(0.15, Math.min(0.85, inp.speedPref));
      p.powerStat = 1 - p.speedStat;
    }

    if (inp.sprint && p.sprintCooldown === 0 && p.sprintActiveTimer === 0) {
      p.sprintActiveTimer = SPRINT_DURATION;
      p.sprintCooldown = SPRINT_COOLDOWN;
      emitSound('sprint');
    }

    p.aimX = inp.aimX;
    p.aimY = inp.aimY;

    if (inp.charging && p.cooldown === 0) {
      p.charging = true;
      p.lobMode = inp.lobMode;
      p.chargeFrames = Math.min(MAX_CHARGE_FRAMES, p.chargeFrames + 1);
    }

    if (inp.releaseSeq !== p.lastReleaseSeq) {
      p.lastReleaseSeq = inp.releaseSeq;
      if (p.cooldown === 0) {
        p.swingTimer = 11;
        p.swingCharge = Math.max(0.15, inp.lastChargeRatio || (p.chargeFrames / MAX_CHARGE_FRAMES));
        p.swingLob = inp.lastReleaseLob;
        p.cooldown = 28;
      }
      p.charging = false;
      p.chargeFrames = 0;
    } else if (!inp.charging) {
      p.charging = false;
      p.chargeFrames = 0;
    }

    const statBaseSpeed = 2.75 + (p.speedStat * 1.85);
    let moveSpeed = p.charging ? statBaseSpeed * 0.68 : statBaseSpeed;
    if (p.sprintActiveTimer > 0) moveSpeed *= 1.58;

    p.vx = (inp.right ? moveSpeed : 0) - (inp.left ? moveSpeed : 0);
    p.vy = (inp.down ? moveSpeed : 0) - (inp.up ? moveSpeed : 0);
    p.x += p.vx;
    p.y += p.vy;

    let minX = p.team === 0 ? COURT.x + 18 : COURT.netX + 28;
    let maxX = p.team === 0 ? COURT.netX - 28 : COURT.x + COURT.w - 18;
    if (state.phase === 'SERVE' && idx === state.serverSlot) {
      if (p.team === 0) maxX = COURT.serviceLeft - 10;
      else minX = COURT.serviceRight + 10;
    }

    p.x = Math.max(minX, Math.min(maxX, p.x));
    p.y = Math.max(COURT.y + 18, Math.min(COURT.y + COURT.h - 18, p.y));

    const dir = p.team === 0 ? 1 : -1;
    const paddleX = p.x + dir * 17;
    const paddleY = p.y + 6;

    // FASE DE SAQUE
    if (state.phase === 'SERVE' && idx === state.serverSlot) {
      state.serveTargetBox = computeServeBox(p);
      b.x = paddleX + dir * 6;
      b.y = paddleY;
      b.z = 16;
      if (p.isBot) state.serveBotTimer--;

      if (p.swingTimer > 0) {
        state.phase = 'PLAY';
        p.swingTimer = 0;
        const { tx, ty } = getClampedTarget(p.team, p.aimX, p.aimY, p.swingCharge, p.powerStat, false, true);
        const serveSpeed = 5.4 + (p.swingCharge * 2.2) + (p.powerStat * 1.4);
        launchBall(tx, ty, serveSpeed, 'SAQUE', p.team, true);
        emitSound('hit');
        showBanner('Saque en juego', 35);
      }
      return;
    }

    // FASE DE JUEGO: impacto con la pala
    if (state.phase === 'PLAY' && p.swingTimer > 0) {
      const ballStrictlyOnMySide = (p.team === 0 && b.x < COURT.netX - 6) || (p.team === 1 && b.x > COURT.netX + 6);
      if (b.lastHitTeam === p.team || !ballStrictlyOnMySide) return;

      const distToPaddle = Math.hypot(b.x - paddleX, b.y - paddleY);
      if (distToPaddle <= 35 && b.z <= 80) {
        p.swingTimer = 0;
        const { tx, ty } = getClampedTarget(p.team, p.aimX, p.aimY, p.swingCharge, p.powerStat, p.swingLob, false);
        const powerMultiplier = 0.78 + (p.powerStat * 0.52);
        const chargePct = Math.round(p.swingCharge * 100);

        if (p.swingLob) {
          const lobSpeed = 3.9 + p.swingCharge * 1.3;
          launchBall(tx, ty, lobSpeed, 'GLOBO', p.team, false);
          emitSound('lob');
          showBanner(`Globo ${chargePct}%`, 35);
        } else if (b.z > SMASH_MIN_Z && p.swingCharge >= 0.50 && Math.abs(p.x - COURT.netX) < 220) {
          const smashSpeed = (7.8 + p.swingCharge * 3.8) * powerMultiplier;
          launchBall(tx, ty, smashSpeed, '¡REMATE!', p.team, false);
          emitSound('smash');
          showBanner(`Remate ${chargePct}%`, 45);
        } else {
          const driveSpeed = (5.2 + p.swingCharge * 4.0) * powerMultiplier;
          launchBall(tx, ty, driveSpeed, 'DRIVE', p.team, false);
          emitSound('hit');
        }
      }
    }
  });

  if (state.phase !== 'PLAY') return;

  b.trail.push({ x: b.x, y: b.y, z: b.z });
  if (b.trail.length > 10) b.trail.shift();

  const prevX = b.x;
  b.x += b.vx;
  b.y += b.vy;
  b.z += b.vz;
  b.vz -= GRAVITY;

  // Cruce de red
  const crossedNet = (prevX <= COURT.netX && b.x > COURT.netX) || (prevX >= COURT.netX && b.x < COURT.netX);
  if (crossedNet) {
    if (b.z < NET_H) {
      if (b.bouncesInOpponentSide >= 1) {
        awardPoint(b.lastHitTeam, 'Remate ganador: volvió contra la red');
      } else {
        awardPoint(b.lastHitTeam === 0 ? 1 : 0, b.isServeShot ? 'Falta de saque: red' : 'Pelota en la red', true);
      }
      return;
    }
  }

  // Bote en el suelo
  if (b.z <= 0) {
    b.z = 0;
    const bounceRestitution = b.shotType === '¡REMATE!' ? 0.84 : 0.74;
    b.vz = Math.abs(b.vz) * bounceRestitution;
    b.vx *= 0.90;
    b.vy *= 0.90;
    emitSound('bounce');

    const currentSide = b.x < COURT.netX ? 0 : 1;

    // CASO 1: la pelota bota en el lado del mismo equipo que golpeó
    if (currentSide === b.lastHitTeam) {
      if (b.bouncesInOpponentSide >= 1) {
        awardPoint(b.lastHitTeam, 'Remate ganador: la pelota volvió a su campo');
      } else {
        awardPoint(currentSide === 0 ? 1 : 0, 'Falta: botó en su propio campo', true);
      }
      return;
    }

    // CASO 2: la pelota bota en el campo rival
    if (b.isServeShot && b.bouncesInOpponentSide === 0) {
      const box = state.serveTargetBox;
      const inBoxX = b.x >= box.minX - 4 && b.x <= box.maxX + 4;
      const inBoxY = b.y >= box.minY - 4 && b.y <= box.maxY + 4;
      if (!inBoxX || !inBoxY) {
        awardPoint(b.lastHitTeam === 0 ? 1 : 0, 'Falta de saque: fuera del cuadro', true);
        return;
      }
    }

    b.bouncesInOpponentSide++;

    if (b.bouncesInOpponentSide >= 2) {
      awardPoint(b.lastHitTeam, 'Doble bote');
      return;
    }
  }

  // Rebotes en cristales y malla metálica
  const hitLeft = b.x <= COURT.x + 10;
  const hitRight = b.x >= COURT.x + COURT.w - 10;
  const hitTop = b.y <= COURT.y + 10;
  const hitBottom = b.y >= COURT.y + COURT.h - 10;

  if (hitLeft || hitRight || hitTop || hitBottom) {
    // 1. Contra la pared rival sin haber dado su primer bote en el suelo: fuera
    if (b.bouncesInOpponentSide === 0) {
      const msg = b.isServeShot ? 'Falta de saque: directo a la pared' : 'Fuera: directo al cristal';
      awardPoint(b.lastHitTeam === 0 ? 1 : 0, msg, true);
      return;
    }

    // 2. Saque que bota en el cuadro y luego toca la malla metálica: falta
    const isSideMesh = (hitTop || hitBottom) &&
      (b.x > COURT.x + COURT.glassLength) &&
      (b.x < COURT.x + COURT.w - COURT.glassLength);

    if (b.isServeShot && isSideMesh) {
      awardPoint(b.lastHitTeam === 0 ? 1 : 0, 'Falta de saque: tocó la malla', true);
      return;
    }

    // 3. NUEVO: tras botar, sale por encima de la pared → punto para quien pegó (por 3 / por 4)
    let wallH = 0;
    if (hitLeft || hitRight) wallH = Math.max(wallH, WALL_H_TALL);
    if (hitTop || hitBottom) wallH = Math.max(wallH, sideWallHeight(b.x));
    if (OVER_WALL_RULE && b.z * ZS > wallH) {
      const overBack = (hitLeft || hitRight);
      awardPoint(b.lastHitTeam, overBack ? 'Por 4: salió por encima del fondo' : 'Por 3: salió por la pared lateral');
      return;
    }

    emitSound('glass');

    const wallRestitution = b.shotType === '¡REMATE!' ? 0.92 : 0.74;
    if (hitLeft) { b.x = COURT.x + 11; b.vx = Math.abs(b.vx) * wallRestitution; }
    if (hitRight) { b.x = COURT.x + COURT.w - 11; b.vx = -Math.abs(b.vx) * wallRestitution; }
    if (hitTop) { b.y = COURT.y + 11; b.vy = Math.abs(b.vy) * wallRestitution; }
    if (hitBottom) { b.y = COURT.y + COURT.h - 11; b.vy = -Math.abs(b.vy) * wallRestitution; }

    if (b.shotType === '¡REMATE!' && (hitLeft || hitRight)) {
      b.vz = Math.max(b.vz, 3.6);
    } else if (b.vz < 2.0) {
      b.vz = 2.4;
    }
    b.isServeShot = false;
  }
}

// ======================  RENDER 3D EN PERSPECTIVA  ====================
// =====================================================================
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
function angleDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
