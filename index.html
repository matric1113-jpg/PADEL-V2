<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Padel Club 2v2 Online – Pro Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div id="canvas-wrapper">
    <canvas id="game" width="1280" height="720"></canvas>

    <div class="scorebug" id="scorebug">
      <div class="sb-row sb-blue" id="sb-blue">
        <span class="sb-strip"></span>
        <span class="sb-serve"></span>
        <span class="sb-team" id="name-blue">Azul</span>
        <span class="sb-games" id="games-blue">0</span>
        <span class="sb-pts" id="score-blue">0</span>
      </div>
      <div class="sb-row sb-red" id="sb-red">
        <span class="sb-strip"></span>
        <span class="sb-serve"></span>
        <span class="sb-team" id="name-red">Rojo</span>
        <span class="sb-games" id="games-red">0</span>
        <span class="sb-pts" id="score-red">0</span>
      </div>
      <div class="sb-meta">
        <span class="sb-sub" id="sb-sub"></span>
        <span class="sb-sub" id="sb-cond"></span>
        <span class="sb-tag" id="sb-tag">Punto de oro</span>
      </div>
      <div class="sb-amer" id="sb-amer"></div>
    </div>

    <div class="room-pill" id="status-text">Sin conexión</div>
    <div class="overlay" id="overlay"></div>
  </div>

  <section class="dock">
    <div class="brand"><span class="brand-ball"></span>Padel Club 2v2</div>
    <div class="group">
      <button id="menu-btn">Menú</button>
      <label class="vol"><span>Música</span><input type="range" id="vol-music" min="0" max="100" step="1" aria-label="Volumen de la música"></label>
      <label class="vol"><span>Efectos y voces</span><input type="range" id="vol-sfx" min="0" max="100" step="1" aria-label="Volumen de los efectos y las voces"></label>
    </div>
  </section>

  <footer class="keys">
    <div><span class="key">W A S D</span>Moverse</div>
    <div><span class="key">Shift</span>Sprint, o tu activa si compraste una</div>
    <div><span class="key">Espacio</span>Mantén para cargar el salto y suelta para saltar</div>
    <div><span class="key">Mouse</span>Apuntar en la cancha</div>
    <div><span class="key">Clic izq.</span>Cargar hasta 2 s y soltar: saque, drive o remate</div>
    <div><span class="key">Clic der.</span>Globo</div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
