  if (state.screen !== 'play' || state.phase !== 'PLAY') return;
  replayBuf.push({
    ball: { ...state.ball, trail: state.ball.trail.map(t => ({ ...t })) },
    players: JSON.parse(JSON.stringify(state.players)),
    ice: state.ice ? { ...state.ice } : null
  });
  if (replayBuf.length > 100) replayBuf.shift();
}

// Detecta cambios del estado compartido (vale igual en anfitrión e invitados)
function detectStateEvents() {
  if (!fx.inited) {
    fx.inited = true;
    fx.replaySeq = state.replay.seq; fx.celebSeq = state.celebrate.seq; fx.talkSeq = state.talk.seq;
    fx.prevLights = [...state.lights];
    return;
  }
  if (state.replay.seq !== fx.replaySeq) {
    fx.replaySeq = state.replay.seq;
    if (replayBuf.length > 20) fx.replay = { frames: replayBuf.slice(-80), t: 0, reason: state.replay.reason || '' };
  }
  if (state.celebrate.seq !== fx.celebSeq) {
    fx.celebSeq = state.celebrate.seq;
    fx.celebQueue = { team: state.celebrate.team, t: 0 };
  }
  if (fx.celebQueue && !fx.replay) { fx.celeb = fx.celebQueue; fx.celebQueue = null; }
  if (state.talk.seq !== fx.talkSeq) {
    fx.talkSeq = state.talk.seq;
    fx.talk = { slot: state.talk.slot, text: state.talk.text, t: 0 };
  }
  state.lights.forEach((on, i) => {
    if (!on && fx.prevLights[i]) {
      const L = LIGHTS[i];
      for (let k = 0; k < 40; k++) {
        const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3;
        fx.sparks.push({ x: L.x, y: L.y, z: L.z, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: Math.random() * 3, t: 0, max: 30 + Math.random() * 30 });
      }
      fx.shake = Math.max(fx.shake, 4);
    }
  });
  fx.prevLights = [...state.lights];
  for (const pb of fx.prevBolts) {
    if (pb.t <= 4 && !state.bolts.some(bo => bo.slot === pb.slot)) {
      fx.strikes.push({ x: pb.x, y: pb.y, t: 0 });
      fx.flash = Math.max(fx.flash, 0.45);
      fx.shake = Math.max(fx.shake, 6);
    }
  }
  fx.prevBolts = state.bolts.map(bo => ({ ...bo }));
}

function spawnSand(x, y, n, power = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (0.4 + Math.random() * 1.2) * power;
    fx.particles.push({
      x, y, z: 1, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: (1.2 + Math.random() * 1.8) * power,
      life: 0, max: 26 + Math.random() * 18, size: 1 + Math.random() * 1.4
    });
  }
}

function onGameEvent(type) {
  const b = state.ball;
  if (type === 'flash') {
    fx.flash = 0.6;
    fx.impacts.push({ x: b.x, y: b.y, z: b.z * ZS + BALL_R, t: 0, big: true });
  } else if (type === 'power') {
    state.players.forEach(p => { if (p.activeT >= ACTIVE_DURATION - 2) fx.rings.push({ x: p.x, y: p.y, t: 0, power: true }); });
  } else if (type === 'bounce') {
    spawnSand(b.x, b.y, Math.round(9 * (mapOf().sand || 1)));
    fx.rings.push({ x: b.x, y: b.y, t: 0 });
  } else if (type === 'hit' || type === 'lob' || type === 'smash') {
    fx.impacts.push({ x: b.x, y: b.y, z: b.z * ZS + BALL_R, t: 0, big: type === 'smash' });
    if (type === 'smash') fx.shake = 7;
  } else if (type === 'glass') {
    const d = [
      ['L', b.x - COURT.x], ['R', COURT.x + COURT.w - b.x],
      ['F', b.y - COURT.y], ['N', COURT.y + COURT.h - b.y]
    ].sort((p, q) => p[1] - q[1])[0][0];
    const a = (d === 'L' || d === 'R') ? b.y : b.x;
    fx.ripples.push({ wall: d, a, z: b.z * ZS + BALL_R, t: 0 });
  } else if (type === 'fault') {
    if (Math.abs(b.x - COURT.netX) < 30) {
      fx.net = { amp: 7, y0: b.y, t: 0, dir: b.vx >= 0 ? 1 : -1 };
    }
  }
}

function updateFx(dt) {
  for (const p of fx.particles) {
    p.life += dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.vz -= 0.16 * dt;
    if (p.z < 0) { p.z = 0; p.vz *= -0.3; p.vx *= 0.6; p.vy *= 0.6; }
  }
  fx.particles = fx.particles.filter(p => p.life < p.max);
  for (const arr of [fx.rings, fx.ripples, fx.impacts]) for (const e of arr) e.t += dt;
  fx.rings = fx.rings.filter(e => e.t < 26);
  fx.ripples = fx.ripples.filter(e => e.t < 30);
  fx.impacts = fx.impacts.filter(e => e.t < 14);
  fx.shake = Math.max(0, fx.shake - 0.6 * dt);
  fx.flash = Math.max(0, fx.flash - 0.06 * dt);
  for (const s of fx.sparks) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt; s.vz -= 0.2 * dt; }
  fx.sparks = fx.sparks.filter(s => s.t < s.max && s.z > 0);
  for (const s of fx.strikes) s.t += dt;
  fx.strikes = fx.strikes.filter(s => s.t < 26);
  if (fx.talk && (fx.talk.t += dt) > 140) fx.talk = null;
  if (fx.celeb && (fx.celeb.t += dt) > 110) fx.celeb = null;
  if (fx.replay) {
    fx.replay.t += dt * 0.45;
    if (fx.replay.t >= fx.replay.frames.length - 1) fx.replay = null;
  }
  const M = mapOf();
  // Lluvia suave
  if (M.rain && state.screen === 'play') {
    while (fx.rain.length < 140) fx.rain.push({ x: -150 + Math.random() * 1250, y: -80 + Math.random() * 680, z: Math.random() * 420 });
    const wind = state.gust.t > 0 ? state.gust.w * 900 : 0;
    for (const d of fx.rain) {
      d.z -= 11 * dt; d.y += wind * 0.06 * dt;
      if (d.z < 0) { d.z = 380 + Math.random() * 60; d.x = -150 + Math.random() * 1250; d.y = -80 + Math.random() * 680; }
    }
  } else fx.rain.length = 0;
  // Rachas visibles de la ráfaga
  if (state.gust.t > 0 && Math.random() < 0.5 * dt) fx.streaks.push({ x: 60 + Math.random() * 800, y: state.gust.w > 0 ? 10 : 510, z: 30 + Math.random() * 200, t: 0 });
  for (const s of fx.streaks) { s.t += dt; s.y += Math.sign(state.gust.w || 1) * 9 * dt; }
  fx.streaks = fx.streaks.filter(s => s.t < 60);
  // Aves cruzando la cordillera
  if (state.map === 'chile' && fx.birds.length === 0 && Math.random() < 0.004 * dt) {
    const dirB = Math.random() < 0.5 ? 1 : -1, z0 = 520 + Math.random() * 300;
    for (let k = 0; k < 3 + Math.floor(Math.random() * 3); k++) fx.birds.push({ x: dirB > 0 ? -900 - k * 60 : 1900 + k * 60, z: z0 + (k % 2) * 30 - k * 10, v: dirB * (3.2 + Math.random() * 0.6), ph: Math.random() * 6 });
  }
  for (const bd of fx.birds) { bd.x += bd.v * dt; bd.ph += 0.25 * dt; }
  fx.birds = fx.birds.filter(bd => bd.x > -1000 && bd.x < 2000);
  // Chispas eléctricas de Zeus y llamas de quemaduras
  state.players.forEach(p => {
    if (p.out) return;
    if (p.lookId === 'zeus' && Math.random() < 0.5 * dt) fx.sparks.push({ x: p.x + (Math.random() - 0.5) * 30, y: p.y + (Math.random() - 0.5) * 20, z: 20 + Math.random() * 80, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, vz: Math.random(), t: 0, max: 12, elec: true });
    if ((p.burn > 0 || p.slow > 0) && Math.random() < 0.6 * dt) fx.sparks.push({ x: p.x + (Math.random() - 0.5) * 14, y: p.y + (Math.random() - 0.5) * 10, z: 2, vx: 0, vy: 0, vz: 1.4 + Math.random(), t: 0, max: 18, fire: true });
  });
  if (fx.net.amp > 0) { fx.net.t += dt; fx.net.amp *= Math.pow(0.93, dt); if (fx.net.amp < 0.05) fx.net.amp = 0; }
  const b = state.ball;
  fx.ballSpin += Math.hypot(b.vx, b.vy) * 0.12 * dt;
}

// ---------- Sombras de los 4 focos ----------
function lightWeights(x, y) {
  const ws = [];
  let sum = 0;
  for (const L of LIGHTS) {
    const dx = x - L.x, dy = y - L.y;
    const d2 = dx * dx + dy * dy + L.z * L.z;
    const w = L.z / (d2 * Math.sqrt(d2));
    ws.push(w); sum += w;
  }
  return ws.map(w => w / sum);
}

function drawPlayerShadows(p) {
  const ws = lightWeights(p.x, p.y);
  const sc = scaleOf(p) / PLAYER_SCALE;
  const H = 74 * scaleOf(p) * lookOf(p).body.h;
  LIGHTS.forEach((L, i) => {
    if (!state.lights[i]) return;
    const k = L.z / (L.z - H);
    const tx = L.x + (p.x - L.x) * k, ty = L.y + (p.y - L.y) * k;
    let dx = tx - p.x, dy = ty - p.y;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const nx = -dy, ny = dx;
    const w0 = 8 * sc, w1 = 5.5 * sc, wm = 9 * sc;
    const mx = p.x + dx * len * 0.45, my = p.y + dy * len * 0.45;
    const poly = [
      P(p.x + nx * w0, p.y + ny * w0, 0), P(mx + nx * wm, my + ny * wm, 0),
      P(tx + nx * w1, ty + ny * w1, 0), P(tx + dx * 4, ty + dy * 4, 0),
      P(tx - nx * w1, ty - ny * w1, 0), P(mx - nx * wm, my - ny * wm, 0),
      P(p.x - nx * w0, p.y - ny * w0, 0)
    ];
    pathPts(ctx, poly);
    const a0 = Math.min(0.26, 0.06 + ws[i] * 0.42);
    const g0 = P(p.x, p.y, 0), g1 = P(tx, ty, 0);
    const gr = ctx.createLinearGradient(g0.x, g0.y, g1.x, g1.y);
    gr.addColorStop(0, `rgba(2, 10, 26, ${a0})`);
    gr.addColorStop(1, `rgba(2, 10, 26, ${a0 * 0.25})`);
    ctx.fillStyle = gr;
    ctx.fill();
  });
  // Sombra de contacto
  pathPts(ctx, groundCircle(p.x, p.y, 12 * sc, 0, 22));
  ctx.fillStyle = 'rgba(2, 8, 20, 0.32)';
  ctx.fill();
  if (p.clone) {
    pathPts(ctx, groundCircle(p.clone.x, p.clone.y, 12 * sc, 0, 22));
    ctx.fillStyle = 'rgba(40, 10, 80, 0.35)';
    ctx.fill();
  }
}

function drawBallShadows(b) {
  const h = b.z * ZS + BALL_R;
  const ws = lightWeights(b.x, b.y);
  LIGHTS.forEach((L, i) => {
    if (!state.lights[i]) return;
    const k = L.z / Math.max(20, L.z - h);
    const sx = L.x + (b.x - L.x) * k, sy = L.y + (b.y - L.y) * k;
    pathPts(ctx, groundCircle(sx, sy, BALL_R * 0.9, 0, 14));
    ctx.fillStyle = `rgba(2, 10, 26, ${0.08 + ws[i] * 0.2})`;
    ctx.fill();
  });
  // Sombra principal bajo la pelota (clave para leer la altura)
  const spread = 1 + h * 0.006;
  pathPts(ctx, groundCircle(b.x, b.y, BALL_R * 1.1 * spread, 0, 18));
  ctx.fillStyle = `rgba(0, 6, 16, ${clamp(0.55 / (1 + h * 0.012), 0.16, 0.55)})`;
  ctx.fill();
}

// ---------- Jugadores con volumen (esqueleto 3D proyectado) ----------
const TEAM_COLORS = ['#45a8ff', '#ff5c50'];
const OUTLINE = 'rgba(4, 10, 20, 0.5)';
const PLAYER_SCALE = 1.14;  // un poco más grandes que la escala real para que se lean bien
const lookOf = p => LOOKS[p.lookId] || LOOKS.fernando;
const scaleOf = p => PLAYER_SCALE * ENTITY_K * sizeOf(p) * (actOn(p, 'gordo') ? 1.5 : 1);
const SHADOW_LOOK_COLORS = { skin: '#4a3a78', hairColor: '#1b1430', shirt: '#4b3a7a', shirtHi: '#8a76c8', shirtLo: '#241a40', shorts: '#1b1430', shoes: '#2a2048', band: '#9d7bff' };
const CELEB_KIND = { german: 'belly', maxi: 'mullet', alvaro: 'flex', fernando: 'cap', matias: 'jump', joaquin: 'peace', zeus: 'bolt' };

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(((n >> 16) & 255) * k, 0, 255) | 0;
  const g = clamp(((n >> 8) & 255) * k, 0, 255) | 0;
  const b = clamp((n & 255) * k, 0, 255) | 0;
  return `rgb(${r},${g},${b})`;
}

function targetPose(p, idx, charging, cr, lob) {
  const b = state.ball;
  const isServer = state.phase === 'SERVE' && state.serverSlot === idx;
  const ballHigh = b.z > SMASH_MIN_Z && Math.abs(p.x - COURT.netX) < 220 &&
    Math.hypot(b.x - p.x, b.y - p.y) < 170 && b.lastHitTeam !== p.team;
  if (charging) {
    if (isServer) return { beta: 0.5 + cr * 1.5, z: 30 - cr * 5, reach: 13, tilt: -0.15, kind: 'serve' };
    if (lob) return { beta: 0.45 + cr * 1.6, z: 36 - cr * 9, reach: 14, tilt: 0.05, kind: 'lob' };
    if (ballHigh) return { beta: 1.5 + cr * 0.55, z: 82 + cr * 5, reach: 5, tilt: 0.85, kind: 'smash' };
    return { beta: 0.45 + cr * 1.95, z: 47 - cr * 3, reach: 14, tilt: 0.45, kind: 'drive' };
  }
  return { beta: 0.32, z: isServer ? 30 : 45, reach: 11, tilt: isServer ? 0.2 : 0.95, kind: 'ready' };
}

const SWING_END = {
  drive: { beta: -1.35, z: 54, reach: 14, tilt: 0.5 },
  lob: { beta: -1.1, z: 76, reach: 13, tilt: 0.85 },
  smash: { beta: -0.55, z: 36, reach: 15, tilt: -0.35 },
  serve: { beta: -0.7, z: 52, reach: 14, tilt: 0.6 }
};
const SWING_FRAMES = 13;

function celebPose(kind, t, L, shZ) {
  const w = Math.sin(t * 0.3);
  switch (kind) {
    case 'belly': return { rh: L(10 + 2 * w, 3 + 3 * Math.cos(t * 0.3), shZ - 15), lh: L(10 - 2 * w, -3 - 3 * Math.cos(t * 0.3), shZ - 15), hide: true, jump: 0 };
    case 'mullet': return { rh: L(-5, 4, shZ + 13 + w), lh: L(3, -10, shZ - 13), hide: true, jump: 0 };
    case 'flex': return { rh: L(1, 15, shZ + 13 + w * 1.5), lh: L(1, -15, shZ + 13 - w * 1.5), hide: true, jump: 0 };
    case 'cap': return { rh: L(1, 2, shZ + 17), lh: L(9, -9, shZ + 3), hide: true, jump: 0 };
    case 'jump': return { rh: L(4, 6, shZ + 22), lh: L(5, -9, shZ - 5), hide: false, jump: Math.abs(Math.sin(t * 0.17)) * 16 };
    case 'peace': return { rh: L(11, 5, shZ + 11), lh: L(3, -9, shZ - 12), hide: true, jump: 0, peace: true };
    case 'bolt': return { rh: L(0, 9, shZ + 26), lh: L(0, -9, shZ + 26), hide: true, jump: Math.abs(w) * 8 };
    default: return { rh: L(3, 6, shZ + 22 + w * 3), lh: L(3, -9, shZ - 10), hide: false, jump: 0 };
  }
}

function buildPlayerParts(p, idx, dt, now, pf, opts = {}) {
  let look = opts.look || lookOf(p);
  if (actOn(p, 'gordo') && !opts.portrait) look = { ...look, body: { ...look.body, w: 1.75, belly: 1.95, arm: 1.55, leg: 1.6 } };
  const body = look.body;
  const skin = look.skin;
  const b = state.ball;
  const wf = body.w;
  const armK = body.arm * (1 + 0.08 * upLvl(p, 'fuerza'));
  const legK = body.leg;

  // Velocidad medida desde la posición (sirve igual en host y en clientes)
  let sp = 0;
  if (!opts.portrait) {
    if (pf.lastX === null) { pf.lastX = p.x; pf.lastY = p.y; }
    let mvx = (p.x - pf.lastX) / Math.max(dt, 0.25), mvy = (p.y - pf.lastY) / Math.max(dt, 0.25);
    if (Math.hypot(mvx, mvy) > 14) { mvx = 0; mvy = 0; }
    pf.vx = lerp(pf.vx, mvx, clamp(0.35 * dt, 0, 1));
    pf.vy = lerp(pf.vy, mvy, clamp(0.35 * dt, 0, 1));
    pf.lastX = p.x; pf.lastY = p.y;
    sp = Math.hypot(pf.vx, pf.vy);
  }
  const moving = sp > 0.35;
  const runAmt = clamp(sp / 3, 0, 1);
  pf.phase += sp * 0.09 * dt;
  if (!opts.portrait && p.sprintActiveTimer > 0 && moving) {
    pf.dust += dt;
    if (pf.dust > 2.5) {
      pf.dust = 0;
      spawnSand(p.x - pf.vx * 2 + (Math.random() - 0.5) * 8, p.y - pf.vy * 2 + (Math.random() - 0.5) * 8, 2, 0.7);
    }
  }

  // Orientación: mira a la red y gira hacia la pelota
  if (opts.facing != null) pf.facing = opts.facing;
  else {
    const base = p.team === 0 ? 0 : Math.PI;
    const toBall = Math.atan2(b.y - p.y, b.x - p.x);
    const desired = base + clamp(angleDiff(toBall, base), -1.1, 1.1) * 0.75;
    if (pf.facing === null) pf.facing = desired;
    pf.facing += angleDiff(desired, pf.facing) * clamp(0.16 * dt, 0, 1);
  }
  const th = pf.facing;
  const Fx = Math.cos(th), Fy = Math.sin(th), Rx = -Fy, Ry = Fx;
  const L = (f, s, z) => ({ x: p.x + Fx * f + Rx * s, y: p.y + Fy * f + Ry * s, z });

  // Estado de carga (el jugador local se ve con su carga en tiempo real)
  let charging = p.charging, cr = Math.min(1, p.chargeFrames / MAX_CHARGE_FRAMES), lob = p.lobMode;
  if (!opts.portrait && !isHost && idx === mySlot) {
    charging = localInput.charging;
    cr = Math.min(1, localChargeFrames / MAX_CHARGE_FRAMES);
    lob = localInput.lobMode;
  }
  if (opts.portrait) charging = false;

  // Detección de golpe: el cooldown salta a 28 al soltar
  if (!opts.portrait && p.cooldown > pf.lastCooldown + 4) {
    const kind = pf.pose.kind || 'drive';
    pf.swingKind = kind === 'ready' ? (p.swingLob ? 'lob' : 'drive') : kind;
    if (p.swingLob) pf.swingKind = 'lob';
    pf.from = { ...pf.pose };
    pf.swingT = 0;
    pf.tips = [];
  }
  pf.lastCooldown = p.cooldown;

  const tgt = targetPose(p, idx, charging, cr, lob);
  let pose;
  if (pf.swingT >= 0) {
    pf.swingT += dt;
    const u = clamp(pf.swingT / SWING_FRAMES, 0, 1);
    const e = easeOut(u);
    const end = SWING_END[pf.swingKind] || SWING_END.drive;
    pose = {
      beta: lerp(pf.from.beta, end.beta, e),
      z: lerp(pf.from.z, end.z, e) + (pf.swingKind === 'smash' ? Math.sin(u * Math.PI) * 8 : 0),
      reach: lerp(pf.from.reach, end.reach, e),
      tilt: lerp(pf.from.tilt, end.tilt, e),
      kind: pf.swingKind
    };
    if (pf.swingT > SWING_FRAMES + 7) pf.swingT = -1;
  } else if (opts.portrait) {
    pose = { beta: 1.35, z: 46, reach: 12, tilt: 1, kind: 'ready' };
  } else {
    const k = clamp(0.22 * dt, 0, 1);
    pose = {
      beta: lerp(pf.pose.beta, tgt.beta, k),
      z: lerp(pf.pose.z, tgt.z, k),
      reach: lerp(pf.pose.reach, tgt.reach, k),
      tilt: lerp(pf.pose.tilt, tgt.tilt, k),
      kind: tgt.kind
    };
  }
  pf.pose = pose;
  const swinging = pf.swingT >= 0 && pf.swingT <= SWING_FRAMES;

  // ---- Piernas ----
  const crouch = charging ? 3 : (moving ? 0.6 : 1.6);
  const bob = moving ? Math.abs(Math.sin(pf.phase)) * 2.2 * runAmt : Math.sin(now * 0.006 + idx) * 0.5;
  const pelvisZ = 37 - crouch + bob;
  const mvLen = sp || 1;
  const mdx = moving ? pf.vx / mvLen : Fx, mdy = moving ? pf.vy / mvLen : Fy;
  const parts = [];
  const shoeCol = upLvl(p, 'zapas') ? '#ffd54a' : look.shoes;
  const sockCol = look.socksDark ? '#2b2b2b' : '#eef2f6';
  for (const s of [-1, 1]) {
    const ph = pf.phase + (s > 0 ? 0 : Math.PI);
    const swingL = moving ? Math.sin(ph) * 10 * runAmt : 0;
    const lift = moving ? Math.max(0, Math.cos(ph)) * 6.5 * runAmt : 0;
    const stanceW = (moving ? 4.6 : 7.6) * Math.max(1, wf * 0.92);
    const hip = L(0, s * 4.4 * wf, pelvisZ);
    const fb = L(moving ? 0 : (s > 0 ? -1.5 : 2.2), s * stanceW, 0);
    const foot = { x: fb.x + mdx * swingL, y: fb.y + mdy * swingL, z: lift };
    const kf = 3.6 + crouch * 0.8 + lift * 0.35;
    const knee = { x: (hip.x + foot.x) / 2 + Fx * kf, y: (hip.y + foot.y) / 2 + Fy * kf, z: (hip.z + foot.z) / 2 + 1.5 };
    const ankle = { x: foot.x, y: foot.y, z: foot.z + 3.2 };
    const thighMid = { x: lerp(hip.x, knee.x, 0.55), y: lerp(hip.y, knee.y, 0.55), z: lerp(hip.z, knee.z, 0.55) };
    const sk0 = look.socksHigh ? 0.3 : 0.72;
    const sock = { x: lerp(knee.x, ankle.x, sk0), y: lerp(knee.y, ankle.y, sk0), z: lerp(knee.z, ankle.z, sk0) };
    const heel = { x: foot.x - Fx * 2.6, y: foot.y - Fy * 2.6, z: foot.z + 1.7 };
    const toe = { x: foot.x + Fx * 4.6, y: foot.y + Fy * 4.6, z: foot.z + 1.5 };
    parts.push({ k: 'limb', a: knee, b: ankle, w: 4.6 * legK, c: skin, hl: true });
    parts.push({ k: 'limb', a: sock, b: ankle, w: 4.9 * legK, c: sockCol });
    parts.push({ k: 'limb', a: heel, b: toe, w: 4.6, c: shoeCol, sole: look.band });
    parts.push({ k: 'limb', a: thighMid, b: knee, w: 5.8 * legK, c: skin, hl: true });
    parts.push({ k: 'limb', a: hip, b: thighMid, w: 7.4 * Math.max(wf, legK), c: look.shorts });
  }

  // ---- Torso (cilindro elíptico visto desde la cámara) ----
  const twist = clamp(-(pose.beta - 0.35) * 0.38, -0.85, 0.7);
  const lean = moving ? 2.6 : (charging ? 1.2 : 2);
  const belly = body.belly;
  const shZ = pelvisZ + 24;
  const Sc = { x: p.x + Fx * lean, y: p.y + Fy * lean, z: shZ };
  const bf = (belly - 1) * 5;
  const Pc = { x: p.x + Fx * (lean * 0.3 + bf), y: p.y + Fy * (lean * 0.3 + bf), z: pelvisZ + 1 };
  const sth = th + twist;
  const SFx = Math.cos(sth), SFy = Math.sin(sth), SRx = -SFy, SRy = SFx;
  const shR = { x: Sc.x + SRx * 8.2 * wf, y: Sc.y + SRy * 8.2 * wf, z: shZ - 0.5 };
  const shL = { x: Sc.x - SRx * 8.2 * wf, y: Sc.y - SRy * 8.2 * wf, z: shZ - 0.5 };
  const crx = cam.r.x, cry = cam.r.y;
  const halfW = (a, bb, ux, uy, vx, vy) => Math.sqrt((a * (ux * crx + uy * cry)) ** 2 + (bb * (vx * crx + vy * cry)) ** 2);
  const wTop = halfW(8.6 * wf, 5 * wf, SRx, SRy, SFx, SFy);
  const wBot = halfW(6.6 * wf * belly, 4.6 * belly * belly, Rx, Ry, Fx, Fy);
  parts.push({
    k: 'torso', look,
    pts: [
      { x: Pc.x - crx * wBot, y: Pc.y - cry * wBot, z: Pc.z - 6 },
      { x: Pc.x + crx * wBot, y: Pc.y + cry * wBot, z: Pc.z - 6 },
      { x: Sc.x + crx * wTop, y: Sc.y + cry * wTop, z: shZ - 1 },
      { x: Sc.x - crx * wTop, y: Sc.y - cry * wTop, z: shZ - 1 }
    ],
    belly: belly > 1.15 ? { x: Pc.x + Fx * 2, y: Pc.y + Fy * 2, z: Pc.z + 2, r: 6.5 * belly } : null,
    shorts: [
      { x: Pc.x - crx * (wBot + 0.6), y: Pc.y - cry * (wBot + 0.6), z: Pc.z - 9 },
      { x: Pc.x + crx * (wBot + 0.6), y: Pc.y + cry * (wBot + 0.6), z: Pc.z - 9 },
      { x: Pc.x + crx * wBot, y: Pc.y + cry * wBot, z: Pc.z + 1 },
      { x: Pc.x - crx * wBot, y: Pc.y - cry * wBot, z: Pc.z + 1 }
    ],
    center: { x: (Sc.x + Pc.x) / 2, y: (Sc.y + Pc.y) / 2, z: (Sc.z + Pc.z) / 2 }
  });

  const sleeveCol = look.tank ? skin : look.shirt;
  const sleeveW = look.tank ? 4.4 * armK : 5.6 * Math.max(wf * 0.95, armK * 0.9);

  // ---- Brazo de la pala (derecho) ----
  const hx = Math.cos(pose.beta) * Fx + Math.sin(pose.beta) * Rx;
  const hy = Math.cos(pose.beta) * Fy + Math.sin(pose.beta) * Ry;
  const pivot = { x: Sc.x + Rx * 5 * wf, y: Sc.y + Ry * 5 * wf };
  let hand = { x: pivot.x + hx * pose.reach, y: pivot.y + hy * pose.reach, z: pose.z };
  const cel = opts.celeb ? celebPose(opts.celeb.kind, opts.celeb.t, L, shZ) : null;
  if (cel) hand = cel.rh;
  const up = pose.z > shZ + 4;
  const elbow = {
    x: (shR.x + hand.x) / 2 + Rx * (up ? 4 : 2.5) - Fx * (up ? 2 : 0),
    y: (shR.y + hand.y) / 2 + Ry * (up ? 4 : 2.5) - Fy * (up ? 2 : 0),
    z: (shR.z + hand.z) / 2 - (up ? -2 : 4.5)
  };
  const sleeve = { x: lerp(shR.x, elbow.x, 0.45), y: lerp(shR.y, elbow.y, 0.45), z: lerp(shR.z, elbow.z, 0.45) };
  const wrist = { x: lerp(elbow.x, hand.x, 0.8), y: lerp(elbow.y, hand.y, 0.8), z: lerp(elbow.z, hand.z, 0.8) };
  parts.push({ k: 'limb', a: shR, b: sleeve, w: sleeveW, c: sleeveCol, hl: look.tank });
  parts.push({ k: 'limb', a: sleeve, b: elbow, w: 4.2 * armK, c: skin, hl: true });
  parts.push({ k: 'limb', a: elbow, b: hand, w: 3.8 * armK, c: skin, hl: true });
  parts.push({ k: 'limb', a: wrist, b: hand, w: 4.2 * armK, c: upLvl(p, 'remate') ? '#ff3d00' : look.band });

  // ---- Brazo libre (equilibrio / señala la pelota) ----
  const armSwing = moving ? Math.sin(pf.phase) * 6 * runAmt : 0;
  let lh;
  if (charging && pose.kind === 'smash') lh = L(10, -6, 78);
  else if (charging) lh = L(12, -9 * wf, 52);
  else lh = L(8 + armSwing, -10.5 * wf, 44 + Math.abs(armSwing) * 0.3);
  if (cel) lh = cel.lh;
  const lel = { x: (shL.x + lh.x) / 2 - Rx * 2.5, y: (shL.y + lh.y) / 2 - Ry * 2.5, z: (shL.z + lh.z) / 2 - 4 };
  const lsl = { x: lerp(shL.x, lel.x, 0.45), y: lerp(shL.y, lel.y, 0.45), z: lerp(shL.z, lel.z, 0.45) };
  const lwr = { x: lerp(lel.x, lh.x, 0.8), y: lerp(lel.y, lh.y, 0.8), z: lerp(lel.z, lh.z, 0.8) };
  parts.push({ k: 'limb', a: shL, b: lsl, w: sleeveW, c: sleeveCol, hl: look.tank });
  parts.push({ k: 'limb', a: lsl, b: lel, w: 4.2 * armK, c: skin, hl: true });
  parts.push({ k: 'limb', a: lel, b: lh, w: 3.8 * armK, c: skin, hl: true });
  if (!opts.portrait) parts.push({ k: 'limb', a: lwr, b: lh, w: 4.4 * armK, c: TEAM_COLORS[p.team] });   // muñequera del equipo

  // ---- Cabeza ----
  const head = { x: Sc.x + Fx * 0.8, y: Sc.y + Fy * 0.8, z: shZ + 10.5 };
  parts.push({ k: 'limb', a: { x: Sc.x, y: Sc.y, z: shZ - 1 }, b: { x: head.x, y: head.y, z: head.z - 3 }, w: 4.2 * Math.max(1, wf * 0.95), c: skin });
  parts.push({ k: 'head', c: head, r: 5.8, look, fx: Fx, fy: Fy, hats: upLvl(p, 'sombrero') });
  if (cel && cel.peace) {
    parts.push({ k: 'limb', a: hand, b: { x: hand.x - 1, y: hand.y + 1, z: hand.z + 4 }, w: 1.2, c: skin });
    parts.push({ k: 'limb', a: hand, b: { x: hand.x + 1, y: hand.y - 1, z: hand.z + 4 }, w: 1.2, c: skin });
  }

  // ---- Pala ----
  const ps = (1 + 0.15 * upLvl(p, 'pala')) * (actOn(p, 'palaxl') && !opts.portrait ? 2.6 : 1);
  let pdx = hand.x - shR.x, pdy = hand.y - shR.y;
  const pl = Math.hypot(pdx, pdy) || 1;
  pdx /= pl; pdy /= pl;
  const ht = clamp(pose.tilt, -1, 1);
  let dX = pdx * (1 - Math.abs(ht) * 0.55), dY = pdy * (1 - Math.abs(ht) * 0.55), dZ = ht;
  const dl = Math.hypot(dX, dY, dZ) || 1;
  dX /= dl; dY /= dl; dZ /= dl;
  let wX = dY, wY = -dX;
  const wl = Math.hypot(wX, wY);
  if (wl < 0.15) { wX = Fx; wY = Fy; } else { wX /= wl; wY /= wl; }
  const shape = look.paddle.shape;
  const halfLen = (shape === 'round' ? 8.4 : 9) * ps;
  const pc = { x: hand.x + dX * (5.5 * ps + halfLen), y: hand.y + dY * (5.5 * ps + halfLen), z: hand.z + dZ * (5.5 * ps + halfLen) };
  const face = [];
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2;
    const ca = Math.cos(a), sa = Math.sin(a);
    let wd;
    if (shape === 'round') wd = 7.6;
    else if (shape === 'diamond') wd = 7.8 * (1 - 0.55 * Math.max(0, -ca)) * (1 - 0.12 * Math.max(0, ca));
    else wd = 7 * (1 + 0.1 * ca);
    wd *= ps;
    face.push({ x: pc.x + dX * halfLen * ca + wX * wd * sa, y: pc.y + dY * halfLen * ca + wY * wd * sa, z: pc.z + dZ * halfLen * ca });
  }
  const tip = { x: pc.x + dX * halfLen, y: pc.y + dY * halfLen, z: pc.z + dZ * halfLen };
  if (swinging) {
    pf.tips.push({ tip, pc });
    if (pf.tips.length > 7) pf.tips.shift();
  } else if (pf.tips.length) {
    pf.tips.shift();
  }
  if (!(cel && cel.hide)) parts.push({
    k: 'paddle', hand, neck: { x: hand.x + dX * 6 * ps, y: hand.y + dY * 6 * ps, z: hand.z + dZ * 6 * ps },
    face, paddle: look.paddle, dot: look.band, center: pc, ps
  });

  // Zeus salta sobre una nube cuando remata
  const cloud = p.lookId === 'zeus' && (pose.kind === 'smash' || (swinging && pf.swingKind === 'smash'));
  const jumpZ = (cel ? cel.jump : 0) + (cloud ? 14 : 0);
  return { parts, pf, look, charging, cr, lob, swinging, portrait: !!opts.portrait, jumpZ, cloud };
}

function drawLimb(a, b, w, color, hl, sole) {
  const lw = Math.max(1, w * (a.s + b.s) / 2);
  ctx.lineCap = 'round';
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = lw + 1.4;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  if (sole) {
    ctx.strokeStyle = sole;
    ctx.lineWidth = Math.max(0.8, lw * 0.35);
    ctx.beginPath(); ctx.moveTo(a.x, a.y + lw * 0.32); ctx.lineTo(b.x, b.y + lw * 0.32); ctx.stroke();
  }
  if (hl) {
    ctx.strokeStyle = 'rgba(255, 240, 225, 0.28)';
    ctx.lineWidth = Math.max(0.6, lw * 0.32);
    const ox = -lw * 0.18, oy = -lw * 0.2;
    ctx.beginPath(); ctx.moveTo(a.x + ox, a.y + oy); ctx.lineTo(b.x + ox, b.y + oy); ctx.stroke();
  }
}

function ell(x, y, rx, ry, rot, color) {
  ctx.beginPath();
  ctx.ellipse(x, y, Math.max(0.3, rx), Math.max(0.3, ry), rot || 0, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

// Cabeza con peinado, barba, bigote, lentes, jockey o visera según el personaje
function drawHats(c, r, n) {
  const cols = ['#e53935', '#fdd835', '#43a047', '#1e88e5', '#8e24aa'];
  let y = c.y - r * 0.75;
  for (let k = 0; k < n; k++) {
    ell(c.x, y, r * 1.35, r * 0.32, 0, shade(cols[k % 5], 0.75));
    ctx.fillStyle = cols[k % 5];
    ctx.fillRect(c.x - r * 0.72, y - r * 0.95, r * 1.44, r * 0.95);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(c.x - r * 0.72, y - r * 0.32, r * 1.44, r * 0.18);
    y -= r * 1.05;
  }
}

function drawHead(c, front, r, look, K) {
  const ex = look.extras || {};
  const hs = look.hair, hc = look.hairColor, skin = look.skin;
  let fdx = front.x - c.x, fdy = front.y - c.y;
  const fl = Math.hypot(fdx, fdy) || 1;
  fdx /= fl; fdy /= fl;
  const side = clamp(fl / (6 * K * c.s), 0, 1);      // 0 = de frente o de espaldas, 1 = de perfil
  const toward = front.d < c.d;                       // ¿mira hacia la cámara?
  const faceVis = toward ? 1 : clamp(side * 1.4 - 0.25, 0, 1);
  const off = r * 0.36 * side;
  const fx0 = c.x + fdx * off, fy0 = c.y + r * 0.25;
  const bx = -fdx;                                    // hacia la nuca

  // Pelo detrás de la cabeza
  if (hs === 'afro') ell(c.x + bx * r * 0.15, c.y - r * 0.25, r * 1.5, r * 1.4, 0, hc);
  if (hs === 'mullet') ell(c.x + bx * r * 0.75, c.y + r * 0.85, r * 0.6, r * 0.95, 0, hc);
  if (hs === 'ponytail') ell(c.x + bx * r * 1.05, c.y + r * 0.35, r * 0.42, r * 1.0, bx * 0.5, hc);
  if (hs === 'bun') ell(c.x + bx * r * 0.55, c.y - r * 0.85, r * 0.5, r * 0.46, 0, hc);
  if (hs === 'curly') for (let i = 0; i < 7; i++) {
    const a = Math.PI * (1.05 + i * 0.15);
    ell(c.x + Math.cos(a) * r * 0.95, c.y + Math.sin(a) * r * 0.9, r * 0.38, r * 0.38, 0, hc);
  }

  ctx.beginPath(); ctx.arc(c.x, c.y, r + 0.7, 0, Math.PI * 2);
  ctx.fillStyle = OUTLINE; ctx.fill();
  const bald = hs === 'bald';
  ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
  ctx.fillStyle = bald ? shade(skin, 0.92) : hc;
  ctx.fill();

  ctx.save();
  ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2); ctx.clip();
  // Cara
  if (faceVis > 0.02) {
    ctx.globalAlpha = faceVis;
    const g = ctx.createRadialGradient(fx0 - r * 0.2, fy0 - r * 0.1, r * 0.1, fx0, fy0, r * 1.05);
    g.addColorStop(0, shade(skin, 1.12));
    g.addColorStop(1, shade(skin, 0.78));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(fx0, fy0, r * (bald ? 1.05 : 0.9), 0, Math.PI * 2); ctx.fill();
    if (hs === 'side') ell(c.x + fdx * r * 0.25, c.y - r * 0.62, r * 1.0, r * 0.45, -fdx * 0.25, hc);
    if (hs === 'short' || hs === 'mullet' || hs === 'slick') ell(c.x, c.y - r * 0.72, r * 1.0, r * 0.42, 0, hc);
    if (ex.beard) ell(fx0 + fdx * r * 0.1, fy0 + r * 0.45, r * 0.72, r * 0.42, 0, ex.beard);
    if (ex.mustache && faceVis > 0.3) ell(fx0 + fdx * r * 0.32, fy0 + r * 0.1, r * 0.5, r * 0.17, 0, ex.mustache);
    if (ex.glasses && faceVis > 0.3) {
      ctx.strokeStyle = ex.glasses;
      ctx.lineCap = 'round';
      ctx.lineWidth = Math.max(1, r * 0.34);
      ctx.beginPath(); ctx.moveTo(fx0 - r * 0.55 + fdx * r * 0.2, fy0 - r * 0.25); ctx.lineTo(fx0 + r * 0.55 + fdx * r * 0.2, fy0 - r * 0.25); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  if (bald) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.beginPath(); ctx.ellipse(c.x - r * 0.3, c.y - r * 0.55, r * 0.35, r * 0.18, -0.4, 0, Math.PI * 2); ctx.fill();
  }
  if (hs === 'slick') {
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = Math.max(0.6, r * 0.12);
    ctx.beginPath(); ctx.arc(c.x, c.y + r * 0.2, r * 0.85, Math.PI * 1.2, Math.PI * 1.7); ctx.stroke();
  }
  // Cintillo
  if (ex.headband) {
    ctx.strokeStyle = ex.headband;
    ctx.lineWidth = Math.max(0.8, r * 0.28);
    ctx.beginPath(); ctx.ellipse(c.x, c.y - r * 0.2, r * 1.05, r * 0.35, 0, Math.PI * 1.02, Math.PI * 1.98); ctx.stroke();
  }
  // Jockey
  if (ex.cap) ell(c.x, c.y - r * 0.42, r * 1.05, r * 0.66, 0, ex.cap);
  ctx.restore();

  if (hs === 'spiky') {
    ctx.fillStyle = hc;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = Math.PI * (1.1 + i * 0.2);
      ctx.moveTo(c.x + Math.cos(a - 0.18) * r * 0.85, c.y + Math.sin(a - 0.18) * r * 0.85);
      ctx.lineTo(c.x + Math.cos(a) * r * 1.5, c.y + Math.sin(a) * r * 1.5);
      ctx.lineTo(c.x + Math.cos(a + 0.18) * r * 0.85, c.y + Math.sin(a + 0.18) * r * 0.85);
    }
    ctx.fill();
  }
  // Visera del jockey o visera deportiva
  if (ex.cap) {
    const vd = ex.capBack ? -1 : 1;
    ell(c.x + fdx * r * 0.95 * vd, c.y - r * 0.32, r * (0.35 + 0.35 * side), r * 0.18, 0, shade(ex.cap === '#ffffff' ? '#e6e6e6' : ex.cap, 0.85));
  }
  if (ex.visor) {
    ctx.strokeStyle = ex.visor;
    ctx.lineWidth = Math.max(0.8, r * 0.26);
    ctx.beginPath(); ctx.ellipse(c.x, c.y - r * 0.3, r * 1.05, r * 0.33, 0, Math.PI * 1.02, Math.PI * 1.98); ctx.stroke();
    ell(c.x + fdx * r * 0.95, c.y - r * 0.28, r * (0.3 + 0.35 * side), r * 0.16, 0, ex.visor);
  }
}

function drawPlayer(p, idx, built) {
  const { parts, pf, look } = built;
  const items = [];
  const K = built.portrait ? PLAYER_SCALE : scaleOf(p);
  const Kz = K * look.body.h * (1 + 0.03 * upLvl(p, 'estiron')) * (actOn(p, 'gordo') ? 1.2 : 1);
  const ox = built.ox != null ? built.ox : p.x, oy = built.oy != null ? built.oy : p.y;
  const jz = built.jumpZ || 0;
  const T = v => P(ox + (v.x - p.x) * K, oy + (v.y - p.y) * K, v.z * Kz + jz);
  for (const part of parts) {
    if (part.k === 'limb') {
      const a = T(part.a), b = T(part.b);
      items.push({ d: (a.d + b.d) / 2, draw: () => drawLimb(a, b, part.w * K, part.c, part.hl, part.sole) });
    } else if (part.k === 'torso') {
      const L = part.look;
      const q = part.pts.map(T);
      const sh = part.shorts.map(T);
      const cc = T(part.center);
      const bel = part.belly ? T(part.belly) : null;
      items.push({
        d: cc.d + 0.5,
        draw: () => {
          pathPts(ctx, sh);
          ctx.fillStyle = L.shorts;
          ctx.fill();
          ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1; ctx.stroke();
          pathPts(ctx, q);
          const g = ctx.createLinearGradient(q[3].x, q[3].y, q[2].x, q[2].y);
          g.addColorStop(0, L.shirtLo);
          g.addColorStop(0.3, L.shirtHi);
          g.addColorStop(0.55, L.shirt);
          g.addColorStop(1, L.shirtLo);
          ctx.fillStyle = g;
          ctx.fill();
          if (bel) {
            // Guatita
            ctx.beginPath(); ctx.arc(bel.x, bel.y, part.belly.r * K * bel.s, 0, Math.PI * 2);
            ctx.fill();
          }
          pathPts(ctx, q);
          const g2 = ctx.createLinearGradient(0, q[3].y, 0, q[0].y);
          g2.addColorStop(0, 'rgba(255,255,255,0.08)');
          g2.addColorStop(1, 'rgba(0,0,0,0.26)');
          ctx.fillStyle = g2;
          ctx.fill();
          ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.1; ctx.stroke();
          if (L.tank) {
            // Musculosa: hombros descubiertos
            ctx.fillStyle = L.skin;
            for (const k of [3, 2]) {
              ctx.beginPath(); ctx.arc(q[k].x + (k === 3 ? 1 : -1) * 1.5, q[k].y + 1.5, Math.max(1.2, 2.6 * K * q[k].s), 0, Math.PI * 2); ctx.fill();
            }
          }
        }
      });
    } else if (part.k === 'head') {
      const c = T(part.c);
      const front = T({ x: part.c.x + part.fx * 6, y: part.c.y + part.fy * 6, z: part.c.z });
      items.push({
        d: c.d,
        draw: () => {
          const r = Math.max(2.5, part.r * K * c.s);
          drawHead(c, front, r, part.look, K);
          if (part.hats) drawHats(c, r, part.hats);
        }
      });
    } else if (part.k === 'paddle') {
      const hand = T(part.hand);
      const neck = T(part.neck);
      const face = part.face.map(T);
      const cc = T(part.center);
      const tips = pf.tips.map(t => ({ tip: T(t.tip), pc: T(t.pc) }));
      items.push({
        d: cc.d - 0.5,
        draw: () => {
          if (tips.length > 1) {
            for (let i = 1; i < tips.length; i++) {
              const a = tips[i - 1], b = tips[i];
              ctx.beginPath();
              ctx.moveTo(a.pc.x, a.pc.y); ctx.lineTo(a.tip.x, a.tip.y); ctx.lineTo(b.tip.x, b.tip.y); ctx.lineTo(b.pc.x, b.pc.y);
              ctx.closePath();
              ctx.fillStyle = `rgba(235, 245, 255, ${0.07 + 0.2 * i / tips.length})`;
              ctx.fill();
            }
          }
          ctx.lineCap = 'round';
          ctx.strokeStyle = '#11151b';
          ctx.lineWidth = Math.max(1.2, 2.4 * K * hand.s);
          ctx.beginPath(); ctx.moveTo(hand.x, hand.y); ctx.lineTo(neck.x, neck.y); ctx.stroke();
          pathPts(ctx, face);
          ctx.fillStyle = part.paddle.face;
          ctx.fill();
          ctx.strokeStyle = part.paddle.rim;
          ctx.lineWidth = Math.max(0.9, 1.4 * K * cc.s);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cc.x, cc.y, Math.max(0.8, 1.6 * K * part.ps * cc.s), 0, Math.PI * 2);
          ctx.fillStyle = part.dot;
          ctx.fill();
        }
      });
    }
  }
  // Estado: rayo (estrellitas), nube de Zeus
  if (!built.portrait) {
    const top = T({ x: p.x, y: p.y, z: 92 });
    if (p.stun > 0) items.push({ d: top.d - 2, draw: () => {
      for (let k = 0; k < 3; k++) {
        const a = performance.now() * 0.006 + k * 2.1;
        const sx = top.x + Math.cos(a) * 10, sy = top.y + Math.sin(a) * 3.5;
        ctx.fillStyle = '#ffeb3b';
        ctx.beginPath(); for (let i = 0; i < 5; i++) { const b = i / 5 * Math.PI * 2 - Math.PI / 2; ctx.lineTo(sx + Math.cos(b) * 3.2, sy + Math.sin(b) * 3.2); ctx.lineTo(sx + Math.cos(b + 0.63) * 1.3, sy + Math.sin(b + 0.63) * 1.3); } ctx.fill();
      }
    } });
    if (built.cloud) {
      const cc = P(ox, oy, 6);
      items.push({ d: cc.d + 1, draw: () => {
        ctx.fillStyle = 'rgba(240, 246, 255, 0.92)';
        for (const [dx, dy, r] of [[-12, 0, 9], [0, -3, 12], [12, 0, 9], [0, 4, 9]]) { ctx.beginPath(); ctx.arc(cc.x + dx * cc.s, cc.y + dy * cc.s, r * cc.s, 0, Math.PI * 2); ctx.fill(); }
      } });
    }
  }
  return items;
}

// Retrato del personaje para los menús (mismo esqueleto 3D, otra cámara)
function renderPortrait(cv, lookId, up) {
  const L = LOOKS[lookId];
  if (!cv || !L) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth || 120, h = cv.clientHeight || 120;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const c2 = cv.getContext('2d');
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  const savedCam = { ...cam };
  const savedCtx = ctx;
  try {
    const dist = 320;
    Object.assign(cam, makeCam(0, 0.16, dist, { x: 0, y: 0, z: 47 }));
    cam.F = h * 0.84 * dist / 104;
    cam.cx = w / 2;
    cam.cy = h * 0.5;
    ctx = c2;
    pathPts(ctx, groundCircle(0, 0, 18, 0, 24));
    ctx.fillStyle = 'rgba(0, 8, 20, 0.4)';
    ctx.fill();
    const fake = createPlayer(0, 0, 0, L.name, true, L.speed, lookId);
    if (up) fake.up = { ...up };
    const built = buildPlayerParts(fake, -1, 1, 0, newPf(), { portrait: true, facing: Math.PI / 2 - 0.5 });
    const items = drawPlayer(fake, -1, built);
    items.sort((a, b) => b.d - a.d);
    items.forEach(it => it.draw());
  } finally {
    Object.assign(cam, savedCam);
    ctx = savedCtx;
  }
}

// ---------- Pelota ----------
function ballItems() {
  const b = state.ball;
  const z = b.z * ZS + BALL_R;
  const pp = P(b.x, b.y, z);
  const hot = b.shotType === '¡REMATE!';
  return [{
    d: pp.d,
    x: b.x,
    draw: () => {
      // Estela con perspectiva
      const tr = b.trail;
      if (state.phase === 'PLAY' && tr.length > 1) {
        const pts = tr.map(t => P(t.x, t.y, t.z * ZS + BALL_R));
        pts.push(pp);
        ctx.lineCap = 'round';
        for (let i = 1; i < pts.length; i++) {
          const k = i / pts.length;
          ctx.strokeStyle = hot ? `rgba(255, 190, 60, ${k * 0.5})` : `rgba(228, 255, 58, ${k * 0.38})`;
          ctx.lineWidth = Math.max(1, BALL_R * 2 * pts[i].s * k * 0.85);
          ctx.beginPath(); ctx.moveTo(pts[i - 1].x, pts[i - 1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
        }
      }
      const rr = Math.max(2.6, BALL_R * pp.s);
      const g = ctx.createRadialGradient(pp.x - rr * 0.35, pp.y - rr * 0.4, rr * 0.05, pp.x, pp.y, rr * 1.05);
      g.addColorStop(0, '#fbffd6');
      g.addColorStop(0.35, hot ? '#ffe34a' : '#e4ff3a');
      g.addColorStop(1, hot ? '#b07a12' : '#88a01c');
      ctx.beginPath(); ctx.arc(pp.x, pp.y, rr, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = Math.max(0.7, rr * 0.16);
      ctx.beginPath();
      ctx.arc(pp.x, pp.y, rr * 0.62, fx.ballSpin, fx.ballSpin + Math.PI * 0.85);
      ctx.stroke();
    }
  }];
}

// ---------- Red ----------
function drawNet() {
  const x0 = COURT.netX;
  const hc = NET_H * ZS, hp = hc + 2.4;
  const y0 = COURT.y, y1 = COURT.y + COURT.h;
  const half = (y1 - y0) / 2, mid = (y0 + y1) / 2;
  const n = fx.net;
  const topZ = y => hp - (hp - hc) * (1 - ((y - mid) / half) ** 2);
  const bulge = (y, zf) => n.amp ? n.dir * n.amp * Math.exp(-(((y - n.y0) / 55) ** 2)) * Math.sin(zf * Math.PI) * Math.cos(n.t * 0.55) : 0;
  const pt = (y, zf) => P(x0 + bulge(y, zf), y, topZ(y) * zf);

  // Paño
  const outline = [];
  for (let y = y0; y <= y1; y += 20) outline.push(pt(y, 0));
  for (let y = y1; y >= y0; y -= 20) outline.push(pt(y, 1));
  pathPts(ctx, outline);
  ctx.fillStyle = 'rgba(8, 12, 18, 0.42)';
  ctx.fill();

  // Malla romboidal
  ctx.strokeStyle = 'rgba(12, 16, 22, 0.75)';
  ctx.lineWidth = 0.7;
  ctx.beginPath();
  for (let y = y0; y <= y1; y += 6) {
    const a = pt(y, 0), b = pt(y, 0.92);
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  }
  for (let k = 1; k <= 5; k++) {
    const zf = k / 6;
    let first = true;
    for (let y = y0; y <= y1; y += 20) {
      const q = pt(y, zf);
      if (first) { ctx.moveTo(q.x, q.y); first = false; } else ctx.lineTo(q.x, q.y);
    }
  }
  ctx.stroke();

  // Faja blanca superior
  const tape = [];
  for (let y = y0; y <= y1; y += 10) tape.push(pt(y, 1));
  ctx.lineCap = 'butt';
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = Math.max(2, 3.8 * tape[0].s);
  pathPts(ctx, tape, false); ctx.stroke();
  ctx.strokeStyle = '#f2f5f8';
  ctx.lineWidth = Math.max(1.5, 2.8 * tape[0].s);
  pathPts(ctx, tape, false); ctx.stroke();

  // Postes
  for (const y of [y0, y1]) {
    const b = P(x0, y, 0), t = P(x0, y, hp + 3);
    ctx.strokeStyle = '#151b23';
    ctx.lineWidth = Math.max(1.5, 3.4 * b.s);
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(t.x, t.y); ctx.stroke();
  }
}

// ---------- Elementos sobre el suelo ----------
function drawServeBox() {
  const b = state.ball;
  if (!(state.phase === 'SERVE' || (state.phase === 'PLAY' && b.isServeShot && b.bouncesInOpponentSide === 0))) return;
  const box = state.serveTargetBox;
  const q = [P(box.minX, box.minY, 0), P(box.maxX, box.minY, 0), P(box.maxX, box.maxY, 0), P(box.minX, box.maxY, 0)];
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.005);
  pathPts(ctx, q);
  ctx.fillStyle = `rgba(228, 255, 58, ${0.1 + pulse * 0.06})`;
  ctx.fill();
  const qi = [P(box.minX + 3, box.minY + 3, 0), P(box.maxX - 3, box.minY + 3, 0), P(box.maxX - 3, box.maxY - 3, 0), P(box.minX + 3, box.maxY - 3, 0)];
  pathPts(ctx, qi);
  ctx.strokeStyle = `rgba(228, 255, 58, ${0.55 + pulse * 0.3})`;
  ctx.lineWidth = 1.6;
  ctx.stroke();
}

function drawPlayerRing(p, idx) {
  const isMe = idx === mySlot;
  const isServer = state.phase === 'SERVE' && state.serverSlot === idx;
  const col = isMe ? '228, 255, 58' : (p.team === 0 ? '69, 168, 255' : '255, 92, 80');
  const pulse = isServer ? 0.5 + 0.5 * Math.sin(performance.now() * 0.008) : 0;
  const ring = groundCircle(p.x, p.y, 20 + pulse * 3, 0, 36);
  pathPts(ctx, ring);
  ctx.strokeStyle = `rgba(${col}, ${isMe ? 0.9 : 0.5})`;
  ctx.lineWidth = isMe ? 2.2 : 1.5;
  ctx.stroke();
  if (isMe) {
    ctx.fillStyle = `rgba(${col}, 0.07)`;
    ctx.fill();
    // Marcas tipo MOBA
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4;
      const p0 = P(p.x + Math.cos(a) * 22, p.y + Math.sin(a) * 22, 0);
      const p1 = P(p.x + Math.cos(a) * 28, p.y + Math.sin(a) * 28, 0);
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    }
  }
}

function drawReach(p, idx, charging) {
  const b = state.ball;
  const dir = p.team === 0 ? 1 : -1;
  const px = p.x + dir * PAD_F, py = p.y + PAD_S;
  const swingFlash = p.swingTimer > 0;
  if (!charging && !swingFlash) return;
  const reach = reachOf(p);
  const inRange = state.phase === 'PLAY' && b.lastHitTeam !== p.team &&
    Math.hypot(b.x - px, b.y - py) <= reach && b.z <= reachZOf(p);
  const isMe = idx === mySlot;
  pathPts(ctx, groundCircle(px, py, reach, 0, 36));
  if (inRange && isMe) {
    ctx.fillStyle = 'rgba(228, 255, 58, 0.12)';
    ctx.fill();
  }
  ctx.strokeStyle = swingFlash ? 'rgba(250, 204, 21, 0.7)' : (inRange ? 'rgba(228, 255, 58, 0.8)' : `rgba(255, 255, 255, ${isMe ? 0.32 : 0.14})`);
  ctx.lineWidth = swingFlash ? 2.2 : 1.2;
  ctx.setLineDash(swingFlash ? [] : [5, 5]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawRivalAims(me) {
  state.players.forEach((p, i) => {
    if (p.team === me.team || !p.charging) return;
    const serve = state.phase === 'SERVE' && state.serverSlot === i;
    const cr = Math.min(1, p.chargeFrames / MAX_CHARGE_FRAMES);
    const { tx, ty } = getClampedTarget(p.team, p.aimX, p.aimY, cr, p.powerStat, p.lobMode, serve);
    pathPts(ctx, groundCircle(tx, ty, 13, 0, 26));
    ctx.fillStyle = 'rgba(255, 92, 80, 0.12)';
    ctx.fill();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(255, 92, 80, 0.85)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

function predictLanding() {
  const b = state.ball;
  if (state.phase !== 'PLAY') return null;
  let x = b.x, y = b.y, z = b.z, vx = b.vx, vy = b.vy, vz = b.vz;
  for (let i = 0; i < 400; i++) {
    x += vx; y += vy; z += vz; vz -= GRAVITY;
    if (z > 0 && state.gust.t > 0) vy += state.gust.w;
    if (x < COURT.x + 10 || x > COURT.x + COURT.w - 10 || y < COURT.y + 10 || y > COURT.y + COURT.h - 10) return null;
    if (z <= 0) return i < 2 ? null : { x, y };
  }
  return null;
}

function drawLandingMarker() {
  const land = predictLanding();
  if (!land) return;
  const me = state.players[mySlot];
  const mine = me && ((land.x < COURT.netX) === (me.team === 0));
  const col = mine ? '228, 255, 58' : '255, 255, 255';
  pathPts(ctx, groundCircle(land.x, land.y, 7, 0, 20));
  ctx.strokeStyle = `rgba(${col}, ${mine ? 0.55 : 0.22})`;
  ctx.lineWidth = 1.3;
  ctx.stroke();
  pathPts(ctx, groundCircle(land.x, land.y, 2, 0, 10));
  ctx.fillStyle = `rgba(${col}, ${mine ? 0.6 : 0.25})`;
  ctx.fill();
}

function drawGroundFx() {
  for (const r of fx.rings) {
    const k = r.t / 26;
    pathPts(ctx, groundCircle(r.x, r.y, 4 + k * 18, 0, 22));
    ctx.strokeStyle = `rgba(230, 236, 210, ${0.45 * (1 - k)})`;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }
}

function drawRipples(walls) {
  for (const rp of fx.ripples) {
    if (!walls.includes(rp.wall)) continue;
    const wall = WALLS[rp.wall];
    const k = rp.t / 30;
    for (const m of [1, 0.6]) {
      const rad = (5 + k * 30) * m;
      const pts = [];
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2;
        const q = wall.pt(rp.a + Math.cos(a) * rad, Math.max(0, rp.z + Math.sin(a) * rad));
        pts.push(P(q.x, q.y, q.z));
      }
      pathPts(ctx, pts);
      ctx.strokeStyle = `rgba(200, 240, 255, ${0.55 * (1 - k) * m})`;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
  }
}

function particleItems() {
  return fx.particles.map(pt => {
    const pp = P(pt.x, pt.y, pt.z);
    return {
      d: pp.d, x: pt.x,
      draw: () => {
        const a = (1 - pt.life / pt.max) * 0.75;
        ctx.fillStyle = `rgba(214, 200, 160, ${a})`;
        const r = Math.max(0.6, pt.size * pp.s);
        ctx.fillRect(pp.x - r / 2, pp.y - r / 2, r, r);
      }
    };
  });
}

function impactItems() {
  return fx.impacts.map(im => {
    const pp = P(im.x, im.y, im.z);
    return {
      d: pp.d - 1, x: im.x,
      draw: () => {
        const k = im.t / 14;
        const r = (im.big ? 26 : 14) * pp.s * (0.4 + k);
        ctx.strokeStyle = im.big ? `rgba(255, 200, 80, ${0.9 * (1 - k)})` : `rgba(255, 255, 255, ${0.8 * (1 - k)})`;
        ctx.lineWidth = im.big ? 3 : 2;
        ctx.beginPath(); ctx.arc(pp.x, pp.y, r, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4 + 0.3;
          ctx.moveTo(pp.x + Math.cos(a) * r * 0.7, pp.y + Math.sin(a) * r * 0.7);
          ctx.lineTo(pp.x + Math.cos(a) * r * 1.25, pp.y + Math.sin(a) * r * 1.25);
        }
        ctx.stroke();
      }
    };
  });
}

// ---------- Guía de tiro del jugador local ----------
function shotPreviewParams(me, ratio, isLob, isMyServe) {
  const b = state.ball;
  const dir = me.team === 0 ? 1 : -1;
  const padX = me.x + dir * PAD_F, padY = me.y + PAD_S;
  let from;
  if (isMyServe) from = { x: b.x, y: b.y, z: b.z };
  else {
    const near = state.phase === 'PLAY' && b.lastHitTeam !== me.team && Math.hypot(b.x - padX, b.y - padY) < 70;
    from = near ? { x: b.x, y: b.y, z: b.z } : { x: padX, y: padY, z: 30 };
  }
  const charge = Math.max(0.15, ratio);
  let label, speed;
  const fz = 1 + 0.12 * upLvl(me, 'fuerza'), rl = upLvl(me, 'remate');
  if (isMyServe) { label = 'SAQUE'; speed = (5.4 + charge * 2.2 + me.powerStat * 1.4) * (1 + 0.06 * upLvl(me, 'fuerza')); }
  else if (isLob) { label = 'GLOBO'; speed = 3.9 + charge * 1.3; }
  else {
    const pm = (0.78 + me.powerStat * 0.52) * fz;
    if (from.z > smashMinOf(me) && charge >= (rl ? 0.4 : 0.5) && Math.abs(me.x - COURT.netX) < 220) { label = '¡REMATE!'; speed = (7.8 + charge * 3.8) * pm * (1 + 0.1 * rl); }
    else { label = 'DRIVE'; speed = (5.2 + charge * 4.0) * pm; }
  }
  return { from, label, speed };
}

// Contrapared: línea al cristal propio y luego el globo hacia el rival
function drawContraPreview(me) {
  const b = state.ball;
  const wallX = me.team === 0 ? COURT.x + 10 : COURT.x + COURT.w - 10;
  const wy = clamp(localInput.aimY, COURT.y + 30, COURT.y + COURT.h - 30);
  const from = Math.hypot(b.x - me.x, b.y - me.y) < 80 ? { x: b.x, y: b.y, z: Math.max(b.z, 10) } : { x: me.x, y: me.y, z: 30 };
  const w = P(wallX, wy, 58 * ZS);
  const a = P(from.x, from.y, from.z * ZS);
  const { tx, ty } = contraTarget(me, localInput.aimY);
  const v = computeLaunch(wallX, wy, 58, tx, ty, 4.6, 'GLOBO', me.team);
  let x = wallX, y = wy, z = 58, vx = v.vx, vy = v.vy, vz = v.vz;
  const pts = [w];
  for (let i = 0; i < 300 && z > 0; i++) { x += vx; y += vy; z += vz; vz -= GRAVITY; if (i % 2 === 0) pts.push(P(x, y, Math.max(0, z) * ZS)); }
  ctx.setLineDash([7, 6]);
  ctx.strokeStyle = 'rgba(160, 230, 255, 0.95)';
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(w.x, w.y); ctx.stroke();
  pathPts(ctx, pts, false); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(w.x, w.y, 5, 0, Math.PI * 2); ctx.fillStyle = 'rgba(160, 230, 255, 0.9)'; ctx.fill();
  const l = pts[pts.length - 1];
  ctx.beginPath(); ctx.arc(l.x, l.y, 3, 0, Math.PI * 2); ctx.fill();
  ctx.font = `600 13px ${FONT_COND}`; ctx.textAlign = 'center'; ctx.fillStyle = '#bfefff';
  ctx.fillText('Contrapared', w.x, w.y - 10);
}

function drawAimGuide(me, layer) {
  const ratio = isHost ? (me.chargeFrames / MAX_CHARGE_FRAMES) : (localChargeFrames / MAX_CHARGE_FRAMES);
  const isCharging = isHost ? me.charging : localInput.charging;
  const isLob = isHost ? me.lobMode : localInput.lobMode;
  const isMyServe = (state.phase === 'SERVE' && state.serverSlot === mySlot);

  const { tx, ty } = getClampedTarget(me.team, localInput.aimX, localInput.aimY, ratio, me.powerStat, isLob, isMyServe);

  let aimValid = true;
  if (isMyServe) {
    const box = state.serveTargetBox;
    aimValid = (tx >= box.minX && tx <= box.maxX && ty >= box.minY && ty <= box.maxY);
  }
  const col = !aimValid ? '239, 68, 68' : (isLob ? '96, 190, 255' : '228, 255, 58');

  if (layer === 'ground') {
    const rad = isCharging ? 10 + ratio * 6 : 8;
    pathPts(ctx, groundCircle(tx, ty, rad, 0, 30));
    ctx.fillStyle = `rgba(${col}, ${isCharging ? 0.14 : 0.06})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(${col}, ${isCharging ? 0.95 : 0.6})`;
    ctx.lineWidth = isCharging ? 2.2 : 1.4;
    ctx.stroke();
    const a = P(tx - 14, ty, 0), b2 = P(tx + 14, ty, 0), c = P(tx, ty - 14, 0), d = P(tx, ty + 14, 0);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y);
    ctx.lineWidth = 1.2; ctx.stroke();
    return;
  }

  if (!isCharging || state.phase === 'POINT_PAUSE') return;
  if (!isMyServe && !isLob && isContraAim(me, localInput.aimX)) { drawContraPreview(me); return; }
  // Arco 3D previsto del golpe (misma balística que la física)
  const { from, label, speed } = shotPreviewParams(me, ratio, isLob, isMyServe);
  const v = computeLaunch(from.x, from.y, from.z, tx, ty, speed, label, me.team);
  let x = from.x, y = from.y, z = from.z, vx = v.vx, vy = v.vy, vz = v.vz;
  const wind = state.gust.t > 0 ? state.gust.w : 0;
  const pts = [P(x, y, z * ZS + BALL_R)];
  const shadow = [P(x, y, 0)];
  let netFail = false;
  for (let i = 0; i < 300; i++) {
    const px = x;
    x += vx; y += vy; z += vz; vz -= GRAVITY;
    if (z > 0) vy += wind;
    if ((px - COURT.netX) * (x - COURT.netX) < 0 && z < NET_H) netFail = true;
    if (z <= 0) { pts.push(P(x, y, BALL_R)); shadow.push(P(x, y, 0)); break; }
    if (i % 2 === 0) { pts.push(P(x, y, z * ZS + BALL_R)); shadow.push(P(x, y, 0)); }
    if (x < COURT.x || x > COURT.x + COURT.w) break;
  }
  const arcCol = netFail ? '239, 68, 68' : col;
  ctx.setLineDash([2, 6]);
  ctx.lineCap = 'round';
  ctx.strokeStyle = `rgba(${arcCol}, 0.22)`;
  ctx.lineWidth = 1.5;
  pathPts(ctx, shadow, false); ctx.stroke();
  ctx.setLineDash([7, 6]);
  ctx.strokeStyle = `rgba(${arcCol}, 0.9)`;
  ctx.lineWidth = 2.2;
  pathPts(ctx, pts, false); ctx.stroke();
  ctx.setLineDash([]);
  const last = pts[pts.length - 1];
  ctx.beginPath(); ctx.arc(last.x, last.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(${arcCol}, 0.95)`; ctx.fill();
}

// ---------- Interfaz en pantalla ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawNameplate(p, idx, built) {
  const anchorZ = Math.max(98, built.pf.pose.z + 58) + upLvl(p, 'sombrero') * 7;   // sube si la pala está en alto o hay sombreros
  const top = P(p.x, p.y, anchorZ * scaleOf(p) * lookOf(p).body.h + (built.jumpZ || 0));
  const k = clamp(top.s / 1.0, 0.85, 1.12);
  const isMe = idx === mySlot;
  const x = top.x, y = top.y;
  const bw = 50 * k;

  ctx.font = `600 ${Math.round(13 * k)}px ${FONT_COND}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(4, 10, 20, 0.85)';
  ctx.lineWidth = 3;
  ctx.strokeText(p.name, x, y - 9 * k);
  ctx.fillStyle = isMe ? COLORS.ball : '#f2f6fa';
  ctx.fillText(p.name, x, y - 9 * k);

  // Barra de sprint o de la activa (siempre visible, como la vida en un MOBA)
  let sprintRatio, fillCol;
  if (p.active) {
    sprintRatio = p.activeT > 0 ? p.activeT / ACTIVE_DURATION : 1 - p.activeCd / ACTIVE_COOLDOWN;
    fillCol = p.activeT > 0 ? '#e1d4ff' : (p.activeCd === 0 ? '#a07bff' : '#5a5076');
  } else {
    sprintRatio = p.sprintActiveTimer > 0 ? (p.sprintActiveTimer / (p.sprintDurMax || SPRINT_DURATION)) : (1 - p.sprintCooldown / (p.sprintCdMax || SPRINT_COOLDOWN));
    fillCol = p.sprintActiveTimer > 0 ? COLORS.ball : (p.sprintCooldown === 0 ? (p.team === 0 ? COLORS.blue : COLORS.red) : '#5d6f82');
  }
  roundRect(x - bw / 2, y - 4 * k, bw, 5 * k, 2);
  ctx.fillStyle = 'rgba(4, 10, 20, 0.8)'; ctx.fill();
  if (sprintRatio > 0.01) {
    roundRect(x - bw / 2 + 1, y - 3 * k, (bw - 2) * clamp(sprintRatio, 0, 1), 3 * k, 1.5);
    ctx.fillStyle = fillCol; ctx.fill();
  }

  // Barra de carga del golpe
  if (built.charging) {
    const r = built.cr;
    const cy = y - 27 * k;
    roundRect(x - bw / 2, cy, bw, 7 * k, 3);
    ctx.fillStyle = 'rgba(4, 10, 20, 0.85)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.stroke();
    const c = built.lob ? '#60beff' : (r > 0.85 ? '#ff8a2a' : (r > 0.45 ? '#ffd23a' : COLORS.ball));
    if (r > 0.01) {
      roundRect(x - bw / 2 + 1.5, cy + 1.5, (bw - 3) * r, 7 * k - 3, 2);
      ctx.fillStyle = c; ctx.fill();
    }
  }
}

function drawBanner() {
  if (state.bannerTimer <= 0 || !state.bannerText) return;
  const alpha = clamp(state.bannerTimer / 14, 0, 1);
  const lines = String(state.bannerText).split('\n');
  const title = lines[0], sub = lines[1] || '';
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `600 24px ${FONT_COND}`;
  const tw = ctx.measureText(title).width;
  ctx.font = `500 15px ${FONT_BODY}`;
  const sw = sub ? ctx.measureText(sub).width : 0;
  const w = Math.max(tw, sw) + 52;
  const h = sub ? 64 : 42;
  const x = VIEW_W / 2 - w / 2, y = VIEW_H - h - 22;
  roundRect(x, y, w, h, 6);
  ctx.fillStyle = 'rgba(8, 19, 31, 0.88)';
  ctx.fill();
  ctx.fillStyle = COLORS.ball;
  ctx.fillRect(x, y + 8, 4, h - 16);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#f2f6fa';
  ctx.font = `600 24px ${FONT_COND}`;
  ctx.fillText(title, x + 24, y + 30);
  if (sub) {
    ctx.fillStyle = '#a9bdd0';
    ctx.font = `500 15px ${FONT_BODY}`;
    ctx.fillText(sub, x + 24, y + 52);
  }
  ctx.restore();
}

function drawAbilityGlyph(kind, cx, cy, col) {
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  if (kind === 'clone') {
    ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(cx - 5, cy - 3, 6, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(cx - 11, cy + 4, 12, 9);
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(cx + 4, cy - 5, 6, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(cx - 2, cy + 2, 12, 10);
  } else if (kind === 'gordo') {
    ctx.beginPath(); ctx.arc(cx, cy + 3, 11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy - 11, 5, 0, Math.PI * 2); ctx.fill();
  } else if (kind === 'palaxl') {
    ctx.beginPath(); ctx.ellipse(cx + 2, cy - 4, 9, 11, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx - 4, cy + 4); ctx.lineTo(cx - 11, cy + 13); ctx.stroke();
  } else if (kind === 'hielo') {
    for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3; ctx.beginPath(); ctx.moveTo(cx - Math.cos(a) * 12, cy - Math.sin(a) * 12); ctx.lineTo(cx + Math.cos(a) * 12, cy + Math.sin(a) * 12); ctx.stroke(); }
  } else {
    ctx.beginPath();
    ctx.moveTo(cx + 3, cy - 15); ctx.lineTo(cx - 8, cy + 2); ctx.lineTo(cx - 1, cy + 2);
    ctx.lineTo(cx - 4, cy + 15); ctx.lineTo(cx + 8, cy - 3); ctx.lineTo(cx + 1, cy - 3); ctx.closePath();
    ctx.fill();
  }
}

function drawSprintAbility(me) {
  const right = cam.team !== 1;
  const cx = right ? VIEW_W - 58 : 58, cy = VIEW_H - 64, r = 26;
  const isAct = !!me.active;
  const active = isAct ? me.activeT > 0 : me.sprintActiveTimer > 0;
  const cd = isAct ? me.activeCd : me.sprintCooldown;
  const cdMax = isAct ? ACTIVE_COOLDOWN : (me.sprintCdMax || SPRINT_COOLDOWN);
  const ready = cd === 0;
  const tint = isAct ? '#b79cff' : COLORS.ball;
  ctx.beginPath(); ctx.arc(cx, cy, r + 3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(8, 19, 31, 0.88)'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = ready || active ? (isAct ? 'rgba(160, 120, 255, 0.18)' : 'rgba(228, 255, 58, 0.14)') : 'rgba(255,255,255,0.04)'; ctx.fill();
  drawAbilityGlyph(isAct ? me.active : 'sprint', cx, cy, ready || active ? tint : '#6c7f92');
  if (!ready && !active) {
    const k = cd / cdMax;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k);
    ctx.closePath();
    ctx.fillStyle = 'rgba(4, 10, 20, 0.62)'; ctx.fill();
    ctx.fillStyle = '#eef3f8';
    ctx.font = `700 17px ${FONT_COND}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(Math.ceil(cd / 60), cx, cy + 1);
  }
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = active ? tint : (ready ? (isAct ? 'rgba(183, 156, 255, 0.8)' : 'rgba(228, 255, 58, 0.7)') : 'rgba(150, 190, 225, 0.3)');
  ctx.beginPath();
  const dur = isAct ? me.activeT / ACTIVE_DURATION : me.sprintActiveTimer / (me.sprintDurMax || SPRINT_DURATION);
  if (active) ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * dur);
  else ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.font = `600 12px ${FONT_COND}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#a9bdd0';
  ctx.fillText('Espacio', cx, cy + r + 17);
}

function drawCursor(me) {
  if (!mouseView.inside) return;
  const ratio = isHost ? (me.chargeFrames / MAX_CHARGE_FRAMES) : (localChargeFrames / MAX_CHARGE_FRAMES);
  const charging = isHost ? me.charging : localInput.charging;
  const lob = isHost ? me.lobMode : localInput.lobMode;
  const { x, y } = mouseView;
  ctx.strokeStyle = 'rgba(4, 10, 20, 0.7)';
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  if (charging) {
    ctx.strokeStyle = lob ? '#60beff' : (ratio > 0.85 ? '#ff8a2a' : COLORS.ball);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, 13, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ratio); ctx.stroke();
  }
}

function syncHud() {
  const servingTeam = state.players[state.serverSlot] ? state.players[state.serverSlot].team : 0;
  if (servingTeam !== fx.servingTeam) {
    fx.servingTeam = servingTeam;
    document.getElementById('sb-blue').classList.toggle('serving', servingTeam === 0);
    document.getElementById('sb-red').classList.toggle('serving', servingTeam === 1);

}

// ---------- Frame completo ----------
let lastRenderTime = performance.now();

function drawMapDynamics(layer) {
  const M = mapOf();
  if (layer === 'sky') {
    for (const bd of fx.birds) {
      const q = BP(bd.x, bd.z), s = 7 * q.s * 3, f = Math.sin(bd.ph) * 0.6;
      ctx.strokeStyle = 'rgba(30, 30, 40, 0.8)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(q.x - s, q.y - s * f); ctx.lineTo(q.x, q.y); ctx.lineTo(q.x + s, q.y - s * f); ctx.stroke();
    }
    return;
  }
  if (layer === 'ground') {
    if (state.ice) {
      const s = state.ice.side, a = clamp(state.ice.t / 30, 0, 1);
      const x0 = s === 0 ? COURT.x : COURT.netX, x1 = s === 0 ? COURT.netX : COURT.x + COURT.w;
      pathPts(ctx, [P(x0, COURT.y, 0), P(x1, COURT.y, 0), P(x1, COURT.y + COURT.h, 0), P(x0, COURT.y + COURT.h, 0)]);
      ctx.fillStyle = `rgba(200, 240, 255, ${0.3 * a})`; ctx.fill();
      ctx.strokeStyle = `rgba(255, 255, 255, ${0.35 * a})`; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let k = 0; k < 14; k++) { const x = x0 + ((k * 97) % (x1 - x0)), y = COURT.y + ((k * 131) % COURT.h); const p0 = P(x, y, 0), p1 = P(x + 30, y + 12, 0); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); }
      ctx.stroke();
    }
    for (const e of state.embers) {
      const c = P(e.x, e.y, 0), a = clamp(e.t / 40, 0, 1);
      pathPts(ctx, groundCircle(e.x, e.y, 22, 0, 24));
      const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, 26 * c.s);
      g.addColorStop(0, `rgba(255, 200, 80, ${0.75 * a})`); g.addColorStop(0.6, `rgba(255, 90, 20, ${0.5 * a})`); g.addColorStop(1, 'rgba(120, 20, 0, 0)');
      ctx.fillStyle = g; ctx.fill();
    }
    for (const bo of state.bolts) {
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.02);
      const locked = bo.t <= 42;
      pathPts(ctx, groundCircle(bo.x, bo.y, 30, 0, 30));
      ctx.fillStyle = `rgba(255, 240, 120, ${locked ? 0.3 : 0.12 + 0.1 * pulse})`; ctx.fill();
      ctx.strokeStyle = `rgba(255, 245, 160, ${0.6 + 0.3 * pulse})`; ctx.lineWidth = locked ? 2.4 : 1.6; ctx.stroke();
    }
    return;
  }
  if (layer === 'air') {
    // Nubes de tormenta sobre los avisos y descargas
    for (const bo of state.bolts) {
      const c = P(bo.x, bo.y, 300);
      ctx.fillStyle = 'rgba(50, 55, 75, 0.75)';
      for (const [dx, dy, r] of [[-16, 0, 13], [0, -5, 17], [16, 0, 13]]) { ctx.beginPath(); ctx.arc(c.x + dx * c.s, c.y + dy * c.s, r * c.s, 0, Math.PI * 2); ctx.fill(); }
    }
    for (const st of fx.strikes) {
      const a = 1 - st.t / 26;
      const top = P(st.x, st.y, 300), bot = P(st.x, st.y, 0);
      ctx.strokeStyle = `rgba(255, 255, 210, ${a})`; ctx.lineWidth = 3.2; ctx.lineJoin = 'miter';
      ctx.beginPath(); ctx.moveTo(top.x, top.y);
      for (let k = 1; k <= 6; k++) { const t = k / 6; ctx.lineTo(lerp(top.x, bot.x, t) + (k % 2 ? 8 : -8) * (k < 6 ? 1 : 0), lerp(top.y, bot.y, t)); }
      ctx.stroke();
    }
    for (const s of fx.sparks) {
      const q = P(s.x, s.y, s.z);
      ctx.fillStyle = s.fire ? `rgba(255, ${120 + Math.random() * 80}, 30, ${1 - s.t / s.max})` : s.elec ? `rgba(160, 220, 255, ${1 - s.t / s.max})` : `rgba(255, 240, 180, ${1 - s.t / s.max})`;
      ctx.fillRect(q.x - 1.2, q.y - 1.2, 2.4, 2.4);
    }
    if (fx.rain.length) {
      ctx.strokeStyle = 'rgba(200, 220, 240, 0.22)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (const d of fx.rain) { const a = P(d.x, d.y, d.z), b = P(d.x, d.y + 2, d.z + 14); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
      ctx.stroke();
    }
    if (fx.streaks.length) {
      ctx.strokeStyle = 'rgba(235, 242, 250, 0.35)'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (const s of fx.streaks) { const a = P(s.x, s.y, s.z), b = P(s.x, s.y - Math.sign(state.gust.w || 1) * 60, s.z); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
      ctx.stroke();
    }
  }
}

function setWorldTransform(S, sx, sy) {
  ctx.setTransform(S, 0, 0, S, sx * S, sy * S);
  const v = fx.view;
  if (v.rot || v.oy || v.k !== 1) {
    ctx.translate(VIEW_W / 2, VIEW_H / 2 + v.oy);
    ctx.rotate(v.rot);
    ctx.scale(v.k, v.k);
    ctx.translate(-VIEW_W / 2, -VIEW_H / 2);
  }
}

function drawWorld(dt, now, which, me) {
  const S = renderScale;
  const sx = fx.shake ? (Math.random() - 0.5) * fx.shake : 0;
  const sy = fx.shake ? (Math.random() - 0.5) * fx.shake : 0;
  const inReplay = which === 'replay';

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#071019';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  setWorldTransform(S, sx, sy);
  ctx.drawImage(LAYERS[which].st, 0, 0, VIEW_W, VIEW_H);
  drawMapDynamics('sky');
  drawRipples(['F', 'L', 'R']);

  // --- Suelo ---
  const players = state.players;
  if (!inReplay) drawServeBox();
  drawMapDynamics('ground');
  const celebKind = p => CELEB_KIND[p.lookId] || 'fist';
  const built = players.map((p, idx) => p.out ? null : buildPlayerParts(p, idx, dt * (inReplay ? 0.45 : 1), now, fx.players[idx],
    fx.celeb && !inReplay && p.team === fx.celeb.team ? { celeb: { kind: celebKind(p), t: fx.celeb.t } } : {}));
  const builtClones = players.map((p, idx) => {
    if (p.out || !p.clone) return null;
    const look = { ...lookOf(p), ...SHADOW_LOOK_COLORS, extras: {}, paddle: { ...lookOf(p).paddle, face: '#2a2048', rim: '#9d7bff' } };
    const fake = { ...p, x: p.clone.x, y: p.clone.y, clone: null };
    const bc = buildPlayerParts(fake, idx, dt, now, fx.clones[idx], { look });
    bc.fake = fake;
    return bc;
  });
  players.forEach(p => { if (!p.out) drawPlayerShadows(p); });
  drawBallShadows(state.ball);
  drawGroundFx();
  players.forEach((p, idx) => { if (!p.out) drawPlayerRing(p, idx); });
  if (!inReplay) {
    players.forEach((p, idx) => { if (!p.out) drawReach(p, idx, built[idx].charging); });
    drawLandingMarker();
    drawAimGuide(me, 'ground');
  }

  const b = state.ball;
  const bh = b.z * ZS;
  if (bh > 30 && (state.phase === 'PLAY' || inReplay)) {
    const g0 = P(b.x, b.y, 0), g1 = P(b.x, b.y, bh);
    ctx.setLineDash([2, 4]);
    ctx.strokeStyle = 'rgba(228, 255, 58, 0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(g0.x, g0.y); ctx.lineTo(g1.x, g1.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // --- Objetos con profundidad: lado lejano de la red, red, lado cercano ---
  const items = [];
  players.forEach((p, idx) => {
    if (p.out) return;
    for (const it of drawPlayer(p, idx, built[idx])) { it.x = p.x; items.push(it); }
    const bc = builtClones[idx];
    if (bc) for (const it of drawPlayer(bc.fake, idx, bc)) {
      const d0 = it.draw;
      it.draw = () => { ctx.save(); ctx.globalAlpha = 0.78; d0(); ctx.restore(); };
      it.x = bc.fake.x; items.push(it);
    }
  });
  items.push(...ballItems(), ...particleItems(), ...impactItems());
  const camLeft = cam.C.x < COURT.netX;
  const far = [], near = [];
  for (const it of items) ((it.x < COURT.netX) === camLeft ? near : far).push(it);
  far.sort((a, c) => c.d - a.d);
  near.sort((a, c) => c.d - a.d);
  for (const it of far) it.draw();
  drawNet();
  for (const it of near) it.draw();

  if (!inReplay) drawAimGuide(me, 'arc');
  drawMapDynamics('air');

  // --- Primer plano: pared cercana translúcida + viñeta ---
  setWorldTransform(S, sx, sy);
  ctx.drawImage(LAYERS[which].fg, 0, 0, VIEW_W, VIEW_H);
  setWorldTransform(S, sx, sy);
  drawRipples(['N']);
  return built;
}

function render(now) {
  const me = state.players[mySlot] || state.players[0];
  if (!cam.ready || cam.team !== me.team) {
    setupCamera(me.team);
    LAYERS.main.key = LAYERS.replay.key = '';
    updateAimFromMouse();
    document.getElementById('scorebug').classList.toggle('flip', me.team === 1);
    document.getElementById('status-text').classList.toggle('flip', me.team === 1);
  }

  const dt = clamp((now - lastRenderTime) / (1000 / 60), 0.1, 3);
  lastRenderTime = now;
  detectStateEvents();
  updateFx(dt);
  syncHud();
  updateScoreUI();
  syncOverlay();

  // Inclinación de la cancha de Atlas (se ve como un leve giro de cámara)
  const tilt = state.tilt.t > 0 ? Math.min(1, state.tilt.t / 30, (240 - state.tilt.t) / 30 + 0.0001) : 0;
  const targetRot = state.tilt.x * 0.03 * tilt, targetOy = state.tilt.y * 10 * tilt;
  fx.view.rot = lerp(fx.view.rot, targetRot, clamp(0.1 * dt, 0, 1));
  fx.view.oy = lerp(fx.view.oy, targetOy, clamp(0.1 * dt, 0, 1));
  fx.view.k = 1 + Math.abs(fx.view.rot) * 1.6;
  if (Math.abs(fx.view.rot) < 1e-4) fx.view.rot = 0;
  if (Math.abs(fx.view.oy) < 0.01) fx.view.oy = 0;
  if (fx.view.rot || fx.view.oy) updateAimFromMouse();

  const which = fx.replay ? 'replay' : 'main';
  if (LAYERS[which].key !== layerKey(which)) rebuildLayers(which);
  let saved = null;
  if (fx.replay) {
    const fr = fx.replay.frames[Math.min(fx.replay.frames.length - 1, Math.floor(fx.replay.t))];
    saved = { ball: state.ball, players: state.players, ice: state.ice };
    state.ball = fr.ball; state.players = fr.players; state.ice = fr.ice;
  }
  let built;
  Object.assign(cam, CAMS[which]);
  try {
    built = drawWorld(dt, now, which, me);
  } finally {
    if (saved) Object.assign(state, saved);
    Object.assign(cam, CAMS.main);
  }
  const S = renderScale;

  // --- HUD ---
  ctx.setTransform(S, 0, 0, S, 0, 0);
  if (fx.replay) {
    ctx.fillStyle = '#05080d';
    ctx.fillRect(0, 0, VIEW_W, 46); ctx.fillRect(0, VIEW_H - 46, VIEW_W, 46);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    ctx.font = `700 22px ${FONT_COND}`;
    const tw = ctx.measureText('Repetición').width;
    ctx.fillStyle = '#ff4d4d'; ctx.beginPath(); ctx.arc(VIEW_W / 2 - tw / 2 - 14, VIEW_H - 23, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f2f6fa'; ctx.fillText('Repetición', VIEW_W / 2, VIEW_H - 22);
    ctx.font = `500 15px ${FONT_BODY}`; ctx.fillStyle = '#c6d4e1';
    ctx.fillText(fx.replay.reason, VIEW_W / 2, 24);
  } else {
    state.players.forEach((p, idx) => { if (!p.out && built[idx]) drawNameplate(p, idx, built[idx]); });
    drawTalk(built);
    if (state.screen === 'play') {
      drawBanner();
      drawSprintAbility(me);
      drawCursor(me);
    }
  }
  if (fx.flash > 0) {
    ctx.fillStyle = `rgba(255, 255, 255, ${fx.flash * 0.55})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

// Globo de diálogo sobre la cabeza
function drawTalk(built) {
  const t = fx.talk;
  if (!t) return;
  const p = state.players[t.slot];
  if (!p || p.out || !built[t.slot]) return;
  const anchorZ = Math.max(98, built[t.slot].pf.pose.z + 58) + upLvl(p, 'sombrero') * 7;
  const top = P(p.x, p.y, anchorZ * scaleOf(p) * lookOf(p).body.h + 16);
  const a = clamp(Math.min(t.t / 6, (140 - t.t) / 16), 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = `600 14px ${FONT_BODY}`;
  const w = ctx.measureText(t.text).width + 20, h = 26;
  const x = clamp(top.x - w / 2, 8, VIEW_W - w - 8), y = top.y - 34 - h;
  roundRect(x, y, w, h, 9);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(top.x - 6, y + h - 1); ctx.lineTo(top.x, y + h + 8); ctx.lineTo(top.x + 6, y + h - 1); ctx.fill();
  ctx.fillStyle = '#0b1a29'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(t.text, x + w / 2, y + h / 2 + 1);
  ctx.restore();
}

  if (sk > 1) return 'Nivel: más bravos que los bots originales.';

}

}

function viewChampion() {
  return `<div class="ov-panel">
    <div class="ov-title">¡Campeones del club!</div>
    <div class="ov-sub">Le ganaron a los ${BOSSES.length} jefes, incluido Zeus.</div>
    ${routeHtml(-1, BOSSES.length)}
    <div class="row">${hostButtons('restart', 'Nuevo torneo')}</div>
  </div>`;
}

function viewSetover() {
  const r = state.result || { winner: 0, games: [6, 0] };
  const myTeam = (state.players[mySlot] || {}).team || 0;
  const won = r.winner === myTeam;
  return `<div class="ov-panel">
    <div class="ov-title">${won ? '¡Ganaron el set!' : 'Perdieron el set'}</div>
    <div class="ov-sub">Set para el equipo ${r.winner === 0 ? 'azul' : 'rojo'}, ${r.games[0]}-${r.games[1]}${r.tiebreak ? ' con tie-break' : ''}. Sets en la sesión: azul ${state.sets[0]}, rojo ${state.sets[1]}.</div>
    <div class="row">${hostButtons('again', 'Jugar otro set')}</div>
  </div>`;
}

const VIEWS = { connecting: viewConnecting, menu: viewMenu, lobby: viewLobby, route: viewRoute, shop: viewShop, shop2: viewShop2, lost: viewLost, champion: viewChampion, setover: viewSetover };

function syncOverlay() {
  const view = uiMenuOpen ? 'menu' : (!isHost && !gotHostState ? 'connecting' : state.screen);
  if (!uiMenuOpen && state.screen !== lastScreenSeen) {
    const s = state.screen;
    const myTeam = (state.players[mySlot] || {}).team || 0;
    if (s === 'shop' || s === 'champion') playJingle(true);
    else if (s === 'lost') playJingle(false);
    else if (s === 'setover' && state.result) playJingle(state.result.winner === myTeam);
  }
  lastScreenSeen = state.screen;

  if (!VIEWS[view]) {
    if (overlayKey !== 'play') {
      overlayEl.classList.remove('show');
      overlayEl.innerHTML = '';
      overlayKey = 'play';
    }
    return;
  }
  const data = view === 'menu' ? [menuSel.char, menuSel.mode, menuSel.diff, netMsg]
    : [state.roomCode, state.mode, state.run, state.result, state.sets, mySlot, isHost, state.map, state.vote,
       state.players.map(p => [p.name, p.isBot, p.money, p.up, p.team, p.active, p.ready, p.vote, p.out])];
  const key = view + '|' + JSON.stringify(data);
  if (key === overlayKey) return;
  overlayKey = key;
  const scroll = overlayEl.scrollTop;
  overlayEl.innerHTML = VIEWS[view]();
  overlayEl.classList.add('show');
  overlayEl.scrollTop = scroll;
  overlayEl.querySelectorAll('canvas[data-look]').forEach(cv => renderPortrait(cv, cv.dataset.look));
}

overlayEl.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  ensureAudio();
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case 'char': chooseChar(v); break;
    case 'mode': menuSel.mode = v; break;
    case 'diff': menuSel.diff = Number(v); break;
    case 'solo': playSolo(); break;
    case 'host': setNetMsg(''); createRoom(); break;
    case 'join': joinRoom(); break;
    case 'start': if (isHost) { if (state.mode === 'run') startRun(); else startFriendly(); } break;
    case 'buy':
      if (isHost) tryBuy(mySlot, v);
      else if (hostConn && hostConn.open) hostConn.send({ type: 'buy', id: v });
      break;
    case 'route': if (isHost) { state.run.boss++; setMap(BOSSES[state.run.boss].map); state.screen = 'route'; } break;
    case 'go': if (isHost) startBossMatch(); break;
    case 'vote':
      if (isHost) setVote(mySlot, v);
      else if (hostConn && hostConn.open) hostConn.send({ type: 'vote', map: v });
      break;
    case 'ready':
      if (isHost) setReady(mySlot);
      else if (hostConn && hostConn.open) hostConn.send({ type: 'ready' });
      break;
    case 'restart': if (isHost) startRun(); break;
    case 'again': if (isHost) startFriendly(); break;
    case 'menu': openMenu(); setNetMsg(''); break;
  }
  overlayKey = '';
});
overlayEl.addEventListener('input', e => {
  if (e.target.id === 'room-code-input') menuSel.code = e.target.value;
});
overlayEl.addEventListener('keydown', e => {
  if (e.target.id === 'room-code-input' && e.key === 'Enter') joinRoom();
});

// Loop fijo a 60 FPS para la física; el dibujo va al ritmo de la pantalla
let lastTime = performance.now();
let accumulator = 0;
const STEP = 1000 / 60;

function broadcastState() {
  if (!isHost) return;
  Object.values(connections).forEach(sendStateTo);
}

function runSteps(now) {
  const delta = Math.min(now - lastTime, 250);
  lastTime = now;
  accumulator += delta;
  let n = 0;
  while (accumulator >= STEP && n < 15) {
    stepPhysics();
    if (isHost) recordFrame();
    accumulator -= STEP;
    n++;
  }
  if (accumulator > STEP) accumulator = 0;
  if (n > 0) broadcastState();   // un envío por tanda basta
}

function gameLoop(now) {
  runSteps(now);
  render(now);
  requestAnimationFrame(gameLoop);
}

// Con la pestaña oculta (por ejemplo, al ir a WhatsApp a pasar el código) el navegador
// detiene requestAnimationFrame. Este reloj en un Worker mantiene la física y la red vivas.
(function startBackgroundTicker() {
  const tick = () => { if (document.hidden) runSteps(performance.now()); };
  try {
    const url = URL.createObjectURL(new Blob(['setInterval(() => postMessage(0), 16);'], { type: 'text/javascript' }));
    const w = new Worker(url);
    w.onmessage = tick;
  } catch (e) {
    setInterval(tick, 16);
  }
})();

resizeCanvas();
chooseChar(menuSel.char);
setupServe(0);
state.bannerTimer = 0;
updateScoreUI();
requestAnimationFrame(gameLoop);
</script>
</body>
